# Waza quality configuration for the provider-neutral governance bundle.
# config/skills.json owns semantic class budgets; Waza independently validates
# local skill/eval quality and file ceilings. Model execution belongs to AI Hub.

tokens:
  warningThreshold: 450
  limits:
    defaults:
      "SKILL.md": 5000
      "skills/*/*/references/*.md": 15000
      "*.md": 2000
    overrides:
      "README.md": 3000
      "docs/*.md": 5000
      "docs/references/*.md": 15000
      "docs/prompts/*.md": 10000
      "docs/architecture/*.md": 10000
      "skills/agent-wide/personal/frontend-slides/STYLE_PRESETS.md": 3000
      # Per-class SKILL.md budgets are derived by GovernanceBundle from local tags;
      # config/skills.json owns numeric ceilings only. Waza remains the
      # independent 5k/15k file-ceiling gate.
      # AGENTS.md intentionally uses the default *.md limit (2000 tokens).

paths:
  skills: skills
  rules: rules
  commands: commands
