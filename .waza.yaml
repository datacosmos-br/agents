# Waza spec and token configuration for the provider-neutral governance bundle.
# config/skills.json owns semantic class budgets; Waza independently proves the
# projected schema, references, threshold, and file ceilings. Model execution
# belongs to AI Hub.

tokens:
  warningThreshold: 450
  limits:
    defaults:
      "SKILL.md": 5000
      "skills/*/*/references/*.md": 15000
      "*.md": 2000
    overrides:
      "README.md": 3000
      "docs/*.md": 5000
      "docs/references/*.md": 15000
      "docs/prompts/*.md": 10000
      "docs/architecture/*.md": 10000
      # Per-file exception entries are prohibited: file-specific budgets are
      # either class-owned (this table's glob classes) or bundle-owned via
      # config/skills.json usage classes through the Waza projection.

paths:
  skills: skills
  evals: evals

# Development-only schema values for Waza's offline spec validator. The root
# gate performs no authentication, model listing, or model execution.
# GovernanceBundle and the wheel never include this file.
defaults:
  engine: copilot-sdk
  model: gpt-5.4
