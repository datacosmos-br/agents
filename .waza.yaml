# Waza configuration for the canonical agents skill authority.
# Enforces independent file ceilings; agentsctl owns semantic class budgets.
# No external tool distributes or regenerates this authority.

defaults:
  model: aihub-primary

tokens:
  warningThreshold: 450
  fallbackLimit: 5000
  limits:
    defaults:
      "SKILL.md": 5000
      "skills/*/*/references/*.md": 15000
      "*.md": 2000
    overrides:
      "README.md": 3000
      "CLAUDE.md": 3000
      "GEMINI.md": 3000
      "docs/*.md": 5000
      "docs/references/*.md": 15000
      "docs/prompts/*.md": 10000
      "docs/architecture/*.md": 10000
      "skills/agent-wide/frontend-slides/STYLE_PRESETS.md": 3000
      # Per-class SKILL.md budgets are derived by agentsctl from local tags;
      # config/skills.json owns numeric ceilings only. Waza remains the
      # independent 5k/15k file-ceiling gate.
      # AGENTS.md intentionally uses the default *.md limit (2000 tokens).

paths:
  skills: skills
