name: Run Governance Gates

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'agents/**'
      - 'commands/**'
      - 'config/**'
      - 'docs/**'
      - 'evals/**'
      - 'rules/**'
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
      - '.jscpd.json'
      - '.mise.toml'
      - '.waza.yaml'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'mise.lock'
      - 'package.json'
      - 'AGENTS.md'
      - 'ECOSYSTEM.md'
      - 'Makefile'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [dev, main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'agents/**'
      - 'commands/**'
      - 'config/**'
      - 'docs/**'
      - 'evals/**'
      - 'rules/**'
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
      - '.jscpd.json'
      - '.mise.toml'
      - '.waza.yaml'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'mise.lock'
      - 'package.json'
      - 'AGENTS.md'
      - 'ECOSYSTEM.md'
      - 'Makefile'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[WIP]')) ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.event.pull_request.title, '[WIP]'))
    name: Runtime-first governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            testmon-${{ runner.os }}-
      - name: Provision declared tools and environment
        run: timeout --signal=TERM --kill-after=2s 118s make setup
      - name: Run fast external gates and make test
        run: timeout --signal=TERM --kill-after=2s 118s make ci
