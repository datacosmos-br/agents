name: Run Skill Evaluations

on:
  push:
    branches: [dev]
    paths:
      - 'evals/**'
      - 'skills/**'
      - 'commands/**'
      - 'agents/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'bin/**'
      - 'rules/**'
      - 'docs/**'
      - 'Makefile'
      - '.waza.yaml'
      - '.mise.toml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'UNIVERSAL_CORE.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [dev, main]
    paths:
      - 'evals/**'
      - 'skills/**'
      - 'commands/**'
      - 'agents/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'bin/**'
      - 'rules/**'
      - 'docs/**'
      - 'Makefile'
      - '.waza.yaml'
      - '.mise.toml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'UNIVERSAL_CORE.md'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  eval:
    name: Run Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install pinned Waza
        run: |
          install -d -m 700 "$HOME/bin"
          install -d -m 700 "$HOME/.local/state/waza-install"
          curl --fail --location \
            --output "$HOME/.local/state/waza-install/waza-linux-amd64" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/waza-linux-amd64
          curl --fail --location \
            --output "$HOME/.local/state/waza-install/checksums.txt" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/checksums.txt
          cd "$HOME/.local/state/waza-install"
          grep ' waza-linux-amd64$' checksums.txt | sha256sum --check --strict -
          install -m 755 waza-linux-amd64 "$HOME/bin/waza"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run complete offline pipeline
        run: |
          uv sync --all-groups
          make ci
