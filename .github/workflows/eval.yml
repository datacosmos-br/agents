name: Run Skill Evaluations

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'evals/**'
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'mcp/**'
      - 'bin/**'
      - 'hooks/**'
      - 'rules/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  eval:
    name: Run Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
      - name: Install pinned Waza
        run: |
          install -d -m 700 "$HOME/bin"
          install -d -m 700 "$HOME/.local/state/waza-install"
          curl --fail --location --retry 3 \
            --output "$HOME/.local/state/waza-install/waza-linux-amd64" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/waza-linux-amd64
          curl --fail --location --retry 3 \
            --output "$HOME/.local/state/waza-install/checksums.txt" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/checksums.txt
          cd "$HOME/.local/state/waza-install"
          grep ' waza-linux-amd64$' checksums.txt | sha256sum --check --strict -
          install -m 755 waza-linux-amd64 "$HOME/bin/waza"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run offline governance gates
        run: |
          uv sync --all-groups
          uv run agentsctl validate
          waza tokens check ./skills --strict
          make spec
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results
          path: ./results
          retention-days: 30
