name: Run Governance Gates

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'agents/**'
      - 'commands/**'
      - 'config/**'
      - 'docs/**'
      - 'evals/**'
      - 'rules/**'
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'ast-grep-rule-tests/**'
      - 'ast-grep-rules/**'
      - '.gitignore'
      - '.jscpd.json'
      - '.mise.toml'
      - '.waza.yaml'
      - 'mise.lock'
      - 'sgconfig.yml'
      - 'AGENTS.md'
      - 'ECOSYSTEM.md'
      - 'Makefile'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [dev, main]
    paths:
      - '.github/dependabot.yml'
      - '.github/workflows/**'
      - 'agents/**'
      - 'commands/**'
      - 'config/**'
      - 'docs/**'
      - 'evals/**'
      - 'rules/**'
      - 'skills/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'ast-grep-rule-tests/**'
      - 'ast-grep-rules/**'
      - '.gitignore'
      - '.jscpd.json'
      - '.mise.toml'
      - '.waza.yaml'
      - 'mise.lock'
      - 'sgconfig.yml'
      - 'AGENTS.md'
      - 'ECOSYSTEM.md'
      - 'Makefile'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, '[WIP]')) ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.event.pull_request.title, '[WIP]'))
    name: Runtime-first governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agents-governance/pytest/.testmondata
          key: testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            testmon-${{ runner.os }}-
      - name: Provision declared tools and environment
        run: make setup
      - name: Run runtime-first public gates
        run: make ci
