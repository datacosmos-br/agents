name: Publish Governance Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: governance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agents-governance/pytest/.testmondata
          key: release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            release-testmon-${{ runner.os }}-
      - name: Provision declared tools and environment
        run: make setup APPLY=Y
      - name: Run complete runtime-first pipeline
        run: make ci APPLY=Y
      - name: Publish validated immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish APPLY=Y
