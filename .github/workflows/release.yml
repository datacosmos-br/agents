name: Publish Governance Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: governance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .testmondata
          key: release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            release-testmon-${{ runner.os }}-
      - name: Provision declared tools and environment
        run: timeout --signal=TERM --kill-after=2s 118s make setup
      - name: Run fast external gates and make test
        run: timeout --signal=TERM --kill-after=2s 118s make ci
      - name: Publish validated immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout --signal=TERM --kill-after=2s 118s make publish
