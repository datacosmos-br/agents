name: Publish Governance Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: governance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Prepare canonical shell storage
        run: install -d -m 700 "$HOME/tmp"
      - name: Install pinned Waza
        run: |
          install -d -m 700 "$HOME/bin"
          install -d -m 700 "$HOME/.local/state/waza-install"
          curl --fail --location \
            --output "$HOME/.local/state/waza-install/waza-linux-amd64" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/waza-linux-amd64
          curl --fail --location \
            --output "$HOME/.local/state/waza-install/checksums.txt" \
            https://github.com/microsoft/waza/releases/download/v0.38.7/checksums.txt
          cd "$HOME/.local/state/waza-install"
          grep ' waza-linux-amd64$' checksums.txt | sha256sum --check --strict -
          install -m 755 waza-linux-amd64 "$HOME/bin/waza"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Run complete offline pipeline
        run: |
          uv sync --all-groups
          make ci
      - name: Build release artifacts
        run: uv build
      - name: Write checksums
        run: cd dist && sha256sum ./* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
