name: Publish Governance Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: governance-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agents-governance/pytest/.testmondata
          key: release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            release-testmon-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            release-testmon-${{ runner.os }}-
      - name: Provision declared tools and environment
        run: make setup
      - name: Run fast external gates and make test
        run: make ci
      - name: Publish validated immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish
