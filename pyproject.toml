[project]
name = "agents-governance"
version = "0.1.0"
description = "Canonical validation and projection engine for ~/.agents"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
agentsctl = "agents_governance.cli:main"
agents-security = "agents_governance.security:main"

[tool.agents-governance.security]
fixture-roots = ["evals"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pyright>=1.1.404,<2",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_governance"]

[tool.hatch.build.targets.sdist]
only-include = [
  "Makefile",
  "README.md",
  "config",
  "pyproject.toml",
  "src",
  "tests",
  "uv.lock",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
