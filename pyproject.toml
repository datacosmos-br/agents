[project]
name = "agents-governance"
version = "0.5.0"
description = "Provider-neutral semantic governance bundle"
requires-python = ">=3.13"
dependencies = [
  "PyYAML>=6.0.2,<7",
  "flext-core @ git+https://github.com/flext-sh/flext-core.git@0.12.0-dev",
]

[dependency-groups]
dev = [
  "anthropic>=0.39.0,<1",
  "mcp>=1.1.0,<3",
  "mypy>=1.17,<3",
  "playwright>=1,<2",
  "pyrefly>=1.3.0",
  "pyright>=1.1.414,<2",
  "pytest>=8.3,<10",
  "pytest-testmon>=2.0,<3",
  "ruff>=0.12,<1",
  "rumdl>=0.2.73",
  "types-PyYAML>=6.0.12,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agents_governance"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "agents_governance/_data/config"
"skills" = "agents_governance/_data/skills"
"rules" = "agents_governance/_data/rules"
"commands" = "agents_governance/_data/commands"
"evals" = "agents_governance/_data/evals"
"agents" = "agents_governance/_data/agents"
"docs/adr" = "agents_governance/_data/docs/adr"
"docs/research" = "agents_governance/_data/docs/research"
"AGENTS.md" = "agents_governance/_data/AGENTS.md"
"README.md" = "agents_governance/_data/README.md"
"docs/security/security-triage.md" = "agents_governance/_data/docs/security/security-triage.md"

[tool.hatch.build.targets.sdist]
only-include = [
  "AGENTS.md",
  "Makefile",
  "README.md",
  ".jscpd.json",
  ".mise.toml",
  ".waza.yaml",
  "agents",
  "ast-grep-rule-tests",
  "ast-grep-rules",
  "commands",
  "config",
  ".github/workflows/eval.yml",
  ".github/workflows/release.yml",
  "docs/adr",
  "docs/research",
  "docs/security/security-triage.md",
  "evals",
  "mise.lock",
  "pyproject.toml",
  "rules",
  "skills",
  "src",
  "tests",
  "tools",
  "uv.lock",
  "sgconfig.yml",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-config --strict-markers"
pythonpath = ["tools"]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.coverage.run]
core = "ctrace"

[tool.pyright]
include = ["src", "tests", "tools"]
extraPaths = ["tools"]
venvPath = "."
venv = ".venv"

[tool.mypy]
mypy_path = "tools"

[tool.pyrefly]
disable-project-excludes-heuristics = true
project-excludes = [
  "**/*_pb2*.py",
  "**/*_pb2_grpc*.py",
  "**/.venv/**",
  "**/__pycache__",
  "**/__pyrefly_virtual__/**",
  "**/node_modules",
  "**/site-packages/**",
  "**/typings/**",
  "**/vendor/**",
  "**/venv/**",
  ".venv/**",
  "typings/**",
  "vendor/**",
]
project-includes = [
  "tests/**/*.py*",
  "tools/**/*.py*",
  "src/**/*.py*",
]
python-version = "3.13"
search-path = ["src", "tools", "."]
use-ignore-files = false

[tool.pyrefly.errors]
bad-argument-count = "error"
bad-argument-type = "error"
bad-assignment = "error"
bad-class-definition = "error"
bad-context-manager = "error"
bad-dunder-all = "error"
bad-function-definition = "error"
bad-index = "error"
bad-instantiation = "error"
bad-keyword-argument = "error"
bad-match = "error"
bad-param-name-override = "error"
bad-raise = "error"
bad-return = "error"
bad-specialization = "error"
bad-typed-dict = "error"
bad-typed-dict-key = "error"
bad-unpacking = "error"
deprecated = "error"
implicit-abstract-class = "error"
implicit-any = "error"
implicit-import = "error"
implicitly-defined-attribute = "error"
inconsistent-inheritance = "error"
inconsistent-overload = "error"
inconsistent-overload-default = "error"
invalid-annotation = "error"
invalid-argument = "error"
invalid-decorator = "error"
invalid-inheritance = "error"
invalid-literal = "error"
invalid-overload = "error"
invalid-param-spec = "error"
invalid-pattern = "error"
invalid-self-type = "error"
invalid-super-call = "error"
invalid-type-alias = "error"
invalid-type-var = "error"
invalid-type-var-tuple = "error"
invalid-variance = "error"
invalid-yield = "error"
missing-argument = "error"
missing-attribute = "error"
missing-import = "error"
missing-module-attribute = "error"
missing-override-decorator = "error"
missing-source = "error"
missing-source-for-stubs = "error"
no-access = "error"
no-matching-overload = "error"
not-a-type = "error"
not-async = "error"
not-callable = "error"
not-iterable = "error"
not-required-key-access = "error"
open-unpacking = "error"
protocol-implicitly-defined-attribute = "error"
read-only = "error"
redefinition = "error"
redundant-cast = "error"
redundant-condition = "error"
unannotated-attribute = "error"
unannotated-parameter = "error"
unannotated-return = "error"
unbound-name = "error"
unexpected-keyword = "error"
unexpected-positional-argument = "error"
unknown-name = "error"
unnecessary-comparison = "error"
unnecessary-type-conversion = "error"
unreachable = "error"
unresolvable-dunder-all = "error"
unsafe-overlap = "error"
unsupported = "error"
unsupported-delete = "error"
unsupported-operation = "error"
untyped-import = "error"
unused-coroutine = "error"
unused-ignore = "error"
variance-mismatch = "error"
