[settings]
lockfile = true
locked = true
lockfile_platforms = ["linux-x64"]

[vars]
waza_version = "0.38.7"

[tools]
python = "3.13"
uv = "latest"
go = "1.26"
node = "24"
actionlint = "latest"
ast-grep = "latest"
bun = "latest"
gitleaks = "latest"
"npm:jscpd" = "latest"
"pipx:semgrep" = "latest"
shellcheck = "latest"
snyk = "latest"

[tools."go:github.com/microsoft/waza/cmd/waza"]
version = "{{ vars.waza_version }}"
install_env = { GOFLAGS = "-ldflags=-X=main.version={{ vars.waza_version }}" }
