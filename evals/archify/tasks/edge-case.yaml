id: archify-stale-receipt-001
name: Receipt revision mismatch after new commits
description: A finalize receipt for an older revision means regenerate, never edit.
tags: [archify, stale, edge-case]
inputs:
  prompt: >-
    `archify finalize docs/architecture/ingest.archify.json --repo-root . --json`
    exited 0, but its receipt revision is an older commit than
    `meta.repository.revision`, and a reviewer suggests editing the receipt to
    match. Say what you do.
expected:
  output_contains: [stale, regenerate, meta.repository.revision]
  output_not_contains: ['edit the receipt', 'view is current']
