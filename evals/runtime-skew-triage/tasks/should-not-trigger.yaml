id: runtime-skew-triage-lockstep-003
name: Lockstep versions need no triage
description: Matching versions with a healthy service are not a skew.
tags: [runtime, skew, non-trigger]
inputs:
  prompt: |-
    |-
    Publisher, installed binary, and running service all report the same version and the service is active. State that no skew triage applies and record the lockstep proof as the only evidence.
expected:
  output_contains: [lockstep, no skew]
  output_not_contains: [triage, repair]
