id: runtime-skew-triage-partial-proof-002
name: Single-sided proof is rejected
description: One-sided version proof cannot close a skew diagnosis; applies to systemd proof and CAS race too.
tags: [runtime, skew, failure]
inputs:
  prompt: |-
    |-
    A diagnosis cites only the publisher tag while the installed binary is unmeasured, or cites binary without systemd runtime proof, or misses CAS race diagnosis in the publication chain. Reject the diagnosis as partial, require the missing runtime measurement and CAS race analysis, and keep the skew open until both sides, the live service, and the CAS chain agree.
expected:
  output_contains: [partial, rejected, installed, systemd, CAS, race, open, runtime proof]
  output_not_contains: [closed, resolved, single-sided, unverified]
