name: caveman-eval
description: Concise evidence-preserving operator communication.
skill: caveman
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/caveman
  required_skills:
  - caveman
graders:
- type: prompt
  name: caveman-contract
  config:
    prompt: |-
      Grade the caveman response. Pass only when it puts the supplied failure first, preserves command, cwd,
      exit code, decisive output, and unrun gates exactly, and does so in no more
      than three plain sentences without filler. Reject softened status,
      adjectives, implementation detail, omitted evidence, or a success claim
      after the first required evidence item is absent.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
