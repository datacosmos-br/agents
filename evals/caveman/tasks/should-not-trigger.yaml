id: caveman-negative-001
name: Write deliberately ornate fiction
description: Do not force an evidence-status format onto explicitly creative prose.
tags: [caveman, anti-trigger]
inputs:
  prompt: >-
    Write a lush, atmospheric paragraph about a lighthouse during a storm. The
    requested output is fiction, not an operator status or technical document.
expected:
  output_not_contains: [exit code, decisive output, command evidence]
