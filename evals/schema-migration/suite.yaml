description: Atomic configuration-schema cutover decisions.
prompt: |-
  Grade the schema-migration response. Pass only when it defines one final schema, names producers and
  consumers to rewire, rejects the old format, deletes the superseded path,
  and shows that a second run changes nothing. Fail any dual-read, alias,
  fallback, competing or default-on-error value, repeated canonical default
  input, deprecation window, deferred cleanup, partial write, or normalized
  failure. Calculated defaults resolve once at the typed owner, and invalid
  input stops with its first cause before any write. When a mass population
  holds an object another owner controls with semantic differences and no
  approved rule, require that object to stay in place and one precise
  operator question naming its owner, difference and consumers. Reject
  authorization by sampling or superficial shape.
