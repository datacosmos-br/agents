id: config-divergent-population-001
name: Block an unadjudicated divergent population
description: Preserve divergent objects when a mass migration has no approved class rule.
tags: [config, migration, divergence, ownership, edge-case]
inputs:
  prompt: Replace 4,000 stored configuration objects. A sample matches the new
    schema, but one unmanifested object has a different owner and semantic fields;
    no approved transformation or disposition rule covers that divergence.
    Decide whether the sample authorizes the mass replacement and what happens to
    that object.
expected:
  output_contains: [preserve, operator, owner]
  output_not_contains: [sample authorizes the replacement, object overwritten, compatibility alias]
