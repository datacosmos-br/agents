id: config-cutover-001
name: Design an atomic nested-server cutover
description: Exercise configuration migration, schema cutover, and consumer rewiring.
tags: [config, schema, migration, cutover, idempotence, consumers, happy-path]
inputs:
  prompt: Migrate config.json from server_host/server_port to server.host/server.port through one configuration migration and atomic schema cutover with complete consumer rewiring. Name the owner, the persisted transformation, the producers and consumers rewired, the explicit old-format rejection, the deletion search, and the second run that changes nothing. Derive canonical calculated defaults once at the typed owner and do not retain equal consumer inputs, aliases, dual reads, fallback, competing defaults, or default-on-error behavior.
  files:
  - path: config.json
expected:
  output_contains: [idempotent, reject, consumer]
