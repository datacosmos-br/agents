id: ws-lifecycle-self-owned-001
name: Keep explicit self execution separate from dispatch
description: Use the repository Git owner when the operator explicitly retains execution.
tags: [gascity, workspace, git, self-owned, authority]
inputs:
  prompt: The operator explicitly says not to delegate this item and to execute it ourselves in the current authorized primary checkout with compatible WIP. No isolation is requested. The repository declares develop as its integration branch and selects Beads. Explain the workspace action and evidence, preserving the current context. Do not use make work or claim that Gas City dispatched an agent.
expected:
  output_contains: [work_dir, branch, SHA]
  output_not_contains: [dispatch completed, worktree creation is required]
