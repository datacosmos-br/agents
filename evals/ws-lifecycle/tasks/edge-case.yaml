id: ws-lifecycle-self-owned-001
name: Keep explicit self execution separate from dispatch
description: Use the repository Git owner when the operator explicitly retains execution.
tags: [gascity, workspace, git, self-owned, authority]
inputs:
  prompt: The operator explicitly says not to delegate this item and to execute it ourselves. The repository declares develop as its integration branch and selects Beads. Explain the workspace action and evidence. Do not use make work and do not claim Gas City dispatched an agent.
expected:
  output_contains: [git worktree add, origin/develop, work_dir, branch, SHA]
  output_not_contains: [make work, dispatch completed, gc sling]
