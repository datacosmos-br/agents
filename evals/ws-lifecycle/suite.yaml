description: Static workspace placement from declared Gas City configuration.
prompt: |-
  Grade the ws-lifecycle response. Pass only when it derives
  the city, rig, pinned Pack V2 import, agent, formula, provider, and physical
  workspace from the supplied city.toml and repository `.beads/` boundary while
  keeping the suspended runtime entirely static with zero workspace effects.
  Distinguish delegated execution
  through gc sling from an explicitly operator-authorized self-owned Git
  worktree, and reject make work or any mixing of those modes. Reject
  invented commands, unauthorized active dispatch, loose clones, temporary
  or cross-repository paths, symlinks, provider fallback, or mechanical
  command translation.
