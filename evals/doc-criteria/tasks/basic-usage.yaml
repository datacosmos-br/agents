id: doc-criteria-happy-path-001
name: Classify a cross-layer frontend feature
description: Derive the minimal document set from semantic and authority impact.
tags: [doc-criteria, artifact-selection, evidence-requirements, prd, adr, design, planning, happy-path]
inputs:
  prompt: |
    Apply semantic documentation criteria to the supplied change request.
    Return the required documents in creation order, explain the trigger for
    each, assign the listed concerns to the correct document, and state the
    measurable structural and approval gates before implementation.
  files:
  - path: change-request.md
expected:
  output_contains:
  - PRD
  - UI Specification
  - ADR
  - Design Document
  - Work Plan
  - acceptance criteria
  - no unnecessary documents
