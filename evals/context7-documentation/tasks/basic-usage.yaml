id: context7-documentation-happy-path-001
name: Resolve versioned Next.js middleware documentation
description: Use Context7 resolution before answering a version-sensitive API question.
tags: [documentation, libraries, frameworks, context7, versions, api, happy-path]
inputs:
  prompt: |
    Perform an up-to-date documentation lookup for the library/framework API in
    the supplied brief via Context7 MCP instead of remembered docs. Resolve
    the Context7 library ID first, select the closest official version-aware
    result, then query current documentation. State the selected ID/version and
    ground the minimal example in the returned documentation.
  files:
  - path: nextjs-question.md
expected:
  outcomes:
  - type: task_completed
  output_contains:
  - /vercel/next.js
  - Next.js 15
  - middleware
  - documentation
