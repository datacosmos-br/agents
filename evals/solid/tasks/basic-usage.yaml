id: solid-payment-boundary-001
name: Correct payment provider boundaries
description: Exercise SOLID principles, responsibility boundaries, and dependency direction on one real provider extension.
tags: [solid, srp, ocp, lsp, isp, dip, architecture, contracts, happy-path]
inputs:
  prompt: Apply the language-neutral $solid skill to correct the responsibility boundaries and dependency direction in payment-project. Add the already-required bank-transfer integration behind the existing contract without provider branching or catch-based normalization, keep the public contract and the first causal error, move every consumer, delete the superseded construction, and name the real commands that prove both providers. Leave syntax or framework detail to a child skill.
  files:
  - path: payment-project/AGENTS.md
  - path: payment-project/docs/architecture.md
  - path: payment-project/pyproject.toml
  - path: payment-project/src/payments/contracts.py
  - path: payment-project/src/payments/providers.py
  - path: payment-project/src/payments/checkout.py
  - path: payment-project/tests/test_authorizer_contract.py
  - path: payment-project/tests/test_checkout.py
expected:
  output_contains: [SRP, OCP, LSP, ISP, DIP, PaymentAuthorizer, ReceiptSink, CheckoutService, test_authorizer_contract, child skill]
