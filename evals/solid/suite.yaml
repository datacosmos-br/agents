description: SOLID applied only at touched boundaries, strict contracts, and no speculative structure.
prompt: |-
  Grade according to the scenario. For payment-project, pass only when the
  response reads project rules, architecture, implementation, and tests;
  evaluates SRP/OCP/LSP/ISP/DIP at the boundaries the change touches; reuses
  PaymentAuthorizer and ReceiptSink; removes provider branching and concrete
  construction from CheckoutService; keeps both providers to the authorizer
  contract; moves every consumer and deletes the old construction; and names
  the real commands that prove both providers. For the missing-project task,
  pass only when it refuses interfaces, factories and plugins without a
  current consumer. For the solid-state task, pass only when it summarizes
  the supplied science facts without software design analysis. Reject
  cargo-cult patterns, service locators, speculative plugins, weakened
  contracts, old/new coexistence, catch/retry/fallback normalization, partial
  rewiring, or a completion claim without a real run. Keep the decision
  language-neutral and leave syntax to a child skill.
