id: anti-hardcode-deployment-owner-001
name: Migrate embedded deployment values
description: Exercise configuration ownership, portable policy, and hardcode removal.
tags: [hardcode, configuration, runtime, happy-path]
inputs:
  prompt: Apply anti-hardcode to deployment.py through configuration ownership, portable policy, and complete hardcode removal. Move every confirmed value to one required typed owner fed only by the current process environment, delete the keyring, profile and default alternatives, and name the real CLI run that shows missing configuration fails loudly.
  files:
  - path: deployment.py
expected:
  output_contains: [RuntimeConfig, ConfigError, required, stderr, nonzero exit]
  output_not_contains: [os.getenv, default value, constants.py]
