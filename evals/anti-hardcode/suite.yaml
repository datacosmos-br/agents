description: Operational-value ownership, migration, and loud configuration failure.
prompt: |-
  Grade the anti-hardcode response. Pass only when it moves the embedded
  endpoint, database, model, and output path into one required typed
  RuntimeConfig owner, injects that owner into the consumer, deletes every
  literal and default lookup path, and shows through the real CLI that missing
  configuration raises ConfigError to stderr with a nonzero exit before any
  effect. Reject environment scraping, a constants module, duplicate defaults,
  keyring, profiles, compatibility aliases, fallback values, catch/manual exit
  normalization, or lexical deletion of a protocol invariant.
