id: pr-sheriff-inventory-triage-001
name: Triage every configured PR
description: Exercise pull-request review triage in the configured GitHub workflow.
tags: [pull-request, triage, review, checks, threads, integration, happy-path]
inputs:
  prompt: >-
    Perform pull-request review triage for the GitHub workflow in
    pr-inventory.yaml for the one configured private datacosmos-br repository,
    whose local project configuration explicitly selects AI Hub's managed-private
    access contract.
    Account for every PR and classify it from checks, reviews, threads, merge
    state, diff identity, and integration reachability. Before any remote effect,
    require ai-hub forge resolution, the active authorized gh account, sufficient
    repository permission, the exact github.com SSH repository URL, and a
    repository-local core.sshCommand. State
    the exact fail-closed commands required before landing. Recommend next
    actions only; Gas City and tracker runtime remain suspended, so do not invoke
    or propose them.
  files:
  - path: pr-inventory.yaml
expected:
  output_contains: ['#14', ready, ai-hub forge-resolve, ai-hub forge-doctor, active, gh, permission, 'git@github.com:', core.sshCommand, git ls-remote, --match-head-commit, '#15', blocked, duplicate CI owner, self-referential, unpinned, '|| true', make ci, '#16', superseded]
