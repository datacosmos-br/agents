id: pr-sheriff-inventory-triage-001
name: Triage every configured PR
description: Classify ready, blocked, and superseded PRs from complete static evidence.
tags: [pull-request, triage, review, checks, threads, integration, happy-path]
inputs:
  prompt: Triage pr-inventory.yaml for the one configured repository. Account for every PR and classify it from checks, reviews, threads, merge state, diff identity, and integration reachability. Recommend next actions only; Gas City and tracker runtime remain suspended, so do not invoke or propose them.
  files:
  - path: pr-inventory.yaml
expected:
  output_contains: ['#14', ready, '#15', blocked, '#16', superseded]
