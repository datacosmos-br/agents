id: pr-sheriff-local-branch-name-negative-001
name: Rename one unpushed local branch
description: Keep repository-wide PR triage out of a local naming request.
tags: [git, branch, anti-trigger]
inputs:
  prompt: Suggest a clearer name for one unpushed local branch. There is no pull request, remote review, check, thread, or merge decision.
expected:
  output_not_contains: [PR inventory, unresolved threads, merge state]
