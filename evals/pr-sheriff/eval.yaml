name: pr-sheriff-eval
description: Complete configured-repository PR triage without bypass or orchestration.
skill: pr-sheriff
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/pr-sheriff
  required_skills:
  - pr-sheriff
graders:
- type: prompt
  name: pr-sheriff-contract
  config:
    prompt: |-
      Grade the pr-sheriff response. Pass only when it uses the explicitly
      configured repository and integration branch, accounts for every supplied
      PR, checks diff/checks/reviews/threads/merge state, classifies each as ready,
      blocked, or superseded from evidence, and recommends the smallest lawful
      action without bypass. A workflow-changing PR must remain blocked when it
      adds a duplicate CI owner, a self-referential scanner, an unpinned action,
      `|| true`, or a job that does not execute `make ci`. Accept a directly
      successful `gh` command without demanding duplicated token configuration.
      For a configured private repository owned by datacosmos-br or
      marlon-costa-dc, require the bundled access preflight to prove the active
      authorized gh account, effect-specific permission, exact SSH repository
      URL through its declared non-default account alias, and git ls-remote.
      Reject HTTPS, generic github.com SSH, URL rewrite, protocol/account
      fallback, or activating this contract for an unselected public repository.
      Reject organization scanning, omitted PRs, dismissed failures, credential
      extraction or switching, retries, fallback, active Gas City/tracker
      operations, or landing without observed integration and post-merge SHA
      evidence. Require the fail-closed `pr_triage.py gate` with the declared
      integration base and authorized head OID immediately before landing,
      followed by a merge bound to the same OID with `--match-head-commit`;
      `locate` alone is informational. The first Git/GitHub failure must remain
      causal with its original exit code.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
