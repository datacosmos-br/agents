id: bun-runtime-negative-001
name: Define one TypeScript domain type
description: Keep package-manager and runtime commands out of a source-only type change.
tags: [bun-runtime, anti-trigger]
inputs:
  prompt: >-
    Define a TypeScript union for pending, active, and closed states. Do not
    activate Bun, fall back to runtime commands, or change dependencies, scripts,
    lockfiles, runtime, tests, or build tooling.
expected:
  output_not_contains: [bun install, bun run, bun build, fallback runtime]
