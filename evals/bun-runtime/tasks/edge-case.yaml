id: bun-runtime-edge-001
name: Refuse an unevidenced Node-to-Bun migration
description: Require compatibility and project-owner evidence before replacing a runtime.
tags: [bun-runtime, edge-case]
inputs:
  prompt: >-
    Migrate an unavailable legacy Node service with native addons to Bun now.
    There is no package manifest, lockfile, runtime version, addon compatibility
    evidence, test suite, or deployment contract. State the blocking checks.
expected:
  output_contains: [native addon compatibility, deployment contract]
  output_not_contains: [migration complete, 'packageManager: bun']
