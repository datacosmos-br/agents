name: bun-runtime-eval
description: Bun-owned install, run, test, and build decisions.
skill: bun-runtime
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/technology/bun-runtime
  required_skills:
  - bun-runtime
graders:
- type: prompt
  name: bun-runtime-contract
  config:
    prompt: |
      Grade the bun-runtime response. Pass only when it derives the runtime, package manager, lockfile, scripts,
      and reproducible commands from the supplied Bun project fixtures and does
      not introduce Node/npm as a parallel path. Reject generic migration advice
      or commands that ignore the declared package owner.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
