id: exa-search-happy-path-001
name: Find current primary sources for Rust cancellation
description: Use advanced filters and crawl a decisive technical source.
tags: [exa, search, web, research, crawling, filters, happy-path]
inputs:
  prompt: |
    Use Exa neural web search via MCP for these user research needs, selecting
    technical search rather than company research. Execute the supplied bounded request. Select the Exa
    tool that supports its publication-date and domain filters, return five
    results, then crawl the strongest primary source before summarizing its
    cancellation guidance with source attribution.
  files:
  - path: rust-search-request.md
expected:
  outcomes:
  - type: task_completed
  output_contains:
  - web_search_advanced_exa
  - startPublishedDate
  - includeDomains
  - crawling_exa
  - tokio.rs
