name: exa-search-eval
description: Semantic evaluation suite for exa-search.
skill: exa-search
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/tool/exa-search
  required_skills:
  - exa-search
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did Exa selection and retrieval match the bounded search request?
graders:
- type: prompt
  name: exa-search-contract
  config:
    prompt: |-
      Grade the exa-search response. Pass only if it chooses the current Exa
      operation whose schema matches every supplied constraint, executes the
      bounded search once, deep-reads the decisive primary result once,
      distinguishes snippets from fetched evidence, and returns a material
      sourced answer. On unavailable MCP or secret-bearing input, require the
      first cause and zero calls. Reject retries, broadened constraints,
      alternate operations/providers, remembered facts, or partial answers.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
