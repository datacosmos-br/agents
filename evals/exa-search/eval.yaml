name: exa-search-eval
description: Semantic evaluation suite for exa-search.
skill: exa-search
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/exa-search
  required_skills:
  - exa-search
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did Exa selection and retrieval match the bounded search request?
graders:
- type: prompt
  name: exa-search-contract
  config:
    prompt: |
      Grade the exa-search response. Pass only if it chooses the Exa tool that
      matches the supplied date and domain constraints, preserves those
      parameters, deep-reads the decisive result before answering, distinguishes
      snippets from fetched evidence, and fails closed when the Exa MCP is
      unavailable or the query contains secrets.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
