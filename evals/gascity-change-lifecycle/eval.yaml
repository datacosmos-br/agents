name: gascity-change-lifecycle-eval
description: Semantic evaluation suite for gascity-change-lifecycle.
skill: gascity-change-lifecycle
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/gascity-change-lifecycle
  required_skills:
  - gascity-change-lifecycle
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the lifecycle separate orchestration dispatch from repository landing?
graders:
- type: prompt
  name: gascity-change-lifecycle-contract
  config:
    prompt: |-
      Grade the gascity-change-lifecycle response. Pass only if it resolves the
      supplied city, rig, agent, formula, work, and integration identities;
      assigns orchestration and repository landing to their declared owners;
      applies Beads semantics only when explicitly selected;
      rejects copied or invented commands; and produces a material static
      lifecycle assessment with zero runtime effects while suspended.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
