id: rtk-happy-path-001
name: Economy-first command execution with manual prefix where deferred
description: Auto-rewrite preference plus manual rtk forms for deferred constructs.
tags: [rtk, token-economy, output-filtering, routing, happy-path]
inputs:
  prompt: |
    Execute the supplied session scenario. Keep context consumption minimal
    and state exactly which commands rtk's native hook rewrote automatically,
    which ones stayed plain, and which ones you wrapped manually, with reasons.
  files:
  - path: session-request.md
expected:
  output_contains:
  - git status
  - plain
  - rtk docker ps
  - rtk grep
  - manual
  - deferred
  output_not_contains:
  - rtk git status
