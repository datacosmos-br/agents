name: react-frontend-patterns-eval
description: Semantic evaluation suite for react-frontend-patterns.
skill: react-frontend-patterns
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/framework/react-frontend-patterns
  required_skills:
  - react-frontend-patterns
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the React refactor improve state, effects, privacy, and accessibility?
graders:
- type: prompt
  name: react-frontend-patterns-contract
  config:
    prompt: |
      Grade the react-frontend-patterns response. Pass only if it fixes the supplied
      React component's unstable fetch dependency without stale closures,
      represents loading, error, and result states, restores accessible search
      semantics, prevents sensitive query logging, and explains focused tests
      and performance impact without adding unapproved tracking or dependencies.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
