name: gc-agents-eval
description: Managing Gas City agents.
skill: gc-agents
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/domain/gascity/gc-agents
  required_skills:
  - gc-agents
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: gc-agents-contract
  config:
    prompt: |-
      Grade the gc-agents response. Pass only when it uses gc agents through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, and routes work through the declared
      owner. Reject bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
