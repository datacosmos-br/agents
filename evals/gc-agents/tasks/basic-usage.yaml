id: gc-agents-happy-001
name: Reconcile one draining agent pool
description: Restore declared capacity without disrupting the healthy session.
tags: [gas-city, gc-agents, happy-path]
inputs:
  prompt: >-
    Use scenario.yaml to reconcile the api-worker pool to capacity three. Prove
    the running, draining, and absent session states; preserve api-worker-1,
    complete the drain handshake for api-worker-2, and let the declared owner
    materialize the replacement. Report exact commands and post-state evidence.
    This must exercise Gas City agents session lifecycle, pool capacity,
    drain/restart, and reconciliation as observable behavior.
  files:
  - path: scenario.yaml
expected:
  output_contains: [api-worker-1, api-worker-2, capacity, drain, reconciliation, post-state, exit code]
  output_not_contains: [kill api-worker-1, manual tmux]
