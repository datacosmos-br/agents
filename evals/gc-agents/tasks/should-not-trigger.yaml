id: gc-agents-negative-001
name: Should not trigger gc-agents
description: Do not force gc-agents onto unrelated work.
tags: [gas-city, gc-agents, anti-trigger]
inputs:
  prompt: >-
    Write a short product announcement for a new feature. Do not use gc agents
    or Gas City orchestration in the response; the requested output is prose,
    not an agent workflow.
expected:
  output_not_contains: [gc agents, Gas City]
