
description: Accurate compression, audience fit, metrics, decisions, and uncertainty.
prompt: |-
  Grade the summarization response. Pass only when it leads with the incident
  outcome, preserves the exact error rates and times, distinguishes correlation
  from proof, records the two decisions plus owner and date, and omits unsupported
  detail. Reject altered numbers, invented causality, generic filler, or missing
  action ownership.
