name: summarization-eval
description: Accurate compression, audience fit, metrics, decisions, and uncertainty.
skill: summarization
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/summarization
  required_skills:
  - summarization
graders:
- type: prompt
  name: summarization-contract
  config:
    prompt: |
      Grade the summarization response. Pass only when it leads with the incident
      outcome, preserves the exact error rates and times, distinguishes correlation
      from proof, records the two decisions plus owner and date, and omits unsupported
      detail. Reject altered numbers, invented causality, generic filler, or missing
      action ownership.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
