name: gc-mail-eval
description: Gas City inter-agent mail.
skill: gc-mail
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/domain/gascity/gc-mail
  required_skills:
  - gc-mail
graders:
- type: prompt
  name: gc-mail-contract
  config:
    prompt: |-
      Grade the gc-mail response. Pass only when it uses gc mail through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, and routes work through the declared
      owner. Reject bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
