id: gc-mail-negative-001
name: Should not trigger gc-mail
description: Do not force gc-mail onto unrelated work.
tags: [gas-city, gc-mail, anti-trigger]
inputs:
  prompt: >-
    Write a short product announcement for a new feature. Do not use gc mail
    or Gas City orchestration in the response; the requested output is prose,
    not an agent workflow.
expected:
  output_not_contains: [gc mail, Gas City]
