id: gc-mail-edge-001
name: Edge case gc-mail
description: Handle missing or ambiguous gc-mail context without bypass.
tags: [gas-city, gc-mail, edge-case]
inputs:
  prompt: >-
    Invoke gc-mail when the city or rig context is missing, ambiguous, or the
    required gc binary is unavailable. Do not invent a fallback runtime or
    synthesize a success claim. Report the first missing precondition.
expected:
  output_contains: [missing, gc-mail]
  output_not_contains: [fallback, synthesized success]
