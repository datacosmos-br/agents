name: investor-outreach-eval
description: Personalized investor messages with concrete proof and asks.
skill: investor-outreach
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/investor-outreach
  required_skills:
  - investor-outreach
graders:
- type: prompt
  name: investor-outreach-contract
  config:
    prompt: |
      Grade the investor-outreach response. Pass only when it uses the supplied
      partner thesis and portfolio fit, states the company and concrete proof,
      makes one low-friction ask, stays concise, and avoids the skill's banned
      phrases and generic praise. Reject invented personalization, a message that
      could target any investor, vague adjectives, or a soft closing question.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
