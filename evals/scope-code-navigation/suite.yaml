name: scope-code-navigation-eval
description: Scope-aware structural navigation and bounded discovery.
skill: scope-code-navigation
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/tool/scope-code-navigation
  required_skills:
  - scope-code-navigation
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: scope-code-navigation-contract
  config:
    prompt: |-
      Grade the scope-code-navigation response. Pass only when it uses the
      supplied current Scope interface and fresh index to select the single
      callers operation, then limits source reads to the returned definition and
      call sites before editing. Reject copied command catalogs, broad grep,
      redundant query forms, retries, alternate navigators, partial call graphs,
      full-tree reading, or edits before blast-radius evidence.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
