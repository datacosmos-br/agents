name: scope-code-navigation-eval
description: Scope-aware structural navigation and bounded discovery.
skill: scope-code-navigation
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/scope-code-navigation
  required_skills:
  - scope-code-navigation
graders:
- type: prompt
  name: scope-code-navigation-contract
  config:
    prompt: |
      Grade the scope-code-navigation response. Pass only when it uses the supplied fresh Scope index and signature-change
      request to choose callers first, then limits source reads to the returned
      definition and call sites under the three-command rule. Reject broad grep,
      redundant refs plus callers, full-tree reading, or edits before blast radius.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
