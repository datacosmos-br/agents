id: scope-code-navigation-happy-001
name: Map callers before a signature change
description: Select one structural query and bounded reads from a fresh index.
tags: [code, navigation, search, references, structure, exploration, happy-path]
inputs:
  prompt: >-
    Use navigation-context.yaml to give the exact minimal navigation sequence
    before changing PaymentService.authorize. Name the Scope query, which source
    locations to read next, and where navigation must stop before editing.
  files:
  - path: navigation-context.yaml
expected:
  output_contains: [scope callers PaymentService.authorize, src/payments/service.ts, call sites]
