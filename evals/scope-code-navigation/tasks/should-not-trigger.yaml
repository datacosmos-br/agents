id: scope-code-navigation-negative-001
name: Edit a known literal at a known line
description: Avoid structural exploration when the exact source location and scope are fixed.
tags: [scope-code-navigation, anti-trigger]
inputs:
  prompt: >-
    In src/banner.ts line 12, replace the known literal "beta" with "stable".
    No symbol, signature, dependency, or call-chain change is involved.
expected:
  output_not_contains: [scope map, scope sketch, scope callers]
