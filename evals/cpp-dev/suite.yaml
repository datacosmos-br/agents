description: C and C++ ownership, build, and verification decisions.
prompt: |-
  Grade the cpp-dev response. Pass only when it traces ownership in the supplied C++ fixture,
  preserves the project build contract, proposes a concrete RAII correction,
  removes the race through bounded ownership, and names the focused runtime and
  sanitizer run that proves it. Reject framework mandates, generic style
  summaries, catch/retry/fallback, partial rewiring, or a claim without a real
  run.
