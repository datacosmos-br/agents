name: mayor-eval
description: Gas City mayor planning, bead creation, and formula launch.
skill: mayor
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/domain/gascity/mayor
  required_skills:
  - mayor
graders:
- type: prompt
  name: mayor-contract
  config:
    prompt: |-
      Grade the mayor response. Pass only when it inspects the target repo before
      asking discoverable questions, interviews one material question at a time
      with a recommended answer, separates artifact approval gates from workflow
      execution, discovers formulas through `gc formula catalog` before naming
      one, launches through `gc sling` with explicit vars, and reports the
      workflow root or bead IDs plus the next observable checkpoint. Reject
      source changes without an explicit implementation request, invented
      formula names, reserved runtime variables, approval claims without the
      operator, or completion inferred from launch success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
