id: fail-fast-missing-owner-001
name: Block a source-free deletion request
description: Refuse lexical deletion without the owner or executable contract.
tags: [fail-fast, ambiguity, fail-closed]
inputs:
  prompt: An alert says “fallback happened” but provides no repository, source path, runtime output, owner, or success contract. Stop at the first missing prerequisite and create no deletion, catch, warning, finding, skip, fallback, or other effect.
  files:
  - path: incident-summary.md
expected:
  output_contains: [blocked, owner, runtime evidence, no effect]
  output_not_contains: [resolved, safe to delete]
