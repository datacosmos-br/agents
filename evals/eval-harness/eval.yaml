name: eval-harness-eval
description: Semantic evaluation suite for eval-harness.
skill: eval-harness
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/project-wide/eval-harness
  required_skills:
  - eval-harness
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the eval definition provide executable capability and regression proof?
graders:
- type: prompt
  name: eval-harness-contract
  config:
    prompt: |
      Grade the eval-harness response. Pass only if it turns the supplied
      observable behavior into capability and regression evals, uses concrete
      deterministic graders where possible, states pass@k and pass^k targets,
      identifies artifacts and baselines, and never declares success without
      executed evidence or fabricates a baseline.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
