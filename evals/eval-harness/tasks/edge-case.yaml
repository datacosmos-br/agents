id: eval-harness-fail-closed-001
name: Undefined behavior and baseline
description: Require observable criteria before inventing an evaluation.
tags:
- edge-case
inputs:
  prompt: Build an eval for “make it better,” but no behavior, input, expected output, baseline, artifact, or success threshold is defined.
expected:
  output_contains:
  - observable behavior is required
  - success threshold is required
  output_not_contains:
  - 'Status: SHIP IT'
  - baseline passed
