id: eval-harness-should-not-trigger-001
name: Explain one existing unit-test assertion
description: Test explanation alone does not require a new evaluation framework.
tags:
- anti-trigger
- negative-test
inputs:
  prompt: Explain why `assert total == 3` fails when total is 2; do not activate an eval suite, select another grader, or fall back to an evaluation framework.
expected:
  output_not_contains:
  - pass@k
  - MODEL GRADER
  - EVAL REPORT
  - fallback grader
