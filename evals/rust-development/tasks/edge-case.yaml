id: rust-development-unknown-contract-001
name: Refuse unsafe code without crate context
description: Do not invent an unsafe boundary or public signature.
tags: [rust, fail-closed]
inputs:
  prompt: Rewrite an unspecified Rust parser with unsafe pointer arithmetic, but no crate, edition, feature set, API contract, safety invariant, or tests are available.
expected:
  output_contains: [safety invariant, crate context]
  output_not_contains: ['unsafe {', transmute]
