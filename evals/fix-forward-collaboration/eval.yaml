name: fix-forward-collaboration-eval
description: Preserve concurrent work and integrate compatible intent forward.
skill: fix-forward-collaboration
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/fix-forward-collaboration
  required_skills:
  - fix-forward-collaboration
graders:
- type: prompt
  name: fix-forward-collaboration-contract
  config:
    prompt: |-
      The fix-forward-collaboration contract passes only when the response
      adopts the complete current authorized-worktree state regardless of
      provenance or age, inventories and preserves pre-existing and concurrent
      intent, declares bounded ownership, rereads shared owners at every sync
      checkpoint, carries every compatible contribution through the integration
      lane, fixes defects forward at the owner, and revalidates the combined result.
      Reject stash, code/history rollback, reset, restore, revert, shared
      rebase, force-push, whole-file clobber, blame, isolated-lane delivery, or
      discarding current work. Transaction rollback is allowed only for effects
      created by the failing invocation. A question is required only for two
      evidenced current intentions that cannot coexist under active authority;
      ordinary overlap, divergence, merge work, and red gates must continue
      through reconciliation. Unmanifested provider outputs, generated
      destinations, external files, and ambiguous objects are preserved but are
      not repository contributions or canonical inputs; without an approved
      divergence-class rule they require operator adjudication before replacement.
      Explicit tracker suspension creates no alternate tracker or ledger; use the
      existing authorized collaboration or Git/PR/CI surfaces.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
