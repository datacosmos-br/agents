id: product-capability-export-001
name: Define an audit-export capability
description: Convert product intent into an implementation-facing capability contract.
tags: [product, capability, contract, happy-path]
inputs:
  prompt: |
    Turn operator-export.md into a capability contract. Separate the user-visible
    promise from implementation choices, capture ownership and lifecycle rules,
    preserve the stated non-goals, expose unresolved decisions, and state whether
    engineering can implement it now.
  files:
  - path: operator-export.md
expected:
  output_contains: [operator, draft audits, retention]
