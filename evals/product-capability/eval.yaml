name: product-capability-eval
description: Product intent, constraints, contracts, and implementation handoff.
skill: product-capability
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/product/product-capability
  required_skills:
  - product-capability
graders:
- type: prompt
  name: product-capability-contract
  config:
    prompt: |-
      Grade the product-capability response. Pass only when it derives the actor,
      visible promise, authorization boundary, lifecycle constraints, explicit
      non-goals, unresolved retention question, and an honest implementation
      handoff from the supplied intent. Reject invented product decisions and
      implementation detail presented as approved policy. Require the one
      project-owned capability artifact, complete evidence preflight, and no
      fallback scope or artifact when product truth is missing.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
