name: data-modeling-analysis-eval
description: Data boundary, mutation, and serialization analysis.
skill: data-modeling-analysis
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/project-wide/product/data-modeling-analysis
  required_skills:
  - data-modeling-analysis
graders:
- type: prompt
  name: data-modeling-analysis-contract
  config:
    prompt: |-
      Grade the data-modeling-analysis response. Pass only when it traces the supplied model across validation,
      mutation, and serialization boundaries, distinguishes evidence from
      inference, and reports a concrete owner-level risk. Reject language-library
      assumptions and generic data-modeling advice.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
