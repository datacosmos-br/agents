description: Decision order before new code, native tools, existing-owner reuse, and bounded non-triggering.
prompt: |-
  Grade according to the task's role. For the happy path, pass only when the
  response searches the supplied mini-project files, the pinned lock entry and
  the dependency documentation, takes the first option of the decision order
  that gives the correct behavior, reuses PageTokenCodec and the pinned
  itsdangerous instead of adding a codec, gives list_orders the smallest
  patch, and names make runtime and make test as proof. For the fail-closed
  task, pass only when it deletes the speculative need and writes no
  framework, owner or consumer. For the should-not-trigger task, pass only for
  the requested two-sentence museum summary without repository discovery.
  Reject decisions based on filenames or one keyword search, speculative
  abstractions, a second codec, or an implementation claim without a real run.
