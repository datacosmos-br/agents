id: search-first-pagination-owner-001
name: Reuse the canonical pagination owner
description: Exercise the decision order, native tools, owner reuse, and the smallest new code before changing code.
tags: [search, decision-order, reuse, dependencies, happy-path]
inputs:
  prompt: |
    The supplied mini-project must return an opaque URL-safe next-page token from
    list_orders. Search the supplied files, the pinned dependency and its
    documentation, take the first option of the decision order that gives the
    correct behavior, and report the choice, the owner it used and the exact
    smallest patch. Include the runtime command and native test that prove it.
  files:
  - path: mini-project/AGENTS.md
  - path: mini-project/docs/architecture.md
  - path: mini-project/pyproject.toml
  - path: mini-project/uv.lock
  - path: mini-project/src/shop/pagination.py
  - path: mini-project/src/shop/orders.py
  - path: mini-project/src/shop/api.py
  - path: mini-project/tests/test_orders.py
expected:
  output_contains: [PageTokenCodec, list_orders, itsdangerous, 2.2.0, encode, make runtime, make test]
