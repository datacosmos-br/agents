id: search-first-missing-project-001
name: Block implementation without project evidence
description: Refuse to invent an owner or abstraction when the repository is absent.
tags: [search, ambiguity, fail-closed]
inputs:
  prompt: Implement the reusable abstraction requested in feature-request.md immediately. No repository root, instructions, architecture, source tree, dependencies, consumers, runtime, or gates are available.
  files:
  - path: feature-request.md
expected:
  output_contains: [blocked, repository root, project instructions, architecture, current consumer, missing evidence]
  output_not_contains: ['def exporter_factory(']
