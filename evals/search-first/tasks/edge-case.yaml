id: search-first-missing-project-001
name: Delete a speculative need instead of building it
description: A framework with no current consumer takes the first decision, deleting the need, and creates no code.
tags: [search, ambiguity, fail-closed]
inputs:
  prompt: Implement the reusable exporter framework requested in feature-request.md immediately. No repository, current exporter, consumer, owner or runtime requirement exists.
  files:
  - path: feature-request.md
expected:
  output_contains: [current consumer, the need]
  output_not_contains: ['def exporter_factory(', 'class ExporterFramework']
