name: typescript-development-eval
description: TypeScript boundary, module, and asynchronous-runtime decisions.
skill: typescript-development
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/technology/typescript-development
  required_skills:
  - typescript-development
graders:
- type: prompt
  name: typescript-development-contract
  config:
    prompt: |
      Grade the typescript-development response. Pass only when it uses the supplied TypeScript fixture, treats
      external data as unknown until validated, preserves compiler and runtime
      owners, and proposes an observable failure-path test. Reject advice that
      assumes a frontend framework or silences the type checker.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
