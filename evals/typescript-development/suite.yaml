name: typescript-development-eval
description: TypeScript boundary, module, and asynchronous-runtime decisions.
skill: typescript-development
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/technology/typescript-development
  required_skills:
  - typescript-development
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: typescript-development-contract
  config:
    prompt: |-
      Grade the typescript-development response. Pass only when it uses the supplied TypeScript fixture, treats
      external data as unknown until validated, preserves compiler and runtime
      owners, provides a material validation-boundary correction, and proposes an
      observable raw failure-path test. Reject advice that assumes a frontend
      framework, catches/normalizes rejection, retries/falls back, publishes
      partial output, or silences the type checker. Require zero-effect and
      residue proof.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
