id: gc-rigs-edge-001
name: Reject an unregistered rig directory
description: Fail before registration effects when the city owner cannot identify the rig.
tags: [gas-city, gc-rigs, edge-case]
inputs:
  prompt: >-
    A directory named analytics contains a Git repository but the current
    city's rig registry has no analytics entry, and a second city is also
    configured. Explain the exact read-only commands needed to identify the
    owner and stop before register, suspend, or resume effects.
expected:
  output_contains: [rig registry, analytics, ambiguous, precondition]
  output_not_contains: [registered successfully, fallback, synthesized success]
