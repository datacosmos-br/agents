id: lane-landing-cycle-edge-001
name: Classify local generation outputs by declared owner
description: Preserve source-owned generated outputs and diagnose unrelated drift.
tags: [git, github, workflow, edge-case]
inputs:
  prompt: >-
    After changing the tracked Beads activation source in the agents repository,
    make gen changes .envrc and .beads/metadata.json. An unrelated generated
    workflow also changes. What belongs in the PR, and how is an unexpected
    generated change diagnosed before push?
expected:
  output_contains:
    [source, .envrc, .beads/metadata.json, fixed point, unrelated]
  output_not_contains: [restore everything, commit everything, harmless]
