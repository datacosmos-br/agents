id: lane-landing-cycle-negative-001
name: Translate placement text without starting a landing cycle
description: A read-only translation does not select code execution or isolation.
tags: [workflow, anti-trigger]
inputs:
  prompt: >-
    Translate only this sentence into Portuguese: "Adopt the current checkout."
    Do not perform repository operations or describe a landing procedure.
expected:
  output_not_contains: [git worktree add, gh pr create, git push]
