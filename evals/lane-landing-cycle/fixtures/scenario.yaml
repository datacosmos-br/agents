tracker:
  runtime: available
  claimed_issue: aihub-5j4cw.7
  claim_note: lane note comment recorded at claim time with the branch name.
invocation:
  placement: explicitly isolated
lane:
  branch: fix/f6-protocols-20260927
  worktree: dedicated native git worktree with its own physical .venv from make setup
  base: integration branch tip fetched before lane creation
cycle:
  - lane creation from the fetched tip
  - generation with the CI context (make gen, twice to the fixed point)
  - real runtime, declared static gates, then the catalog-declared complete test suite
  - pull request opened from the pushed lane branch
  - merge with --no-ff after green CI
  - post-merge proof on the integration tip
  - bead closed with the merge commit and captured gate results
  - lane retired after the ancestry proof (merge-base --is-ancestor)
forbidden:
  - rebase of the authorized change branch
  - force-push to any shared branch
  - skipping a red gate or waiving a finding
required_receipt_fields:
  - exact native command
  - selected physical context
  - actual exit status and decisive output
  - authorized disposable target and fresh ancestry proof
instruction: >
  Execute the unit in the declared order and state, at each step, the exact
  evidence required on the claimed bead. This fixture describes a requested scenario,
  not completed execution. Never invent outcomes; a red gate stops that invocation
  for repair at its owner.
