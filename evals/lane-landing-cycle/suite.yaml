description: Invocation-aware landing, adoption, evidence and disposable-lane retirement.
prompt: |-
  Grade the response against the supplied invocation and current canonical owners.
  Distinguish execution ownership from a request for isolation: an authorized current
  primary/shared checkout is valid, and no fresh branch, worktree or placement-choice
  question follows merely from a new task. An explicitly isolated scenario must still
  use its selected context and owned physical environment. Assess only the requested
  milestones, authorized Git effects, source ownership, preservation and real receipts.
  Planning inputs are not evidence that commands executed. Reject fabricated completion,
  normalized failures, borrowed environments, origin-based restoration that discards
  compatible WIP, unrelated changes swept into publication,
  unrequested isolation, and deletion of adopted primary/shared/integration contexts.
  Eligible disposable lanes retain their ownership, preservation and ancestry proofs.
