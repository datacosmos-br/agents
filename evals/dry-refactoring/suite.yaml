name: dry-refactoring-eval
description: Guided jscpd-driven elimination of copy-paste duplication.
skill: dry-refactoring
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/tool/dry-refactoring
  required_skills:
  - dry-refactoring
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: dry-refactoring-contract
  config:
    prompt: |-
      Grade the dry-refactoring response. Pass only when it runs jscpd at the
      selected strict eight-line baseline first, reads both duplicated fragments
      before designing shared extraction, classifies each candidate rather than
      treating textual similarity as proof, updates every call site, re-runs the
      identical configuration, and proves zero new clones. Reject an unowned gate,
      threshold without an explicit baseline, unreviewed
      rebaselining, refactors without a re-run, extracted abstractions with
      unclear names, deleting tests to silence clones, or a consolidated copy
      that keeps the duplicated original in place.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
