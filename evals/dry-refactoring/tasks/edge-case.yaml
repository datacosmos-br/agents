id: dry-refactoring-edge-001
name: Edge case dry-refactoring
description: Refuse a similarity-only consolidation that would change behavior.
tags: [dry-refactoring, duplication, edge-case]
inputs:
  prompt: >-
    A project switches its jscpd comparison floor from ten to eight lines. The
    new run reports a clone whose fragments differ in error handling and will
    diverge further; extracting a shared function would force a parameter so
    wide it hides the behavioral difference. Do not consolidate, weaken either
    module, or silently keep the stale ten-line result green. Triage the new
    candidate and report the first defect in the similarity signal instead of
    inventing a shared abstraction.
expected:
  output_contains: [dry-refactoring, differ, no shared extraction, triage, stale ten-line, similarity signal]
  output_not_contains: [extracted anyway, fallback, weakened behavior, rebaseline complete]
