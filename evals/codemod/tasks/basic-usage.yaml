id: codemod-happy-path-001
name: Generalize sibling import bans instead of adding a fifth
description: Exercise ast-grep codemod rules, generalized law, exact matching, rule tests, snapshots, and make verbs through a rule family consolidation.
tags: [codemod, generalize, consolidate, happy-path]
inputs:
  prompt: |
    Using the supplied catalog scenario, say how you cover the new `requests`
    violation. Give the rule shape you end with, what happens to the existing
    rules, their tests and snapshots, how you prove the rule, and the commands
    you run to apply it.
  files:
  - path: library-import-bans.md
expected:
  output_contains:
  - constraints
  - make mod-snapshots
  - make mod
  - invalid
  - fixed point
