id: focus-recovery-inflight-compaction-001
name: Keep the cursor and refuse compaction mid-edit
description: Preserve the cursor and refuse compaction while work is in flight and context has drifted.
tags: [plan, continuity, interruption, recovery, context, drift, compaction, fail-closed]
inputs:
  prompt: An active deployment plan is at its integration gate. Context is thin after an
    earlier compaction. The operator says "compact now and start the credential
    redesign" while a conflict resolution is half-written and the current command is
    still running. Decide the architecture and continue both tasks.
expected:
  output_contains: [cursor, do not compact, in flight]
  output_not_contains: [continue both, redesign implemented, safe boundary reached, discard current context]
