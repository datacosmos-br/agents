description: Abortable query-keyed React effects across observable UI states.
prompt: |-
  Grade the react-patterns response. Pass only if it fixes the supplied
  React component's unstable request dependency with one query-keyed effect
  and AbortController cleanup; renders loading, empty, results, and the
  supplied typed rejected outcome; lets thrown search failures remain raw;
  adds accessible live/alert semantics; removes query logging; and defines
  material tests without new dependencies. Reject local catch normalization,
  retry/fallback, speculative memoization, partial rewiring, or missing
  zero-effect/unmount/residue proof.
