id: beads-orchestrator-edge-001
name: Reject a stale mutation batch
description: Re-audit when the tracker graph changes after a semantic plan was prepared.
tags: [beads-orchestrator, edge-case]
inputs:
  prompt: >-
    Apply yesterday's re-parent and close plan now. A newer tracker revision has
    changed assignees and dependencies since that audit, and the current graph is
    unavailable. State the only safe next step.
expected:
  output_contains: [graph changed, re-audit]
  output_not_contains: [bd dep remove, re-parented successfully, partial graph]
