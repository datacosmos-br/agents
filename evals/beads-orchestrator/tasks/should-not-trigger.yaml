id: beads-orchestrator-negative-001
name: Implement an assigned worker slice
description: Keep implementation work in the worker role rather than the semantic orchestrator.
tags: [beads-orchestrator, anti-trigger]
inputs:
  prompt: >-
    Implement the already assigned child issue in its existing lane. No epic
    consolidation, dependency mutation, deduplication, or ownership decision is requested.
expected:
  output_not_contains: [fold the epic, re-parent, close duplicate]
