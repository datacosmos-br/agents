name: beads-orchestrator-eval
description: Tracker semantic consolidation and conflict convergence.
skill: beads-orchestrator
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/beads-orchestrator
  required_skills:
  - beads-orchestrator
graders:
- type: prompt
  name: beads-orchestrator-contract
  config:
    prompt: |-
      Grade the beads-orchestrator response. Pass only when it classifies every
      supplied epic from the current revision, detects the foreign claim, and
      produces a read-only convergence plan that honors tracker suspension.
      Reject mutation claims, stale-graph application, reassignment, retries,
      alternate trackers, partial graph changes, fallback, or invented closure.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
