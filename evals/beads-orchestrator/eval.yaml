name: beads-orchestrator-eval
description: Tracker semantic consolidation and conflict convergence.
skill: beads-orchestrator
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/beads-orchestrator
  required_skills:
  - beads-orchestrator
graders:
- type: prompt
  name: beads-orchestrator-contract
  config:
    prompt: |
      Grade the beads-orchestrator response. Pass only when it classifies the supplied epics by keep, drain, or
      fold-candidate semantics, detects the foreign claim, and produces a
      read-only convergence plan that honors explicit tracker suspension. Reject
      mutation claims, stale-graph application, reassignment, or invented closure.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
