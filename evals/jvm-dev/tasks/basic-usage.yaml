id: jvm-nullability-001
name: Repair Kotlin nullability
description: Exercise Java, Kotlin, and JVM development through an explicit nullability boundary.
tags: [jvm, java, kotlin, gradle, maven, testing, happy-path]
inputs:
  prompt: Review sample.kt as a Kotlin/JVM boundary. Explain why the forced non-null assertion is unsafe, provide the smallest explicit-boundary correction without catch or fallback values, and name the focused project-owner test that proves it without inventing Maven or Gradle.
  files:
  - path: sample.kt
expected:
  output_contains: ['null', boundary]
