name: dispatch-agent-eval
description: Semantic evaluation suite for dispatch-agent.
skill: dispatch-agent
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/dispatch-agent
  required_skills:
  - dispatch-agent
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did delegation select the best available specialist with context?
graders:
- type: prompt
  name: dispatch-agent-contract
  config:
    prompt: |
      Grade the dispatch-agent response. Pass only if it uses the supplied
      roster, compares trigger overlap and confidence, selects the strongest
      available specialist instead of a general fallback, preserves the stated
      project context, leaves model selection to the canonical runtime owner,
      and records a concrete native handoff decision.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
