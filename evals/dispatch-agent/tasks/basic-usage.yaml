id: dispatch-agent-parallel-happy-path-001
name: Dispatch three disjoint read-only audits
description: Admit authorized parallelism only across distinct evidence owners.
tags: [agent, agent-delegation, bounded-work, happy-path, parallelism]
inputs:
  prompt: |
    The approved plan authorizes three concurrent read-only audits: runtime
    failure causality, secret-exposure boundaries, and documentation authority
    drift. Select specialists from the active roster and keep each contract
    bounded. Preserve branch and read-only scope, trigger confidence, coordinator
    ownership of all writes, and evidence integration. Invent no tracker,
    worktree, model, provider, or additional agent.
    Then draft one implementation handoff for a worker in
    /repo/worktrees/feature editing only the declared payment owner and its
    public regression. It must validate via selector-free root Make verbs.
  files:
  - path: parallel-roster.json
expected:
  output_contains: [runtime-debugger, security-reviewer, documentation-reviewer, read-only, confidence, integration, coordinator, env -C /repo/worktrees/feature make check]
  output_not_contains: [substitute tracker, separate worktree, delegation completed after failure]
