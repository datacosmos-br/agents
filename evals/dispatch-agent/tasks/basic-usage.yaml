id: dispatch-agent-parallel-happy-path-001
name: Dispatch three disjoint read-only audits
description: Admit authorized parallelism only across distinct evidence owners.
tags: [agent, agent-delegation, bounded-work, happy-path, parallelism]
inputs:
  prompt: |
    The approved plan explicitly authorizes three concurrent read-only audits:
    runtime failure causality, secret-exposure boundaries, and documentation
    authority drift. Perform agent delegation and specialist selection from the
    active roster, keeping each bounded work contract explicit. Preserve branch
    and read-only scope, state trigger confidence, keep every write and the Git
    index with the coordinator, and declare how the evidence is integrated before
    any implementation. Do not invent a tracker, worktree, model, provider, or
    additional agent.
  files:
  - path: parallel-roster.json
expected:
  outcomes:
  - type: task_completed
  output_contains:
  - runtime-debugger
  - security-reviewer
  - documentation-reviewer
  - read-only
  - confidence
  - integration
  - coordinator
  output_not_contains:
  - substitute tracker
  - separate worktree
  - delegation completed after failure
