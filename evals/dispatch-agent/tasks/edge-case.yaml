id: dispatch-agent-fail-closed-001
name: No active roster
description: Refuse to fabricate an agent identity when the client exposes no roster.
tags:
- edge-case
inputs:
  prompt: Delegate a deployment investigation, but the active client exposes no agent roster. Do not use a cached, bundled, or hardcoded catalog.
expected:
  output_contains:
  - agent roster is required
  - delegation cannot proceed
  output_not_contains:
  - software-engineer
  - delegation completed
