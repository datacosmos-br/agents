name: architecture-documentation-eval
description: Architecture evidence, boundaries, flows, diagrams, and decisions.
skill: architecture-documentation
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/architecture-documentation
  required_skills:
  - architecture-documentation
graders:
- type: prompt
  name: architecture-documentation-contract
  config:
    prompt: |-
      Grade the architecture-documentation response. Pass only when it derives component ownership, boundaries,
      and the request flow from the supplied fixture, distinguishes evidence
      from inference, and proposes a proportionate diagram or architecture
      artifact. Reject invented components, copied schemas, and generic prose.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
