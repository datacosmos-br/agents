name: skill-governance-eval
description: Search-first skill design, compact routing, references, and non-duplication.
skill: skill-governance
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/skill-governance
  required_skills:
  - skill-governance
graders:
- type: prompt
  name: skill-governance-contract
  config:
    prompt: |-
      Grade the skill-governance response. Pass only when it proves the capability is
      absent from the supplied inventory, proposes one kebab-case router with a
      short keyword description, places detailed procedure in a local reference,
      defines activation plus non-activation boundaries and validation, and
      migrates every current count/map/fixture/lock consumer atomically while
      preserving historical evidence. Reject duplicate skills, count drift,
      documentation follow-ups, prose descriptions, copied templates, or external paths.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
