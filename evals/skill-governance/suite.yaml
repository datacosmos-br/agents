name: skill-governance-eval
description: Search-first skill design, compact routing, references, and non-duplication.
skill: skill-governance
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/governance/skill-governance
  required_skills:
  - skill-governance
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: skill-governance-contract
  config:
    prompt: |-
      Grade the skill-governance response. Pass only when it treats the historical
      corpus as read-only evidence, classifies behavior instead of copying structure,
      proves the capability is absent from the current inventory, proposes one
      kebab-case router with a short keyword description, places detailed procedure
      in a local reference, defines activation plus non-activation boundaries and
      validation, and migrates every current count/map/fixture/lock consumer
      atomically while preserving historical evidence. Reject a new schema-diff command,
      duplicate skills, count drift, documentation follow-ups, prose descriptions,
      copied templates, provider artifacts, foreign runtime, or external paths.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
