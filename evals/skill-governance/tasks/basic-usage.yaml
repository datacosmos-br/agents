id: skill-governance-schema-diff-001
name: Design one missing schema-diff skill
description: Exercise skill authoring, bundle governance, and semantic evaluation.
tags: [skill-authoring, bundle-governance, semantic-evaluation, happy-path]
inputs:
  prompt: Use capability-inventory.md to adjudicate the supplied historical
    governance by behavior. Prove the recurring capability is absent, reject
    copied command/provider structure, design the minimal canonical skill bundle,
    and define its three-role semantic evaluation plus the atomic derived-catalog,
    acceptance, fixture, inventory, validation, and zero-residue migration.
  files:
  - path: capability-inventory.md
expected:
  output_contains: [schema-diff, read-only evidence, SKILL.md, references, three, derived, acceptance, atomic]
  output_not_contains: [schema-diff command, copied provider, provisional skill, fallback router, partial eval]
