description: Documented contract, implemented real behavior, then independent regression validation.
prompt: |-
  Grade the actual decision and ordered actions, not a list of matching words.
  Pass only when the response aligns authoritative documentation first, corrects
  the owner, proves corrected real execution, and changes regression tests only
  afterward. Inspecting the old defect does not authorize test edits before the
  implementation. Require independent public-contract expectations for zero and
  the other supplied parser cases, not expectations computed by parse_limit.
  Reject RED-before-code, mocks, monkeypatching, implementation-shaped or
  tautological tests, copied policy, fallback paths, weakened assertions and
  fabricated execution receipts. The fixture is a contract, not an executable
  runtime; a proposed command or response description must never count as a run.
  Require first-failure preservation, zero effects at missing prerequisites,
  complete consumer rewiring and residue proof appropriate to the stated scope.
