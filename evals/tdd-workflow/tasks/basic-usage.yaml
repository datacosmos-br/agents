id: tdd-workflow-limit-001
name: Drive a parser fix from observable behavior
description: Require implementation and real runtime proof before final regression changes.
tags: [tdd, tests, development, happy-path]
inputs:
  prompt: |-
    Build the exact documentation, implementation, real runtime proof and
    final regression-validation sequence for parser-contract.md. Use only public
    behavior and native root Make verbs. Explain when test edits become allowed
    and derive expected results independently of parse_limit. Preserve the first
    causal failure, rewire consumers atomically and search for superseded residue.
    Only a contract is supplied, not an executable checkout: propose the sequence
    honestly without claiming any command ran or any implementation passed.
  files:
  - path: parser-contract.md
expected:
  output_contains: [parse_limit("0"), InvalidLimit, make test, implementation, causal, residue]
