id: tdd-workflow-limit-001
name: Drive a parser fix from observable behavior
description: Establish RED then make the minimal owner correction and prove GREEN.
tags: [tdd, tests, development, happy-path]
inputs:
  prompt: Build the exact RED-GREEN-refactor sequence for parser-contract.md using only its public behavior and native focused command.
  files:
  - path: parser-contract.md
expected:
  output_contains: [parse_limit("0"), InvalidLimit, make test FILE=tests/test_limit_parser.py]
