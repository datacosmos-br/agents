name: tdd-workflow-eval
description: Observable RED, minimal owner correction, GREEN, and refactor evidence.
skill: tdd-workflow
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/project-wide/tdd-workflow
  required_skills:
  - tdd-workflow
graders:
- type: prompt
  name: tdd-workflow-contract
  config:
    prompt: |
      Grade the tdd-workflow response. Pass only when it derives observable cases
      from the supplied public contract, starts with a test that reproduces the 0
      defect as RED, changes only parse_limit minimally, reruns the same command to
      GREEN, and refactors only while behavior remains green. Reject implementation-
      detail tests, arbitrary coverage targets, fallbacks, or editing tests to match
      broken runtime.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
