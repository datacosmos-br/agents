id: gascity-workspace-lifecycle-placement-001
name: Validate a suspended workspace placement
description: Derive the workspace contract without invoking runtime.
tags: [gascity, workspace, city, rig, pack, placement, happy-path]
inputs:
  prompt: Review city.toml and produce a static placement assessment for the ledger rig. Identify the declared city, pinned Pack V2 import, agent, formula, provider-selected physical workspace, and the run/session evidence that would be required after suspension is lifted. Do not execute or propose an active command now.
