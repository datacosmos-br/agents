name: gascity-workspace-lifecycle-eval
description: Static workspace placement from declared Gas City configuration.
skill: gascity-workspace-lifecycle
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/tool/gascity-workspace-lifecycle
  required_skills:
  - gascity-workspace-lifecycle
graders:
- type: prompt
  name: gascity-workspace-lifecycle-contract
  config:
    prompt: |-
      Grade the gascity-workspace-lifecycle response. Pass only when it derives
      the city, rig, pinned Pack V2 import, agent, formula, provider, and physical
      workspace from the supplied city.toml while keeping the suspended runtime
      entirely static with zero workspace effects. Reject invented commands,
      active dispatch, loose clones, worktrees, temporary or cross-repository
      paths, symlinks, provider fallback, or mechanical command translation.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
