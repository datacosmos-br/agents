id: architecture-evidence-001
name: Refuse an unevidenced system diagram
description: Mark missing sources instead of inventing a runtime topology.
tags: [architecture, documentation, edge-case]
inputs:
  prompt: Produce the definitive architecture and ADR for an unavailable service. No code, configuration, runtime observation, interface, or approved decision is supplied. State what blocks definitive documentation.
expected:
  output_contains: [evidence, source, zero effects]
  output_not_contains: [definitive diagram, approved decision, architecture note created]
