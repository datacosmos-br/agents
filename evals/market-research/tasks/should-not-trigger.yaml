id: market-research-customer-interview-script-negative-001
name: Draft an existing-customer interview guide
description: Do not manufacture market sizing for a qualitative research script.
tags: [customer, interview, anti-trigger]
inputs:
  prompt: Draft five open-ended questions for interviews with our existing customers about onboarding friction. Do not estimate market size or compare competitors.
expected:
  output_not_contains: [TAM, SAM, SOM, competitive landscape]
