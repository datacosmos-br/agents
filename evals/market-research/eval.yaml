name: market-research-eval
description: Source-backed market conclusions with assumptions and downside evidence.
skill: market-research
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/market-research
  required_skills:
  - market-research
graders:
- type: prompt
  name: market-research-contract
  config:
    prompt: |
      Grade the market-research response. Pass only when it cites the supplied
      sources and dates, labels assumptions and inference separately, reconciles
      top-down and bottom-up estimates, includes the stated counterevidence, and
      reaches a decision that follows from those facts. Reject unsourced numbers,
      stale data presented as current, omitted downside, or research theater
      without a recommendation.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
