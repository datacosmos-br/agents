id: data-composition-001
name: Compose repeated CRM models
description: Exercise data models through model composition and field ownership, with each field declared once at its owner, fewer models, and a mirror that follows the hierarchy.
tags: [data-models, model-composition, field-ownership, inheritance, happy-path]
inputs:
  prompt: In crm-project, compose the models so each field is declared once at the model that owns it, with one model per domain. Merge the repeated shapes, delete the duplicate domain model and rewire its consumer, keep validation where it is, keep the generated protocols in step with the models, and name the real commands that show the consumers read and write the same data and that the generated surface is stable.
  files:
  - path: crm-project/AGENTS.md
  - path: crm-project/src/crm/models.py
  - path: crm-project/src/crm/api.py
  - path: crm-project/src/crm/export.py
expected:
  output_contains: [Client, CustomerAddress, SupplierAddress, export.py, protocols.py, make gen, make runtime]
