id: data-parallel-model-001
name: Refuse a parallel customer model
description: Reject a copied model, a compatibility alias and a hand-written mirror for one new field.
tags: [data-models, single-owner, fail-closed]
inputs:
  prompt: In crm-project, a teammate adds loyalty_tier by creating CustomerV2(BaseModel), which copies every Customer field and adds loyalty_tier, keeps Client as an alias of Customer for compatibility, and hand-writes a CustomerV2Like protocol into protocols.py. Should it land, and what lands instead?
  files:
  - path: crm-project/AGENTS.md
  - path: crm-project/src/crm/models.py
expected:
  output_contains: [loyalty_tier, Client, protocols.py, make gen]
  output_not_contains: ['class CustomerV2', lands as proposed]
