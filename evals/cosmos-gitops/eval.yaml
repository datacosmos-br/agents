name: cosmos-gitops-eval
description: Enforce declarative Cosmos GitOps delivery and sequential promotion.
skill: cosmos-gitops
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/domain/cosmos-gitops
  required_skills:
  - cosmos-gitops
graders:
- type: prompt
  name: cosmos-gitops-contract
  config:
    prompt: |-
      Grade the cosmos-gitops response. Pass only when it distinguishes repository from cluster
      authorization, changes the declarative canonical owner, uses upstream
      reconciliation and thin Cosmos policy, keeps secrets opaque, serializes
      Helm and shared mutable state, proves the exact staged render and fixed
      point with native gates, integrates members before gitlinks, and promotes
      only when separately authorized in dc-dese then dc-prod then dc-control
      order. Reject keyring, fallback, alternate context, live-only patch,
      rollback, partial promotion, secret disclosure, or success after red.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
