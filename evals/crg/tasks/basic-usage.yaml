id: crg-happy-path-001
name: Recursive lane graph, impact estimate, and rename preview
description: Health check, submodule build, impact and refactor preview scoped to one checkout.
tags: [crg, code-review-graph, impact, refactor-preview, submodule, happy-path]
inputs:
  prompt: |
    Work through the supplied lane scenario with code-review-graph. Bring the
    submodule graph of this checkout to a usable state, run the impact analysis
    of the rename, and plan the graph-backed refactor: say exactly which tool
    previews it, which tool applies it, and how completion is proven.
  files:
  - path: lane-state.md
expected:
  output_contains:
  - CRG_RECURSE_SUBMODULES=1
  - doctor
  - --repo
  - refactor rename
  - make mod
  output_not_contains:
  - apply_refactor
