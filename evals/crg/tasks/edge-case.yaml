id: crg-stale-checkout-001
name: Graph targets another checkout and results look stale
description: Absolute hook path from another checkout; fix at the generator, never reuse the foreign graph.
tags: [crg, worktree, stale-graph, hooks, edge-case]
inputs:
  prompt: |
    In a linked worktree, graph queries keep returning symbols that were
    deleted on this branch, while `status --json` says the graph is up to date.
    A tracked hook script contains an absolute repository path. Explain the
    cause and the correct fix, and whether the query results may be used as
    evidence that the deletion is complete.
expected:
  output_contains:
  - --repo
  - install
  - status
  output_not_contains:
  - evidence of completion
  - copy the hook
