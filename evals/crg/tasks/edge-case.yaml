id: crg-no-graph-001
name: Refuse graph claims when no graph exists
description: Missing database and unusable base fail closed until a full build succeeds.
tags: [crg, fail-closed, edge-case]
inputs:
  prompt: >-
    `code-review-graph update --brief` just printed "incremental update requires
    an existing graph; run build explicitly" and exited 1, yet the reviewer wants
    the list of dead functions in this member right now. Say what you report.
expected:
  output_contains: [build, exit, no graph]
  output_not_contains: ['dead functions:', 'no dead code']
