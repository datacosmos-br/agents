id: code-review-expert-happy-001
name: Review a vulnerable payments patch
description: Perform correctness analysis and regression detection in a code review.
tags: [code-review, correctness-analysis, regression-detection, security, evidence, happy-path]
inputs:
  prompt: >-
    Perform a code review of payments.patch only; do not implement fixes. Use
    correctness analysis and regression detection to produce ordered defects with
    added-line references, exploitability,
    impact, and a minimal correction direction. Cover security, authorization,
    error handling, and any false-success behavior.
  files:
  - path: payments.patch
expected:
  output_contains: [SQL injection, authorization, '200', REQUEST_CHANGES, added line]
