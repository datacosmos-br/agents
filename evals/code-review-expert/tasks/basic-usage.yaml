id: code-review-expert-happy-001
name: Review a vulnerable payments patch
description: Report exploitable and correctness findings with severity and line evidence.
tags: [code-review, correctness, security, severity, evidence, happy-path]
inputs:
  prompt: >-
    Review payments.patch only; do not implement fixes. Produce the required code
    review summary and ordered findings with added-line references, exploitability,
    impact, and a minimal correction direction. Cover security, authorization,
    error handling, and any false-success behavior.
  files:
  - path: payments.patch
expected:
  output_contains: [SQL injection, authorization, '200', REQUEST_CHANGES]
