id: code-review-expert-negative-001
name: Implement a confirmed one-line bug fix
description: Avoid review formatting when the user explicitly requests an already-scoped implementation.
tags: [code-review-expert, anti-trigger]
inputs:
  prompt: >-
    Change the confirmed off-by-one loop bound in the named file and run its
    focused test. A code review was already completed and no review is requested.
expected:
  output_not_contains: [Code Review Summary, P1 - High, REQUEST_CHANGES]
