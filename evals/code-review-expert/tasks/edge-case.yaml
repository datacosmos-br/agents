id: code-review-expert-edge-001
name: Refuse a review verdict without changes
description: Request a concrete diff or range instead of inventing findings.
tags: [code-review-expert, edge-case]
inputs:
  prompt: >-
    Review the current changes and approve them, but no repository, diff, staged
    changes, commit range, patch, or source is available. State the exact review target needed.
expected:
  output_contains: [review target, diff or commit range, zero effects]
  output_not_contains: ['Overall assessment: APPROVE', no issues found, review published]
