
description: Semantic evaluation suite for doc-drift.


version: '1.0'


graders:
- type: prompt
  name: doc-drift-contract
  config:
    prompt: |-
      Grade the doc-drift response. Pass only if it compares each documented
      command and runtime claim with the supplied canonical owner, identifies
      the exact extinct contract, proposes owner-consistent corrections and
      contradiction checks, and never invents a replacement command or invokes
      the explicitly suspended runtime.
