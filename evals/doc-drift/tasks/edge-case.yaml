id: doc-drift-fail-closed-001
name: Documentation claim without an owner
description: Require owning code or pinned documentation before correcting a command.
tags:
- edge-case
inputs:
  prompt: A guide contains `tool finish`, but no owning code, schema, version, or pinned upstream documentation is available. Correct it now.
expected:
  output_contains:
  - canonical owner is required
  - replacement command cannot be inferred
  output_not_contains:
  - replace with tool done
  - documentation converged
