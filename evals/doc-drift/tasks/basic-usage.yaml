id: doc-drift-happy-path-001
name: Reconcile stale orchestrator lifecycle commands
description: Compare a stale guide with the supplied static command owner.
tags: [documentation, drift, runtime-contracts, authority-reconciliation, commands, validation, happy-path]
inputs:
  prompt: |
    Audit documentation drift in the supplied orchestrator commands and their
    runtime-contract owner. Compare the documentation claim and canonical owner.
    Identify each drifted command or responsibility, state the exact corrected
    contract, list consumers that require contradiction search, and define
    static validation. Do not run the suspended runtime.
  files:
  - path: command-contract.md
expected:
  output_contains:
  - orchestrator finish
  - orchestrator dispatch
  - repository owns Git
  - runtime is suspended
  - contradiction search
  - zero residue
