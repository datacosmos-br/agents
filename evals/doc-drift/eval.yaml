name: doc-drift-eval
description: Semantic evaluation suite for doc-drift.
skill: doc-drift
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/doc-drift
  required_skills:
  - doc-drift
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the audit reconcile documentation to its declared owner?
graders:
- type: prompt
  name: doc-drift-contract
  config:
    prompt: |-
      Grade the doc-drift response. Pass only if it compares each documented
      command and runtime claim with the supplied canonical owner, identifies
      the exact extinct contract, proposes owner-consistent corrections and
      contradiction checks, and never invents a replacement command or invokes
      the explicitly suspended runtime.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
