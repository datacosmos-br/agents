description: Operator corrections applied as text replacement at the single governing owner.
prompt: |-
  Grade the op-learning response. Pass only when it finds the governing text
  the correction contradicts, replaces it at its single owner with the general
  outcome instead of the incident, deletes every opposite and delivered copy
  in the same change, leaves the result no longer than before, keeps the
  operator's words in the tracker under a cited key, and changes nothing when
  no governing text is wrong. Two conflicting current corrections, or one that
  would change the agreed specification, get one precise question with both
  texts before any edit. Reject an added clause, rule or evaluation role, a
  restated incident, a copied mutable value, an invented approval, or an edit
  to a projection instead of its owner.
