id: op-learning-root-owner-001
name: Replace the text a correction contradicts
description: Turn operator corrections into text replacement through governance reconciliation.
tags: [operator-corrections, text-replacement, governance-reconciliation, happy-path]
inputs:
  prompt: Apply the operator correction in correction-state.yaml. Find the governing text it contradicts, replace it at its single owner, remove every opposite and delivered copy, and report the changed paths and the tracker key.
  files:
  - path: correction-state.yaml
expected:
  output_contains: [docs/legacy-debugging.md, rules/law.md, tracker, delete]
