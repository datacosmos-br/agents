id: op-learning-acknowledgment-negative-001
name: Continue after an acknowledgment
description: Do not create correction evidence when the operator changed no rule.
tags: [operator, acknowledgment, anti-trigger]
inputs:
  prompt: The operator says, "Thanks, continue with the approved implementation." No behavior, prohibition, replacement, or scope was corrected.
expected:
  output_not_contains: [substitute tracker, contradiction search, correction recorded, fallback, ledger updated]
