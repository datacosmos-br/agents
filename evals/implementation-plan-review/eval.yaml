name: implementation-plan-review-eval
description: Repository-grounded adversarial plan review and decision-complete promotion.
skill: implementation-plan-review
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/product/implementation-plan-review
  required_skills:
  - implementation-plan-review
graders:
- type: prompt
  name: implementation-plan-review-contract
  config:
    prompt: |-
      Grade the implementation-plan-review response according to the scenario. For the checkout-plan task, pass only
      when the response preserves the approved guest-checkout outcome, grounds
      findings in repo-context, identifies the missing idempotency schema and
      deployment recovery as material decisions, and returns one replacement
      plan with actor/outcome, owner, interfaces, states, failures, rollout,
      tests, runtime, landing, assumptions, and non-goals. For the missing-intent
      task, require approved product intent before promotion and make zero edits.
      For the patch-review task, route to code review without plan-promotion
      output. Reject invented scale, architecture, product scope, generic web
      claims, implementation effects, or a verdict without decisive evidence.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
