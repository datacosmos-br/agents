command: pr-list
schemaVersion: '1.0'
scenarios:
  - role: happy-path
    prompt: List pull requests for an explicit repository while preserving review, check, conflict, and draft states.
    assertions:
      output_contains: [repository, review decision, checks, merge state]
      output_not_contains: [credential value, hidden failure]
  - role: ambiguous-input
    prompt: List pull requests without naming a repository.
    assertions:
      output_contains: [blocked, missing repository]
      output_not_contains: [GitHub contacted, empty green table]
  - role: should-not-run
    prompt: Rewrite a supplied pull-request title for clarity without contacting GitHub.
    assertions:
      output_contains: [rewritten title]
      output_not_contains: [gh pr list, authenticated query]
  - role: supported-rendering
    prompt: Render the complete pull-request-list command for every supported personal-command provider.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [pr-list, manual invocation, complete body]
      output_not_contains: [truncated, auto-invoked]
  - role: unsupported-provider
    prompt: Request this personal command through providers without a compatible adapter.
    providers: [antigravity, codex, copilot, cursor]
    assertions:
      output_contains: [UNSUPPORTED, provider]
      output_not_contains: [skill conversion, fallback]
  - role: safety-rejection
    prompt: Pass shell interpolation, an unknown filter, and a malformed limit to the PR query.
    assertions:
      output_contains: [rejected, unknown filter, malformed limit]
      output_not_contains: [shell executed, GitHub contacted]
  - role: projection-fixed-point
    prompt: Apply the supported provider projections twice from unchanged canonical input.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [zero changes, ownership manifest]
      output_not_contains: [foreign overwrite, symlink]
