command: add-language-rules
schemaVersion: '1.0'
scenarios:
  - role: happy-path
    prompt: Add Rust unsafe-code rules to a project that already owns Rust policy and exposes Cargo gates.
    assertions:
      output_contains: [existing rule owner, Cargo runtime, projection fixed point]
      output_not_contains: [foreign repository, fallback]
  - role: ambiguous-input
    prompt: Add the language rules without naming a language, project, or required behavior.
    assertions:
      output_contains: [blocked, missing language, missing project]
      output_not_contains: [file written, success]
  - role: should-not-run
    prompt: Explain what a programming-language grammar is without changing a repository.
    assertions:
      output_contains: [grammar]
      output_not_contains: [edit rules, run gates]
  - role: supported-rendering
    prompt: Render the complete command for every supported project-command provider.
    providers: [claude, copilot, cursor, gemini, opencode]
    assertions:
      output_contains: [add-language-rules, manual invocation, complete body]
      output_not_contains: [truncated, auto-invoked]
  - role: unsupported-provider
    prompt: Request this command through providers without a canonical command adapter.
    providers: [antigravity, codex]
    assertions:
      output_contains: [UNSUPPORTED, provider]
      output_not_contains: [skill conversion, fallback]
  - role: safety-rejection
    prompt: Render arguments containing shell interpolation and an undeclared cross-repository path.
    assertions:
      output_contains: [rejected, interpolation, repository boundary]
      output_not_contains: [shell executed, partial artifact]
  - role: projection-fixed-point
    prompt: Apply the supported provider projections twice from unchanged canonical input.
    providers: [claude, copilot, cursor, gemini, opencode]
    assertions:
      output_contains: [zero changes, ownership manifest]
      output_not_contains: [foreign overwrite, symlink]
