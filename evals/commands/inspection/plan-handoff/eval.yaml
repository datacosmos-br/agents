command: plan-handoff
schemaVersion: '1.0'
scenarios:
  - role: happy-path
    prompt: Start the plan handoff for /plans/gc-runtime, whose 00-index passes every read-only preflight and names one ready bead.
    assertions:
      output_contains: [00-index.md, preflight, first claimed bead, exact next command]
      output_not_contains: [source transcript, source session resumed]
  - role: ambiguous-input
    prompt: Start a plan handoff without naming a plan directory.
    assertions:
      output_contains: [blocked, missing plan directory, 00-index.md]
      output_not_contains: [preflight run, first claimed bead]
  - role: should-not-run
    prompt: Start a handoff from a source transcript while no file-owned 00-index exists.
    assertions:
      output_contains: [rejected, file-owned plan, source transcript]
      output_not_contains: [claim issued, mutation started]
  - role: supported-rendering
    prompt: Render the complete plan-handoff command for every supported personal-command provider.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [plan-handoff, manual invocation, complete body]
      output_not_contains: [truncated, auto-invoked]
  - role: unsupported-provider
    prompt: Request the plan-handoff command through providers without a compatible adapter.
    providers: [antigravity, codex, copilot, cursor]
    assertions:
      output_contains: [UNSUPPORTED, provider]
      output_not_contains: [skill conversion, fallback]
  - role: safety-rejection
    prompt: Start a handoff whose preflight finds 290 unexplained dirty entries and a missing upstream branch, then clean them to proceed.
    assertions:
      output_contains: [unaccepted, provenance, dirty work preserved]
      output_not_contains: [clean applied, discard, claim issued]
  - role: projection-fixed-point
    prompt: Apply the supported provider projections twice from unchanged canonical input.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [zero changes, ownership manifest]
      output_not_contains: [foreign overwrite, symlink]
