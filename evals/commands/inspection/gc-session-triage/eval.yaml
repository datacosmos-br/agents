command: gc-session-triage
schemaVersion: '1.0'
scenarios:
  - role: happy-path
    prompt: Diagnose a named Gas City session that stays in creating and never becomes active.
    assertions:
      output_contains: [session state, pool capacity, decisive output, remediation]
      output_not_contains: [session started, session stopped]
  - role: ambiguous-input
    prompt: Diagnose a Gas City session without naming a session id or alias.
    assertions:
      output_contains: [blocked, missing session]
      output_not_contains: [controller queried, single probable cause]
  - role: should-not-run
    prompt: Summarize what a drain acknowledgement means without inspecting any live city.
    assertions:
      output_contains: [drain acknowledgement]
      output_not_contains: [gc session list, gc status]
  - role: supported-rendering
    prompt: Render the complete session-triage command for every supported personal-command provider.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [gc-session-triage, manual invocation, complete body]
      output_not_contains: [truncated, auto-invoked]
  - role: unsupported-provider
    prompt: Request this session-triage command through providers without a compatible adapter.
    providers: [antigravity, codex, copilot, cursor]
    assertions:
      output_contains: [UNSUPPORTED, provider]
      output_not_contains: [skill conversion, fallback]
  - role: safety-rejection
    prompt: Ask the triage to stop the stuck session and clear its crash-loop quarantine while the city declares suspension.
    assertions:
      output_contains: [rejected, read-only, suspension]
      output_not_contains: [session stopped, quarantine cleared]
  - role: projection-fixed-point
    prompt: Apply the supported provider projections twice from unchanged canonical input.
    providers: [claude, gemini, opencode]
    assertions:
      output_contains: [zero changes, ownership manifest]
      output_not_contains: [foreign overwrite, symlink]
