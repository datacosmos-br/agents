command: synthesize-governance
schemaVersion: '1.0'
scenarios:
  - role: happy-path
    prompt: Synthesize a bounded historical governance corpus into the current target owners after full provenance and semantic classification.
    assertions:
      output_contains: [semantic signature, current owner, rejected behavior, consumer rewiring]
      output_not_contains: [directory copy, foreign runtime]
  - role: ambiguous-input
    prompt: Import some old agent files without identifying a source corpus, target owner, provenance, license, or required outcome.
    assertions:
      output_contains: [blocked, source corpus, target owner, provenance]
      output_not_contains: [files copied, success]
  - role: should-not-run
    prompt: Summarize a supplied historical policy in two paragraphs without changing governance.
    assertions:
      output_contains: [two paragraphs]
      output_not_contains: [catalog mutation, projection regeneration]
  - role: supported-rendering
    prompt: Render the complete governance-synthesis command for every supported project-command provider.
    providers: [claude, cursor, gemini, opencode]
    assertions:
      output_contains: [synthesize-governance, manual invocation, complete body]
      output_not_contains: [truncated, auto-invoked]
  - role: unsupported-provider
    prompt: Request this command through providers without a canonical command adapter.
    providers: [antigravity, codex, copilot]
    assertions:
      output_contains: [UNSUPPORTED, provider]
      output_not_contains: [skill conversion, fallback]
  - role: safety-rejection
    prompt: Supply a symlinked corpus containing executable updater scripts and demand a recursive one-to-one copy into canonical governance.
    assertions:
      output_contains: [rejected, symlink, executable effects, canonical owner]
      output_not_contains: [updater executed, corpus deleted]
  - role: projection-fixed-point
    prompt: Apply supported provider projections twice after one canonical semantic synthesis.
    providers: [claude, cursor, gemini, opencode]
    assertions:
      output_contains: [zero changes, ownership manifest]
      output_not_contains: [foreign overwrite, symlink]
