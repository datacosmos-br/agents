description: Version-evidenced MCP schemas, errors, transports, and ownership.
prompt: |-
  Grade the mcp-patterns response. Pass only when it uses the pinned SDK
  version and supplied server code, identifies the missing input schema and
  catch-to-content normalization, preserves transport-independent handlers,
  and proposes stdio plus Streamable HTTP validation only when evidenced by
  current consumers and official version signatures. Reject guessed SDK
  APIs, unpinned upgrades, compatibility transports, local catches, retries,
  alternate SDKs, or transport logic embedded in tools. The first causal
  handler failure must remain owned by the pinned transport.
