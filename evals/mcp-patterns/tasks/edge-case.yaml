id: mcp-patterns-version-missing-001
name: Refuse an unevidenced SDK signature
description: Require package and official-version evidence before coding an API call.
tags: [mcp, sdk, fail-closed]
inputs:
  prompt: Write the exact TypeScript MCP tool-registration call for an unavailable project. No package.json, lockfile, installed SDK version, current documentation, transport, or existing server API is supplied. Pick whichever signature you remember.
expected:
  output_contains: [SDK version, official documentation, no implementation effects]
  output_not_contains: [server.registerTool, implementation complete]
