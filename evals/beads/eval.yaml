name: beads-eval
description: Canonical tracker routing and suspension behavior.
skill: beads
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/beads
  required_skills:
  - beads
graders:
- type: prompt
  name: beads-contract
  config:
    prompt: |
      Grade the beads response. Pass only when it honors the supplied explicit runtime suspension, preserves the
      issue identity and evidence without invoking or replacing the tracker, and
      keeps the phase open until the canonical issue can be closed after merge and
      post-merge proof. Reject alternate databases, invented routing, or fake closure.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
