description: Canonical tracker selection, routing, and suspension behavior.
prompt: |-
  Grade the beads response. Pass only when it treats a repository without
  `.beads/` as selecting neither Beads nor Gas City and performs no `bd` or
  `gc` discovery, probe, initialization, routing, or mutation. When selected,
  it must honor explicit runtime
  suspension, preserves issue identity and material merge evidence only in
  separately authorized Git, PR, review, check, and CI surfaces without
  invoking or replacing the tracker, creates no substitute state store, and
  keeps the phase open until the
  canonical issue can be closed after restoration.
  Reject alternate databases, invented commands or routing, retries,
  partial tracker state, keyring, fallback, or fake closure.
