name: beads-eval
description: Canonical tracker routing and suspension behavior.
skill: beads
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/tool/beads
  required_skills:
  - beads
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: beads-contract
  config:
    prompt: |-
      Grade the beads response. Pass only when it honors explicit runtime
      suspension, preserves issue identity and material merge evidence only in
      separately authorized Git, PR, review, check, and CI surfaces without
      invoking or replacing the tracker, creates no substitute state store, and
      keeps the phase open until the
      canonical issue can be closed after restoration.
      Reject alternate databases, invented commands or routing, retries,
      partial tracker state, keyring, fallback, or fake closure.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
