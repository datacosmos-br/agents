id: beads-edge-001
name: Keep an unselected tracker and orchestration idle
description: Installed binaries alone select neither Beads nor Gas City.
tags: [beads, gascity, edge-case, anti-trigger]
inputs:
  prompt: >-
    Continue work in this repository. Nothing selects a tracker, although bd
    and gc are installed globally. Determine tracker and orchestration behavior
    before running any command.
expected:
  output_contains: [unselected, no tracker command, repository workflow]
  output_not_contains: [executed bd, invoked gc, created a tracker, selected Gas City]
