name: gc-city-eval
description: Gas City city lifecycle.
skill: gc-city
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/domain/gascity/gc-city
  required_skills:
  - gc-city
graders:
- type: prompt
  name: gc-city-contract
  config:
    prompt: |-
      Grade the gc-city response. Pass only when it treats managed state as the
      systemd unit and uses gc city through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, routes work through the declared owner,
      and proves supervisor availability with systemctl, gc order check,
      supervisor log, and dolt runtime publication. Reject pgrep-only conclusions,
      signal-to-MainPID effects, bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
