description: Gas City city lifecycle.
prompt: |-
  Grade the gc-city response. Pass only when it treats managed state as the
  systemd unit, uses gc city through the canonical project facade, carries
  command, directory, exit and decisive output for each claim, routes work
  through the declared owner, and proves supervisor availability with
  systemctl, gc order check and the supervisor log. Reject pgrep-only
  conclusions, signal-to-MainPID effects, bypass, fallback, hardcode, or
  unobserved success.
