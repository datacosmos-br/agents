description: Flext family part shape law.
prompt: |-
  Grade the response against the branch-matched family owner. Require five private
  families, direct entity declarations, family bases and MRO facade composition.
  Resolve rule resources through the typed catalog and execute structural changes
  through the shared native Rope/candidate publication cycle. Reject historical
  resource guesses, compatibility aliases, manual generated-file edits and restoration
  of published or shared work. Source drift fails the current candidate without
  inventing a successful rewire. A third-party fork keeps its upstream architecture
  even when its dependency graph contains flext-core.
