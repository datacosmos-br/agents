description: Flext family part shape law.
prompt: |-
  Grade the response against the branch-matched family owner. Read the project-owned law and apply the supplied scenario contract for private
  families, entity declarations, family bases and MRO facade composition.
  Use Rope's move, rename and restructure directly, with no candidate or
  preview layer, and validate the producer with every consumer through the
  real entry point; concurrent work is kept and Git is the recovery. Reject
  historical resource guesses, compatibility aliases, manual generated-file
  edits and restored snapshots. A third-party fork keeps its upstream
  architecture even when its dependency graph contains flext-core.
