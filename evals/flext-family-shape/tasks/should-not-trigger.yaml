id: flextfamilyshape-negative-001
name: Preserve a third-party fork architecture
description: Do not impose FLEXT families on an upstream-owned project.
tags: [flext, family, shape, negative, invalid-trigger]
inputs:
  prompt: >-
    Review a third_party_fork that depends on flext-core but follows its upstream
    module layout. The operator asks for an upstream-conforming bug fix, not FLEXT
    adoption. State the applicable architecture boundary without proposing family
    generation, facade migration or a new FLEXT layer.
expected:
  output_contains: ['upstream', 'third_party_fork']
  output_not_contains: ['FLEXT adoption is required', 'Generate five FLEXT families']
