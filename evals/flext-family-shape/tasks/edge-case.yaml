id: flextfamilyshape-edge-001
name: Edge case flext-family-shape
description: Handle the material boundary case for flext-family-shape.
tags: [flext, family, shape, edge-case]
inputs:
  prompt: >-
    An internal_flext module proposes a sixth private family and a second top-level
    class. Its native semantic preview also reports a changed source epoch. Explain
    the rejected layout and the fail-forward disposition without restoring files or
    publishing a candidate from the stale preview.
  files:
  - path: scenario.yaml
expected:
  output_contains: ['five', 'families', 'one', 'class', 'reject', 'source']
  output_not_contains: ["normalized failure"]
