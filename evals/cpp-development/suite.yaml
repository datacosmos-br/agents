name: cpp-development-eval
description: C and C++ ownership, build, and verification decisions.
skill: cpp-development
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/technology/cpp-development
  required_skills:
  - cpp-development
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: cpp-development-contract
  config:
    prompt: |-
      Grade the cpp-development response. Pass only when it traces ownership in the supplied C++ fixture,
      preserves the project build contract, proposes a concrete RAII correction,
      removes the race through bounded ownership, and names focused runtime plus
      sanitizer evidence. Reject framework mandates, generic style summaries,
      catch/retry/fallback, partial rewiring, or a claim without material patch,
      first-failure, zero-effect, and residue proof.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
