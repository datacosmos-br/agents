id: cpp-ownership-001
name: Repair native ownership and concurrency
description: Exercise C++, build systems, and modern development through an owner-level repair.
tags: [cpp, cmake, ownership, sanitizers, concurrency, testing, happy-path]
inputs:
  prompt: Review sample.cpp and CMakeLists.txt as C++ build-system and modern-development owners. Identify the lifetime and concurrency defects, provide the smallest material RAII and bounded-synchronization patch that preserves the declared standard and target, and specify complete preflight, raw first sanitizer/compiler failure, zero effects, residue search, and focused leak/thread-sanitizer proof.
  files:
  - path: sample.cpp
  - path: CMakeLists.txt
expected:
  output_contains: [RAII, race, CMake, std::atomic, zero effects]
