id: cpp-toolchain-001
name: Unknown native toolchain
description: Do not invent a standard or build framework without repository evidence.
tags: [cpp, edge-case]
inputs:
  prompt: Rewrite an unavailable C++ library using the newest standard. No build files, compiler matrix, ABI policy, source, owner, runtime, or gates are supplied. Stop at the first missing prerequisite and create no source, flag, toolchain, fallback, or other effect.
expected:
  output_contains: [toolchain, ABI, no effect]
  output_not_contains: [-std=c++23]
