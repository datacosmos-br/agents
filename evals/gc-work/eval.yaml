name: gc-work-eval
description: Gas City work items (beads).
skill: gc-work
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/domain/gascity/gc-work
  required_skills:
  - gc-work
graders:
- type: prompt
  name: gc-work-contract
  config:
    prompt: |-
      Grade the gc-work response. Pass only when it uses gc work through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, and routes work through the declared
      owner. Reject bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
