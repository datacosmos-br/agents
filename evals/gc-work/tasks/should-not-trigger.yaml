id: gc-work-negative-001
name: Should not trigger gc-work
description: Do not force gc-work onto unrelated work.
tags: [gas-city, gc-work, anti-trigger]
inputs:
  prompt: >-
    Write a short product announcement for a new feature. Do not use gc work
    or Gas City orchestration in the response; the requested output is prose,
    not an agent workflow.
expected:
  output_not_contains: [gc work, Gas City]
