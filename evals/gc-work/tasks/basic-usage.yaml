id: gc-work-happy-001
name: Happy path gc-work
description: Exercise canonical gc work workflow.
tags: [gas-city, gc-work, happy-path]
inputs:
  prompt: >-
    Demonstrate the canonical gc-work workflow for one objective executed by
    two rigs. Search for the current shared HQ root, link each rig-local
    implementation bead to its corresponding shared child, and update both from
    the same evidence at material Git/gate checkpoints. Cover the bead
    lifecycle from `gc hook --claim` through evidence-backed close, including
    the hook ready/claim result and close preconditions. Use mail only to notify
    collaborators. Report exact commands, cwd, exit codes and decisive output
    without bypass or fallback.
  files:
  - path: scenario.yaml
expected:
  output_contains: [shared root, local bead, gc.shared_epic, gc.shared_child, checkpoint, bead lifecycle, hook ready, claim, close, mail, notification, gc]
  output_not_contains: [parallel root, mail as ledger]
