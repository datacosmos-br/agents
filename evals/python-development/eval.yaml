name: python-development-eval
description: Python engineering, debugging, and concurrency decisions.
skill: python-development
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/technology/python-development
  required_skills:
  - python-development
graders:
- type: prompt
  name: python-development-contract
  config:
    prompt: |-
      Grade the python-development response. Pass only when it uses evidence from the supplied Python fixture,
      identifies the concrete correctness or ownership risk, preserves the
      project-owned toolchain, provides a material typed owner correction, and
      gives an observable validation path. Reject generic Python advice,
      catch/translation, unjustified concurrency, retry/fallback, Make/Testmon
      assumptions, disabling Testmon or globally clearing its cache when it is
      project-owned, partial behavior, or success without raw first-failure,
      zero-effect, bounded targeted invalidation, and residue proof.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
