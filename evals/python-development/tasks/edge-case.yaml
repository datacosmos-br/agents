id: python-project-evidence-001
name: Refuse an invented Python toolchain
description: Require project evidence before selecting packaging and test owners.
tags: [python, packaging, edge-case]
inputs:
  prompt: Modernize an unavailable Python package. No Python version, pyproject, lockfile, dependency owner, test configuration, public API, or source is supplied. State what evidence blocks a safe implementation.
expected:
  output_contains: [version, dependency]
  output_not_contains: [uv add]
