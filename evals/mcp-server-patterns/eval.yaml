name: mcp-server-patterns-eval
description: Version-evidenced MCP schemas, errors, transports, and ownership.
skill: mcp-server-patterns
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/mcp-server-patterns
  required_skills:
  - mcp-server-patterns
graders:
- type: prompt
  name: mcp-server-patterns-contract
  config:
    prompt: |
      Grade the mcp-server-patterns response. Pass only when it uses the pinned SDK
      version and supplied server code, identifies the missing input schema and
      raw error exposure, preserves transport-independent handlers, and proposes
      stdio plus Streamable HTTP validation against current official signatures.
      Reject guessed SDK APIs, unpinned upgrades, legacy SSE by default, raw stack
      traces, or transport logic embedded in tools.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
