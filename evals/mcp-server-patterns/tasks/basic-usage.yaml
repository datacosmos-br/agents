id: mcp-server-patterns-tool-review-001
name: Review an unsafe MCP lookup tool
description: Ground schema, error, and transport changes in the pinned SDK.
tags: [mcp, server, sdk, tools, resources, transport, happy-path]
inputs:
  prompt: Review the Node/TypeScript MCP server pattern in package.json and server.ts. Assess its SDK tool against schema and error requirements, distinguish tools from resources and prompts, separate handlers from transports, and give version-verified stdio and Streamable HTTP runtime tests without guessing signatures.
  files:
  - path: package.json
  - path: server.ts
expected:
  output_contains: ['1.17.0', Zod, structured error, Streamable HTTP]
