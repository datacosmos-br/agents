name: mcp-server-patterns-eval
description: Version-evidenced MCP schemas, errors, transports, and ownership.
skill: mcp-server-patterns
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/tool/mcp-server-patterns
  required_skills:
  - mcp-server-patterns
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: mcp-server-patterns-contract
  config:
    prompt: |-
      Grade the mcp-server-patterns response. Pass only when it uses the pinned SDK
      version and supplied server code, identifies the missing input schema and
      catch-to-content normalization, preserves transport-independent handlers,
      and proposes stdio plus Streamable HTTP validation only when evidenced by
      current consumers and official version signatures. Reject guessed SDK
      APIs, unpinned upgrades, compatibility transports, local catches, retries,
      alternate SDKs, or transport logic embedded in tools. The first causal
      handler failure must remain owned by the pinned transport.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
