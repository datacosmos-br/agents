name: gascity-docs-eval
description: Project documentation conventions.
skill: gascity-docs
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/domain/gascity/gascity-docs
  required_skills:
  - gascity-docs
graders:
- type: prompt
  name: gascity-docs-contract
  config:
    prompt: |-
      Grade the gascity-docs response. Pass only when it uses gascity docs through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, and routes work through the declared
      owner. Reject bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
