id: gascity-docs-happy-001
name: Document worker drain and restart behavior
description: Update the correct guide and reference pages from the runtime owner.
tags: [gas-city, gascity-docs, happy-path]
inputs:
  prompt: >-
    Read scenario.yaml and document worker drain/restart behavior without copying
    configuration defaults. Place task guidance and key-only reference material
    in the existing information architecture, link the runtime owner, update
    navigation if required, and prove the canonical docs gate.
  files:
