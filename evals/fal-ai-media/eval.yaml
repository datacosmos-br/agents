name: fal-ai-media-eval
description: Evaluation suite for fal-ai-media.
skill: fal-ai-media
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/fal-ai-media
  required_skills:
  - fal-ai-media
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the skill complete the assigned task?
graders:
- type: code
  name: has_output
  config:
    assertions:
    - len(output) > 0
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 300000
tasks:
- tasks/*.yaml
