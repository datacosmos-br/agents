name: fal-ai-media-eval
description: Semantic evaluation suite for fal-ai-media.
skill: fal-ai-media
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/fal-ai-media
  required_skills:
  - fal-ai-media
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did generation use the requested medium, model, cost, and parameters?
graders:
- type: prompt
  name: fal-ai-media-contract
  config:
    prompt: |
      Grade the fal-ai-media response. Pass only if it selects a model suited
      to the supplied image brief, preserves every declared generation
      parameter, estimates cost before the expensive operation, uses a seed for
      reproducibility, and reports the generated artifact or explicit job state
      without inventing a URL, result, credential, or successful generation.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
