name: verification-loop-eval
description: Ordered fresh gates, real surface, fixed point, and evidence scope.
skill: verification-loop
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/verification-loop
  required_skills:
  - verification-loop
graders:
- type: prompt
  name: verification-loop-contract
  config:
    prompt: |
      Grade the verification-loop response. Pass only when it records each fresh
      command, exit code, decisive output and scope in order, distinguishes tests
      from real-surface proof, includes generated fixed point, and limits the claim
      to the covered projection slice. Reject skipped stages, warnings, stale output,
      or a broad done claim that exceeds the evidence.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
