id: verification-loop-runtime-first-001
name: Audit fresh runtime-first evidence
description: Bound completion evidence with public runtime and root Make gates.
tags: [completion-evidence, runtime-verification, native-gates, happy-path]
inputs:
  prompt: |
    Evaluate gate-evidence.md as completion evidence. State what each entry
    proves, what is red, what remains unverified, and the next step.
  files:
  - path: gate-evidence.md
expected:
  output_contains: [cache hit, exit 1, red, entry point, same error]
  output_not_contains: [composite green, implementation complete]
