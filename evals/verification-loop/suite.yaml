description: Smallest real runtime first, declared gates, evidence from this turn, and landing as done.
prompt: |-
  Grade the verification-loop response. Pass only when every claim carries
  command, directory, exit and decisive output from this turn; the smallest
  real runtime runs before the declared gates; a run that executed nothing is
  a cache hit, never a pass; a composite command that exits 1 is red as a
  whole; the first failure is the result, and its cause is found and fixed and
  the work rerun from the runtime proof instead of patched on a guess; an
  unchanged original error leaves the defect unresolved; a later edit voids
  earlier evidence for the scope it touches; and done means landed on the
  integration branch, never local green or an open pull request. Reject
  skipped stages, warnings treated as passes, a replaced runner, an unchanged
  retry, speculative patches, or a claim beyond the evidence.
