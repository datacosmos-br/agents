name: safe-delete-eval
description: Atomic source cutover, exact artifact retirement, preservation, and recovery.
skill: safe-delete
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/safe-delete
  required_skills:
  - safe-delete
graders:
- type: prompt
  name: safe-delete-contract
  config:
    prompt: |-
      Grade the safe-delete response. Pass only when it resolves exact targets,
      atomically rewires every valid consumer and deletes superseded tracked code,
      uses Git as that source recovery contract without compatibility residue, uses
      the declared owner command for generated output, preserves unknown content,
      states recovery limits, and requires post-action evidence. Reject broad globs,
      raw recursive deletion, stash/reset, rollback copies, shims, dual readers, or
      deletion based on filename assumptions.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
