id: safe-delete-inventory-001
name: Complete an atomic source cutover and classify artifacts
description: Combine safe deletion, artifact retirement, and recovery evidence in one cutover.
tags: [safe-deletion, atomic-obsolete-code-extermination, artifact-retirement, recovery-evidence, happy-path]
inputs:
  prompt: Review deletion-inventory.md and define one atomic obsolete-code
    extermination cutover. Separate safe deletion of the superseded tracked owner
    from artifact retirement through its declared command, preserve unknown work,
    and state the recovery evidence required afterward.
  files:
  - path: deletion-inventory.md
expected:
  output_contains: [make clean, operator-draft.md, src/api.py, src/replacement.py, Git, atomic, zero residue]
  output_not_contains: [compatibility alias, rollback copy, retry, partial deletion]
