id: safe-delete-inventory-001
name: Complete an atomic source cutover and classify artifacts
description: Combine safe deletion, artifact retirement, and recovery evidence in one cutover.
tags: [safe-deletion, atomic-obsolete-code-extermination, artifact-retirement, recovery-evidence, happy-path]
inputs:
  prompt: Review deletion-inventory.md and define one atomic obsolete-code
    extermination cutover. Delete the superseded tracked owner with its consumer
    rewired, retire the generated artifact through its declared command, keep
    unknown work, move the approved provider tree in one step, and state the
    recovery evidence afterward.
  files:
  - path: deletion-inventory.md
expected:
  output_contains: [make clean, operator-draft.md, src/api.py, src/replacement.py, Git, agents.legacy, rename, '.venv']
  output_not_contains: [symlink quarantine, copy virtual environment, compatibility alias, rollback copy, retry, partial deletion]
