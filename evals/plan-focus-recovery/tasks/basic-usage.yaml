id: plan-focus-recovery-bounded-detour-001
name: Correct one skill and resume Flext
description: Preserve the execution cursor across a required external adjustment.
tags: [plan, continuity, interruption, recovery, happy-path]
inputs:
  prompt: Use active-plan.yaml. Incorporate the incoming skill correction as a
    bounded detour, identify the exact evidence it invalidates, and keep fixing
    the detour until its integration boundary is proven before showing the
    concrete return to Flext. Do not expand into unrelated runtime defects.
  files:
  - path: active-plan.yaml
expected:
  output_contains: [Runtime-first governance validation, approval, merge, integration SHA, pytest_runner.py]
  output_not_contains: [repository-wide expansion, resume now, DONE]
