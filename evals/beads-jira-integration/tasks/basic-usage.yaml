id: beads-jira-integration-happy-001
name: Happy path beads-jira-integration
description: Synchronize beads with Jira through the native CLI and the epic-link service.
tags: [beads, jira, sync, epic, link, flext, service, native, cli, only, happy-path]
inputs:
  prompt: >-
    Check the integration state with bd jira status, preview the push with
    bd jira sync --push --dry-run, review the preview, create the missing
    issues with --create-only, confirm the beads CLI wrote external_ref on each
    created bead, and use the FLEXT epic-link service as the only custom step
    to set the Jira parent on unparented issues before reporting commands and
    exit codes.
  files:
  - path: scenario.yaml
expected:
  output_contains: [bd jira status, dry-run, external_ref, epic, exit code]
  output_not_contains: [urllib.request, direct REST call]
