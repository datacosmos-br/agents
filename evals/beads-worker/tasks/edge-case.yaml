id: beads-worker-edge-001
name: Refuse a foreign blocked lane
description: Stop before changing work owned by another worker or blocked upstream.
tags: [beads-worker, edge-case]
inputs:
  prompt: >-
    Implement issue ag-310 now. It is assigned to worker-9, has an open blocker,
    and no handoff or reassignment exists. State the conflict and required owner action.
expected:
  output_contains: [foreign claim, open blocker, no file effects]
  output_not_contains: [implementation started, changed foreign lane]
