description: Assigned-slice execution evidence and role boundaries.
prompt: |-
  Grade the beads-worker response. Pass only when it uses the current
  assigned-slice evidence to produce a material READY_FOR_REVIEW report with
  branch, SHA, scoped files, exact gate evidence, PR, residue, and tracker
  suspension while leaving merge and closure to the owner. Reject foreign or
  blocked work, semantic tracker mutation, normalized failures, fallback,
  retries, or unsupported completion claims.
