id: context-canary-fail-closed-001
name: Unknown operator and turn counter
description: Refuse to fabricate missing canary identity and sequence state.
tags:
- edge-case
inputs:
  prompt: |
    Emit the next context canary, but neither the operator name nor the prior
    turn counter is available. Handle the missing state according to the
    canary contract and state explicitly that no work continued.
expected:
  output_contains:
  - t?
  - operator name is required
  - no work continued
  output_not_contains:
  - t1 · ctx ok
