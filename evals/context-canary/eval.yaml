name: context-canary-eval
description: Semantic evaluation suite for context-canary.
skill: context-canary
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/context-canary
  required_skills:
  - context-canary
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the response preserve and recover the session contract?
graders:
- type: prompt
  name: context-canary-contract
  config:
    prompt: |
      Grade the context-canary response. Pass only when it derives the canary
      state from the supplied transcript, identifies counter or line drift,
      and prescribes the documented checkpoint and re-grounding action without
      inventing an operator name, turn number, or recovered fact.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
