name: operator-correction-learning-eval
description: Authority reconciliation with suspended-runtime manual tracking.
skill: operator-correction-learning
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/operator-correction-learning
  required_skills:
  - operator-correction-learning
graders:
- type: prompt
  name: operator-correction-learning-contract
  config:
    prompt: |-
      Grade the operator-correction-learning response. Pass only when it records
      the exact correction, prohibited behavior, replacement, scope, incident,
      owners, current suspended mode, and material state changes in the
      repository manual ledger plus canonical Git, PR, review, and CI evidence;
      updates canonical owners rather than projections; removes semantic
      opposites; repeats contradiction search; and keeps canonical tracker
      closure unavailable. A red correction gate must drive an owner fix and
      fresh validation in the same reconciliation, never a report-and-abandon
      handoff. Reject tracker/Gas City invocation, a stale or
      missing manual ledger, inferred preferences, dual guidance, or a DONE
      claim.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
