id: operator-correction-learning-suspended-tracker-001
name: Reconcile a storage correction during suspension
description: Preserve Git and PR evidence while reconciling owners and consumers.
tags: [operator, correction, learning, precedence, contradiction, evidence, happy-path]
inputs:
  prompt: Apply operator-correction learning to correction-state.yaml. Reconcile precedence, contradiction, governance owners, and evidence through canonical Git and PR surfaces, remove opposing consumers, define validation and repeated search, keep tracker and Gas City untouched, and create no substitute tracker.
  files:
  - path: correction-state.yaml
expected:
  output_contains: [Git, PR, rules/storage.md, /tmp, not DONE]
  output_not_contains: [manual ledger, suspension-ledger.yaml]
