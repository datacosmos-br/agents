id: plan-review-code-patch-negative-001
name: Review a concrete code patch
description: Route source-code defects to code review instead of plan promotion.
tags: [code-review, patch, anti-trigger]
inputs:
  prompt: Review patch.md for correctness regressions. There is no implementation plan to promote.
  files:
  - path: patch.md
expected:
  output_contains: [subtotal, tax]
  output_not_contains: [replacement implementation plan, plan altitude]
