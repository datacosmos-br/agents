id: gc-dispatch-edge-001
name: Edge case gc-dispatch
description: Handle missing or ambiguous gc-dispatch context without bypass.
tags: [gas-city, gc-dispatch, edge-case]
inputs:
  prompt: >-
    Invoke gc-dispatch when the city or rig context is missing, ambiguous, or the
    required gc binary is unavailable. Do not invent a fallback runtime or
    synthesize a success claim. Report the first missing precondition.
expected:
  output_contains: [missing, gc-dispatch]
  output_not_contains: [fallback, synthesized success]
