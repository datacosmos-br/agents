id: gc-dispatch-happy-001
name: Sling an indexed migration formula
description: Resolve the target role and formula variables before dispatch.
tags: [gas-city, gc-dispatch, happy-path]
inputs:
  prompt: >-
    Read scenario.yaml, verify that search/worker and indexed-migration exist,
    validate both required variables, then sling bead search-118 to the role on
    that formula. Report exact discovery and dispatch commands, cwd, exit code,
    convoy/order identity, and decisive output.
    Prove Gas City dispatch, sling routing, formula workflow, and convoy orders
    without substituting a direct session command.
  files:
  - path: scenario.yaml
expected:
  output_contains: [search/worker, indexed-migration, products-v3, dev, gc sling, search-118, exit code]
