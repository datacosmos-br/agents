description: Go cancellation, error, race, ownership, and native-gate decisions.
prompt: |-
  Grade the go-dev response. Pass only when it cites the supplied Go
  module and worker code, identifies the detached goroutine and discarded
  error, proposes explicit context ownership with raw error propagation and
  atomic consumer rewiring, and names project-native format, vet, race, test,
  build, first-failure, zero-effect, and residue evidence. Reject generic Go
  advice, an invented module/toolchain, error wrapping/normalization, retry,
  fallback, or detached/partial execution.
