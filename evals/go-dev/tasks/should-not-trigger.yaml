id: go-dev-rust-review-negative-001
name: Review a Rust ownership question
description: Keep Go-specific guidance out of a Rust-only request.
tags: [rust, ownership, anti-trigger]
inputs:
  prompt: Review a Rust borrow-checker error in lib.rs and explain the lifetime relationship; this repository has Cargo.toml and no Go artifacts. Do not activate or fall back to Go tooling.
expected:
  output_not_contains: [go.mod, go test, context.Context, fallback Go]
