id: go-dev-owner-missing-001
name: Refuse to invent a Go module contract
description: Require module, API, and native-gate evidence before implementation.
tags: [go, module, fail-closed]
inputs:
  prompt: Modernize an unavailable Go service now. No go.mod, go.work, Go version, source, public API, generated-file owner, runtime, or project validation commands are supplied. Stop at the first missing prerequisite and create no module, source, goroutine, fallback toolchain, or other effect.
expected:
  output_contains: [go.mod, public API, no effect]
  output_not_contains: [module example.com, change completed]
