id: go-dev-worker-lifecycle-001
name: Review a cancellable Go worker
description: Exercise Go module development and toolchain detection through causal worker repair.
tags: [go, development, testing, concurrency, errors, modules, happy-path]
inputs:
  prompt: Exercise Go module development and toolchain detection by reviewing this detected module. Read go.mod, note that no go.work is present, identify the lifecycle/error defects, and provide the smallest material owner patch that passes caller-owned context, removes the detached goroutine, returns the raw sink error, rewires consumers atomically, and proves first failure, zero effects, residue, race, vet, test, and build behavior.
  files:
  - path: go.mod
  - path: worker.go
expected:
  output_contains: [context.Context, raw error, go test -race, zero effects]
