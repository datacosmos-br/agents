id: investor-materials-customer-sheet-negative-001
name: Write a customer implementation sheet
description: Keep fundraising structure out of a customer-facing deployment brief.
tags: [customer, implementation, anti-trigger]
inputs:
  prompt: Draft a one-page implementation checklist for a new enterprise customer, covering SSO setup, data import, and support contacts. No fundraising asset is requested.
expected:
  output_not_contains: [SAFE, use of funds, investor ask]
