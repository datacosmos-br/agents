name: investor-materials-eval
description: Defensible fundraising assets from one consistent fact source.
skill: investor-materials
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/investor-materials
  required_skills:
  - investor-materials
graders:
- type: prompt
  name: investor-materials-contract
  config:
    prompt: |
      Grade the investor-materials response. Pass only when every traction, raise,
      instrument, use-of-funds, and milestone statement matches the supplied fact
      source, the spending layers sum to the raise, assumptions remain visible,
      and the requested one-pager is defensible without hype. Reject conflicting
      numbers, hidden assumptions, arithmetic drift, or drafting through a known
      source-of-truth conflict.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
