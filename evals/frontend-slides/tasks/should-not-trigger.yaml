id: frontend-slides-should-not-trigger-001
name: Recalculate a spreadsheet model
description: Spreadsheet formulas are not an HTML presentation request.
tags:
- anti-trigger
- negative-test
inputs:
  prompt: Recalculate the discount rate formulas in this spreadsheet; no presentation or slides are requested.
expected:
  output_not_contains:
  - presentation.html
  - '.slide {'
  - IntersectionObserver
