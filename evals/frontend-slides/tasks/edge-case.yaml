id: frontend-slides-fail-closed-001
name: Refuse an invalid overloaded single-slide contract
description: Fail before writing when one required slide cannot remain readable.
tags:
- edge-case
inputs:
  prompt: >-
    Put 30 bullets and a 40-line code sample on exactly one 375x667 slide. Keep
    18px fixed text and add an internal scrollbar if it overflows. Do not change
    the one-slide requirement; stop before writing if it is invalid.
expected:
  output_contains:
  - viewport contract is invalid
  - no presentation created
  output_not_contains:
  - 'overflow: auto'
  - internal scrollbar
  - presentation.html
