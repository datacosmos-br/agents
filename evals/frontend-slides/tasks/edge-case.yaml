id: frontend-slides-fail-closed-001
name: Overloaded single-slide request
description: Split unreadable content instead of introducing scroll or tiny type.
tags:
- edge-case
inputs:
  prompt: Put 30 bullets and a 40-line code sample on one 375x667 slide. Keep 18px fixed text and add an internal scrollbar if it overflows.
expected:
  output_contains:
  - split into multiple slides
  - 'overflow: hidden'
  output_not_contains:
  - 'overflow: auto'
  - internal scrollbar
