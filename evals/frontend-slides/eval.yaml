name: frontend-slides-eval
description: Semantic evaluation suite for frontend-slides.
skill: frontend-slides
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/frontend-slides
  required_skills:
  - frontend-slides
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the deck remain distinctive, accessible, self-contained, and viewport-safe?
graders:
- type: prompt
  name: frontend-slides-contract
  config:
    prompt: |-
      Grade the frontend-slides response. Pass only if it follows the supplied
      outline and chosen preset, produces a zero-dependency semantic HTML deck,
      applies mandatory viewport and density constraints, implements keyboard,
      wheel, touch, reveal, progress, and reduced-motion behavior, and reports
      validation at all requested viewport classes without hiding overflow.
      Reject undeclared remote dependencies, deferred preview cleanup, or
      publication before complete viewport validation.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
