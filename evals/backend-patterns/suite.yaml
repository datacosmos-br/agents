name: backend-patterns-eval
description: Backend ownership, query, authorization, and failure-path design.
skill: backend-patterns
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/project-wide/architecture/backend-patterns
  required_skills:
  - backend-patterns
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: backend-patterns-contract
  config:
    prompt: |-
      Grade the backend-patterns response. Pass only when it traces the supplied service's N+1 query and tenant
      boundary, proposes the smallest repository/service correction with bounded
      pagination and observable failure behavior, and preserves the project's
      existing stack. Reject a framework rewrite or unevidenced cache layer.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
