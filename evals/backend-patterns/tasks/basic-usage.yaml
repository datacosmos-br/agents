id: backend-patterns-happy-001
name: Remove an N-plus-one tenant query
description: Correct persistence patterns at one backend service boundary.
tags: [backend-architecture, service-boundaries, persistence-patterns, performance, reliability, happy-path]
inputs:
  prompt: >-
    Review orders-service.ts as backend architecture with one service boundary.
    Identify the query and ownership risks, apply the existing persistence pattern,
    and propose the smallest repository/service change
    that batches item loading and bounds the result set, and name tests for tenant
    isolation, empty results, and database failure.
  files:
  - path: orders-service.ts
expected:
  output_contains: [N+1, customerId, batch, pagination, tenant, causal]
