id: backend-patterns-happy-001
name: Remove an N-plus-one tenant query
description: Correct a concrete server-side query path without replacing the stack.
tags: [backend, architecture, api, database, performance, reliability, happy-path]
inputs:
  prompt: >-
    Review orders-service.ts for a customer-scoped list endpoint. Identify the
    query and ownership risks, propose the smallest repository/service change
    that batches item loading and bounds the result set, and name tests for tenant
    isolation, empty results, and database failure.
  files:
  - path: orders-service.ts
expected:
  output_contains: [N+1, customerId, batch, pagination]
