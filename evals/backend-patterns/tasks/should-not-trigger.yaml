id: backend-patterns-negative-001
name: Name one public REST resource
description: Route a contract-only naming question to API design.
tags: [backend-patterns, anti-trigger]
inputs:
  prompt: >-
    Decide whether a public collection URL should be /team-member or
    /team-members. No server implementation or database change is requested.
expected:
  output_not_contains: [repository layer, database index, Redis cache]
