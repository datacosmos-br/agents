id: backend-patterns-edge-001
name: Refuse an unevidenced cache and queue stack
description: Require workload and consistency contracts before adding infrastructure.
tags: [backend-patterns, edge-case]
inputs:
  prompt: >-
    Add Redis caching and a background queue to an unavailable backend. No hot
    path, latency profile, consistency requirement, invalidation owner, retry
    contract, deployment topology, or existing framework is known. State why an
    implementation choice is blocked.
expected:
  output_contains: [workload evidence, invalidation owner]
  output_not_contains: [redis.setex, npm install redis]
