id: article-writing-negative-001
name: Produce terse changelog bullets
description: Avoid long-form article structure for a release-note formatting task.
tags: [article-writing, anti-trigger]
inputs:
  prompt: >-
    Convert cache-release-notes.md into exactly three terse changelog bullets.
    Do not add narrative framing.
  files:
  - path: cache-release-notes.md
expected:
  output_not_contains: [Introduction, Conclusion, In today's]
