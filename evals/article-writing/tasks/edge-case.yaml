id: article-writing-edge-001
name: Refuse unsupported case-study claims
description: Preserve source boundaries when requested proof and quotations do not exist.
tags: [article-writing, edge-case]
inputs:
  prompt: >-
    Use cache-release-notes.md to write a customer case study claiming 70 percent
    cloud-cost savings and include a customer quotation. Stop at the first
    unsupported requirement, identify the missing source, and do not draft a
    case study or substitute article.
  files:
  - path: cache-release-notes.md
expected:
  output_contains: [unsupported claim, customer source, no article]
  output_not_contains: [This cut our cloud bill in half, case study draft]
