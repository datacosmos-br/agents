id: article-writing-happy-001
name: Explain a measured build-cache improvement
description: Turn release evidence into a concise technical article for platform engineers.
tags: [article, technical-writing, guides, blog, newsletter, tutorials, happy-path]
inputs:
  prompt: >-
    Write a 600-word technical article from cache-release-notes.md. Lead with the
    measured before-and-after result, explain why the cache key is safe, discuss
    the no-lockfile limitation, and close with concrete adoption checks rather
    than a generic recap. Do not invent customer or cost evidence.
  files:
  - path: cache-release-notes.md
expected:
  output_contains: [11 minutes 40 seconds, 4 minutes 12 seconds, 28 repositories, lockfile digest]
