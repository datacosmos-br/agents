id: article-writing-happy-001
name: Explain a measured build-cache improvement
description: Exercise source synthesis as long-form technical writing for platform engineers.
tags: [article, technical-writing, source-synthesis, long-form-writing, guides, blog, newsletter, tutorials, happy-path]
inputs:
  prompt: >-
    Synthesize cache-release-notes.md into a 600-word long-form technical article.
    Lead with the measured before-and-after result, explain why the cache key is
    safe, discuss the no-lockfile limitation, and close with concrete adoption
    checks rather than a generic recap. Do not invent customer or cost evidence.
  files:
  - path: cache-release-notes.md
expected:
  output_contains: [11 minutes 40 seconds, 4 minutes 12 seconds, 28 repositories, lockfile digest]
