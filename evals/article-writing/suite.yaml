name: article-writing-eval
description: Source-backed long-form technical writing.
skill: article-writing
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/personal/article-writing
  required_skills:
  - article-writing
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: article-writing-contract
  config:
    prompt: |-
      Grade the article-writing response. Pass only when the article leads with the supplied benchmark, explains
      the concrete cache mechanism accurately, keeps one useful job per section,
      and limits claims to the release-note evidence. Reject generic AI framing,
      hype, invented customers, filler conclusions, unsupported numbers, or a
      partial article after a required source fails preflight.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
