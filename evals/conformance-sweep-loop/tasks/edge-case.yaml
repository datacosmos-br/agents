id: conformance-sweep-loop-red-wave-002
name: Red wave blocks closure
description: A wave that stays red must keep the loop open with evidence.
tags: [conformance, sweep, failure]
inputs:
  prompt: |-
    |-
    During a conformance sweep loop one repair wave revalidates red. Keep the loop open, record the failing wave with command and exit evidence, attribute the finding to its owning rule owner, and forbid closure until the revalidation turns green.
expected:
  output_contains: [red, evidence, owner, open, revalidation]
  output_not_contains: [closed, force close, ignore]
