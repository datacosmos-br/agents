description: Conformance sweep loop, class-wave repair mapping, loop discipline.
prompt: |-
  Grade the conformance-sweep-loop response. Pass only when it inventories
  findings by gate and class, maps a repair owner per class, repairs every
  class wave before rewiring consumers and rewriting tests, runs one
  revalidation at the end of the round with no heavy validation between
  waves, and closes only with zero residue
  plus a recorded loop receipt. Reject hardcoded class lists, unowned repairs,
  skipped revalidation, or loop termination with findings outstanding.
