id: governance-audit-static-snapshot-001
name: Audit a suspended governance snapshot
description: Classify authority conflicts and stale instructions from supplied evidence only.
tags: [governance, governance-drift, authority-conflicts, stale-instructions, audit, tracker, documentation, happy-path]
inputs:
  prompt: Conduct a static audit of governance-snapshot.yaml while the canonical
    tracker is suspended. Classify authority conflicts and source/projection
    disagreement, identify stale instructions and governance drift, and classify
    the supplied external corpus bundle by behavior and provenance. Return the
    required evidence and severity table without mutation, tracker invocation,
    or foreign updater execution.
  files:
  - path: governance-snapshot.yaml
expected:
  output_contains: [OPS-12, OPS-20, P0, config/governance/policy.md, external-corpus/router.md, owner extension, updater rejected]
