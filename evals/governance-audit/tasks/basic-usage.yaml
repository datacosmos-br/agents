id: governance-audit-static-snapshot-001
name: Audit a suspended governance snapshot
description: Classify tracker conflicts and document drift from supplied evidence only.
tags: [governance, audit, drift, staleness, tracker, documentation, happy-path]
inputs:
  prompt: Conduct a governance audit of governance-snapshot.yaml while the Beads tracker is suspended. Check standing items, staleness, canonical document surfaces, and source/projection drift; return the required evidence and severity table without mutation.
  files:
  - path: governance-snapshot.yaml
expected:
  output_contains: [OPS-12, OPS-20, zombie, P0]
