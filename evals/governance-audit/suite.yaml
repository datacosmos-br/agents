name: governance-audit-eval
description: Static tracker and documentation-drift classification with evidence.
skill: governance-audit
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/governance/governance-audit
  required_skills:
  - governance-audit
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: governance-audit-contract
  config:
    prompt: |-
      Grade the governance-audit response. Pass only when it audits every supplied
      tracker/document fact, identifies the state conflict, zombie lane, NULL
      epic, and source/projection drift, assigns the documented severities, and
      presents evidence plus owner-correct recommendations. When an external
      corpus is supplied, require router/resource/provenance/license/effect
      inspection and semantic classification without changing the corpus. While tracking is
      suspended it must remain read-only and static. Reject tracker commands,
      direct closure, projection edits, omissions, claims based on timestamps,
      file-count adoption, foreign runtime execution, or continued checks after
      the first causal inspection failure.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
