id: zcode-session-extract-happy-001
name: Extract private ZCode session evidence from rollout JSONL
description: Extract private conversation evidence and the terminal error from a real-shaped ZCode rollout JSONL.
tags: [zcode, session, extract, jsonl, handoff, happy-path]
inputs:
  prompt: >-
    Resume ZCode session sess_42a935f9-67d5-4c4f-93f2-90da387f014a for the
    configured workspace. The authenticated rollout JSONL is attached.
