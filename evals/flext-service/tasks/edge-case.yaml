id: flext-service-unknown-handler-contract-001
name: Refuse handler wiring when the dispatcher contract is absent
description: Fail closed without guessing container registration or dependency result types.
tags: [flext-service, fail-closed, missing-contract]
inputs:
  prompt: >-
    In an internal_flext consumer I want to move three command handlers onto the
    shared container dispatcher and to expose an isolated instance with a cloned
    settings snapshot. I have supplied neither the consumer's container
    dispatcher registration contract (signatures, handler wrapping, unwrap
    policy) nor the handlers' dependency result types or side effects. Give your
    decision and the precise evidence needed before editing. Do not fabricate
    the registration calls or a sample patch.
expected:
  output_contains: ['contract', 'dispatcher', 'settings', 'result', 'side effects']
  output_not_contains: ['register_handler(', 'dispatcher().unwrap()', 'def connect']
