id: ssot-retry-policy-cutover-001
name: Converge retry policy on one authority
description: Remove competing defaults and rewire the generated consumer path.
tags: [ssot, authority, ownership, projections, drift, convergence, happy-path]
inputs:
  prompt: Apply the complete search-first -> YAGNI -> optional SOLID -> SSOT -> simplify-inline flow to policy-project, using DRY only for confirmed structural rewiring. Make the declared retry-policy config the only writable authority, remove every competing default and copied mutable value, preserve explicit failures, and define real runtime, two-run generation fixed point, and native-gate proof.
  files:
  - path: policy-project/AGENTS.md
  - path: policy-project/docs/architecture.md
  - path: policy-project/docs/configuration.md
  - path: policy-project/config/retry-policy.toml
  - path: policy-project/tools/render_policy.py
  - path: policy-project/src/retries/generated_policy.py
  - path: policy-project/src/retries/worker.py
  - path: policy-project/src/retries/cli.py
  - path: policy-project/tests/test_worker.py
expected:
  output_contains: [config/retry-policy.toml, sole writable authority, render_policy.py, generated_policy.py, EMAIL_MAX_ATTEMPTS, fixed point, python -m retries.cli email, pytest]
  output_not_contains: [hand-edit generated_policy.py, keep both defaults]
