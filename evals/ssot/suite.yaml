description: Unique writable authority, complete cutover, projection convergence, and bounded non-triggering.
prompt: |-
  Grade the SSOT skill according to the scenario. For policy-project, pass only when the
  response reads the supplied project law, architecture, config, generator,
  generated projection, consumer, CLI, documentation, and tests; identifies
  config/delivery-policy.toml as the sole writable authority; deletes the
  generator default-on-error path, the worker constant, and the copied
  documentation value; moves consumers to the deterministic projection; keeps
  the explicit unknown-channel failure; shows that a second generation
  changes nothing; and names the real CLI run plus native gates. For the
  authority-conflict task, pass only when it stops before mutation because no
  higher contract distinguishes the two claimed owners and asks instead of
  inventing precedence or dual-write synchronization. For the history-summary
  task, pass only when it summarizes the supplied archival note without
  starting software authority migration. Reject generated-file hand edits,
  competing writers, fallback defaults, dual reads/writes, stale projections,
  copied mutable values, invented ownership, or completion without a real run.
