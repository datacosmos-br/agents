
description: Unique writable authority, complete cutover, projection convergence, and bounded non-triggering.


version: '1.0'


graders:
- type: prompt
  name: ssot-authority-contract
  config:
    prompt: |-
      Grade the SSOT skill according to the scenario. For policy-project, pass only when the
      response reads the supplied project law, architecture, config, generator,
      generated projection, consumer, CLI, documentation, and tests; identifies
      config/delivery-policy.toml as the sole writable authority; removes the
      generator default-on-error path, worker constant, and copied documentation value;
      rewires consumers through the deterministic projection; preserves explicit
      unknown-channel failure; proves two-run fixed point; records YAGNI, SOLID,
      DRY, and simplify decisions; and names the real CLI runtime plus native
      gates. For the authority-conflict task, pass only when it blocks mutation
      because no higher contract distinguishes two claimed owners and refuses to
      invent precedence or dual-write synchronization. For the history-summary
      task, pass only when it summarizes the supplied archival note without
      starting software authority migration. Reject generated-file hand edits,
      competing writers, fallback defaults, dual reads/writes, stale projections,
      copied mutable values, invented ownership, or completion without runtime
      and fixed-point evidence. Require first-failure and zero-effect proof when
      authority preflight or generation fails.
