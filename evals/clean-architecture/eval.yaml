name: clean-architecture-eval
description: Profile-aware inward dependency enforcement without ceremonial layers.
skill: clean-architecture
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories: [../../skills/domain/clean-architecture]
  required_skills: [clean-architecture]
graders:
- type: prompt
  name: clean-architecture-contract
  config:
    prompt: Grade clean-architecture. Pass only when internal code points dependencies inward through typed ports and one composition root, missing evidence fails before effects, and a third-party fork is left to upstream without local architectural modernization.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks: [tasks/*.yaml]
