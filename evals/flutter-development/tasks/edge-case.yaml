id: dart-or-flutter-001
name: Distinguish Dart from Flutter
description: Do not assume a UI framework from an unavailable package manifest.
tags: [flutter, edge-case]
inputs:
  prompt: Add navigation to an unspecified package. No pubspec, SDK constraints, platform target, or source is supplied. Explain why Dart versus Flutter must be established first.
expected:
  output_contains: [pubspec, Flutter]
  output_not_contains: [Navigator.push]
