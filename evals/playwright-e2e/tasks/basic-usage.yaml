id: playwright-e2e-happy-path-001
name: Design stable search-flow coverage
description: Implement a page object and two observable search scenarios.
tags: [e2e, playwright, page-object, testing, ci, browser, happy-path]
inputs:
  prompt: |
    Apply E2E testing and Playwright patterns to the supplied UI contract,
    including a page object model, configuration, and CI/CD integration. Write tests
    for a successful search and a no-results search. Use the declared selectors
    and API response, avoid arbitrary sleeps, assert visible user outcomes, and
    capture a screenshot for the successful result.
  files:
  - path: search-ui-contract.md
expected:
  outcomes:
  - type: task_completed
  output_contains:
  - '[data-testid="search-input"]'
  - waitForResponse
  - toContainText
  - no-results
  - screenshot
  output_not_contains:
  - waitForTimeout
