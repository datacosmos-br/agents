
description: Semantic evaluation suite for playwright-e2e.


version: '1.0'


graders:
- type: prompt
  name: playwright-e2e-contract
  config:
    prompt: |-
      Grade the playwright-e2e response. Pass only if it preflights the declared
      environment, derives selectors and network behavior from the fixture,
      builds the smallest project-native Playwright tests, waits on exact
      observable conditions, asserts both result and empty states, and validates
      the requested screenshot before publication. Reject invented base URLs,
      page objects/config/CI not required by the fixture, sleeps, skips, retries,
      catches, fallback, production effects, or partial artifacts.
