name: playwright-e2e-eval
description: Semantic evaluation suite for playwright-e2e.
skill: playwright-e2e
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/playwright-e2e
  required_skills:
  - playwright-e2e
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the Playwright design prove observable user behavior reliably?
graders:
- type: prompt
  name: playwright-e2e-contract
  config:
    prompt: |
      Grade the playwright-e2e response. Pass only if it derives selectors and
      network behavior from the fixture, builds a maintainable Playwright test
      and page object, waits on observable conditions rather than sleeps,
      asserts both result and empty states, records useful artifacts, and does
      not conceal flakiness with skips or production-side effects.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
