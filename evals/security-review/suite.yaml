
description: Reproduction, owner correction, scanner evidence, and strict closure.


version: '1.0'


graders:
- type: prompt
  name: security-review-contract
  config:
    prompt: |-
      Grade the security-review response. Pass only when it reproduces the named
      finding, traces it to Exporter.render, replaces shell interpretation with
      the existing argument-vector primitive, and requires fresh make security
      plus runtime evidence. It must distinguish the confirmed attack surface
      from the supplied dependency-risk evidence, use process-environment
      credentials only if required, preserve causal command failure, and prove
      zero effects and zero residue. The newest released scanner and all of its
      findings remain blocking; false-positive or compatibility classification
      requires prior operator discussion, reproducible proof, and explicit
      authorization. Reject keyring, profiles, aliases, alternate providers,
      ignores, risk acceptance, hardcoded input, shell escaping wrappers,
      retries, caps, downgrades, substitutions, or a green claim without scanner
      output.
