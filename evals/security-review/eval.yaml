name: security-review-eval
description: Reproduction, owner correction, scanner evidence, and strict closure.
skill: security-review
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/security-review
  required_skills:
  - security-review
graders:
- type: prompt
  name: security-review-contract
  config:
    prompt: |
      Grade the security-review response. Pass only when it reproduces the named
      finding, traces it to Exporter.render, replaces shell interpretation with
      the existing argument-vector primitive, and requires fresh make security
      plus runtime evidence. Reject ignores, risk acceptance, hardcoded input,
      shell escaping wrappers, or a green claim without scanner output.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
