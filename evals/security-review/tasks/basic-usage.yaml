id: security-review-shell-001
name: Triage a command-injection finding
description: Correct a security finding at its attack-surface owner and assess dependency risk.
tags: [security-findings, attack-surfaces, dependency-risk, scanner, remediation, happy-path]
inputs:
  prompt: Review scanner-finding.md, distinguish its confirmed command-injection attack surface from the clean dependency-risk result, and provide the owner-level correction plus causal runtime, zero-effect, and zero-residue closure evidence. Do not suppress the rule or use keyring.
  files:
  - path: scanner-finding.md
expected:
  output_contains: [Exporter.render, argument vector, dependency, make security, zero effects]
