id: go-development-owner-missing-001
name: Refuse to invent a Go module contract
description: Require module, API, and native-gate evidence before implementation.
tags: [go, module, fail-closed]
inputs:
  prompt: Modernize an unavailable Go service now. No go.mod, go.work, Go version, source, public API, generated-file owner, or project validation commands are supplied. State what blocks a safe change.
expected:
  output_contains: [go.mod, public API]
  output_not_contains: [module example.com, change completed]
