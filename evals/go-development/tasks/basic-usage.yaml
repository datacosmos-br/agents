id: go-development-worker-lifecycle-001
name: Review a cancellable Go worker
description: Diagnose goroutine ownership and error propagation in a declared module.
tags: [go, development, testing, concurrency, errors, modules, happy-path]
inputs:
  prompt: Exercise Go development by building, reviewing, testing, and simplifying this detected module. Read go.mod, note that no go.work is present, preserve worker.go's public API, identify its lifecycle and error defects, and specify race-detector evidence.
  files:
  - path: go.mod
  - path: worker.go
expected:
  output_contains: [context.Context, errors.Is, go test -race]
