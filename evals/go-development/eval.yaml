name: go-development-eval
description: Go cancellation, error, race, ownership, and native-gate decisions.
skill: go-development
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/technology/go-development
  required_skills:
  - go-development
graders:
- type: prompt
  name: go-development-contract
  config:
    prompt: |
      Grade the go-development response. Pass only when it cites the supplied Go
      module and worker code, identifies the detached goroutine and discarded
      error, proposes explicit context ownership and wrapped errors that preserve
      errors.Is/errors.As, and names project-native format, vet, race, test, and
      build evidence. Reject generic Go advice or an invented module/toolchain.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
