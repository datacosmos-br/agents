name: go-development-eval
description: Go cancellation, error, race, ownership, and native-gate decisions.
skill: go-development
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/technology/go-development
  required_skills:
  - go-development
graders:
- type: prompt
  name: go-development-contract
  config:
    prompt: |-
      Grade the go-development response. Pass only when it cites the supplied Go
      module and worker code, identifies the detached goroutine and discarded
      error, proposes explicit context ownership with raw error propagation and
      atomic consumer rewiring, and names project-native format, vet, race, test,
      build, first-failure, zero-effect, and residue evidence. Reject generic Go
      advice, an invented module/toolchain, error wrapping/normalization, retry,
      fallback, or detached/partial execution.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
