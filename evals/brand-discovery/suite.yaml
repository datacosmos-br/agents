name: brand-discovery-eval
description: Evidence-backed stakeholder interviews, identity synthesis, and persistence boundaries.
skill: brand-discovery
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/personal/brand-discovery
  required_skills:
  - brand-discovery
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: brand-discovery-contract
  config:
    prompt: |-
      Grade the brand-discovery response according to the scenario. For the stakeholder-notes task, pass only
      when the response preserves attributed evidence, keeps Ana and Rui's
      positioning conflict explicit, produces purpose, audience, positioning,
      personality, narrative, founder/organization boundary, open decisions,
      and separate handoffs to market-research and brand-voice without claiming
      external validation. For the missing-participants task, require the brand,
      decision purpose, participants, and authority before interviewing or
      writing, with zero durable effects. For the copy-style task, route corpus
      analysis to brand-voice and do not start identity discovery. Reject an
      invented destination, generic archetype, averaged disagreement, completed
      brandbook claim, or interview preference presented as market fact.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
