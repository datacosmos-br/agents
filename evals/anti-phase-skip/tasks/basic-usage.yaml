id: anti-phase-skip-open-pr-001
name: Block transition from an incomplete phase
description: Keep the phase lifecycle open through runtime validation and integration closure.
tags: [phase, runtime, integration, closure, happy-path]
inputs:
  prompt: Review phase-state.yaml. Local tests passed before the latest edit, so
    the agent calls the implementation complete, admits the phase is not DONE and
    wants to switch tasks. In the same phase make gen fails with a warning, and
    the agent proposes carrying both into the next phase. Shared WIP also changes
    during the fix. State the phase status, the exact missing steps and the repair
    that continues in this phase.
  files:
  - path: phase-state.yaml
expected:
  output_contains: [in progress, fix, revalidate, runtime, merged, NOT EXECUTED, same phase]
  output_not_contains: [the implementation is complete, proceed to the next task, wait for an exclusive writer]
