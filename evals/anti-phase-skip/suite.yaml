description: A phase stays open until the law's landing cycle holds with fresh evidence.
prompt: |-
  Grade the anti-phase-skip response. Pass only when it keeps the phase open
  until rules/law.md item 10 holds with fresh evidence: real runtime, native
  gates, a reviewed and merged PR, post-merge runtime, zero residue and
  tracker closure. A red gate or warning found in the phase is fixed and
  revalidated in the same phase, never carried into the next one, and
  compatible moving WIP is integrated forward without an exclusive writer or
  a clean checkout. An external-token gate excluded before invocation is NOT
  EXECUTED, never green. Anything less is reported as in progress with the
  exact missing step. Reject a completion claim beside an open phase, task
  switching, deferred validation, warnings treated as passes, or
  report-and-abandon behavior. On an incomplete contract, require the first
  missing prerequisite and no phase transition.
