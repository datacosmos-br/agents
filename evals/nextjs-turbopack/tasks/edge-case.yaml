id: nextjs-turbopack-version-unknown-001
name: Refuse an unverified bundler flag
description: Require release and plugin evidence before selecting a fallback flag.
tags: [nextjs, bundler, fail-closed]
inputs:
  prompt: Fix an unavailable Next.js app by choosing a Turbopack-disable flag from memory. The Next.js version, package manifest, lockfile, scripts, plugins, config, error, and official release documentation are unavailable.
expected:
  output_contains: [version, official documentation]
  output_not_contains: [flag confirmed, webpack fallback applied]
