id: nextjs-turbopack-dev-script-001
name: Diagnose an explicit webpack dev script
description: Use pinned Next.js evidence to restore and measure the default dev path.
tags: [next.js, turbopack, bundling, caching, development, performance, happy-path]
inputs:
  prompt: Review this Next.js 16+ development setup for Turbopack incremental bundling, filesystem caching, and dev speed. Explain the script-level cause in package.json, verify the release behavior, propose the smallest change, and measure cold start, HMR, cache reuse, and production build separately.
  files:
  - path: package.json
expected:
  output_contains: ['16.1.2', 'next dev', .next, HMR]
