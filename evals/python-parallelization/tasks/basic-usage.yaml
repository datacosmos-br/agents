id: python-parallelization-io-001
name: Bound a measured blocking-I/O workload
description: Select and prove a concurrency primitive from explicit workload evidence.
tags: [python, concurrency, asyncio, threads, processes, benchmarking, happy-path]
inputs:
  prompt: Review sample.py. Profiling shows client.get accounts for 85 percent of wall time across independent URLs. Explain the workload class, propose a bounded change that honors MAX_IN_FLIGHT and output ordering, and specify cancellation, cleanup, equivalence, and baseline measurements.
  files:
  - path: sample.py
expected:
  output_contains: [blocking, bounded, baseline]
