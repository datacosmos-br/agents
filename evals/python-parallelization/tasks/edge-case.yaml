id: python-parallelization-evidence-001
name: Refuse an unevidenced primitive
description: Require workload evidence before choosing asyncio, threads, processes, or vectorization.
tags: [python, parallelization, concurrency, asyncio, threads, processes, vectorization, benchmarking, edge-case]
inputs:
  prompt: Make an unavailable Python job parallel. No profile, benchmark baseline, input sizes, call graph, dependency safety, ordering contract, or resource limit is provided. State what evidence is required to classify the workload and choose among asyncio, bounded threads, processes, or library vectorization.
expected:
  output_contains: [workload, baseline]
  output_not_contains: [ProcessPoolExecutor, ThreadPoolExecutor]
