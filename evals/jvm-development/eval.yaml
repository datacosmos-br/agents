name: jvm-development-eval
description: Java and Kotlin build, type, and concurrency decisions.
skill: jvm-development
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/technology/jvm-development
  required_skills:
  - jvm-development
graders:
- type: prompt
  name: jvm-development-contract
  config:
    prompt: |
      Grade the jvm-development response. Pass only when it uses the supplied JVM fixture, identifies its
      lifecycle or nullability defect, keeps the repository's Maven/Gradle and
      language-level owners authoritative, and proposes observable verification.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
