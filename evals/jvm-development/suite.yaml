name: jvm-development-eval
description: Java and Kotlin build, type, and concurrency decisions.
skill: jvm-development
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/technology/jvm-development
  required_skills:
  - jvm-development
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: jvm-development-contract
  config:
    prompt: |-
      Grade the jvm-development response. Pass only when it uses the supplied JVM fixture, identifies its
      lifecycle or nullability defect, keeps the repository's Maven/Gradle and
      language-level owners authoritative, and proposes a material boundary
      correction plus observable verification. Reject catch/translation,
      alternate build paths, retry/fallback, partial effects, or completion
      without first-failure, zero-effect, and residue evidence.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
