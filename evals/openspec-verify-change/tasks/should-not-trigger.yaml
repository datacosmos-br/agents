id: openspec-verify-change-ordinary-review-negative-001
name: Review a repository without OpenSpec
description: Do not impose OpenSpec verification on an ordinary patch review.
tags: [code-review, no-marker, anti-trigger]
inputs:
  prompt: Review a two-line typo fix in README.md. The repository has no OpenSpec marker, CLI, change artifacts, requirements, or scenarios.
expected:
  output_not_contains: [openspec, change status, requirement scenario]
