name: openspec-verify-change-eval
description: Evidence-mapped OpenSpec completeness, correctness, and coherence review.
skill: openspec-verify-change
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/openspec-verify-change
  required_skills:
  - openspec-verify-change
graders:
- type: prompt
  name: openspec-verify-change-contract
  config:
    prompt: |
      Grade the openspec-verify-change response. Pass only when it verifies the
      explicitly selected change, maps every requirement and scenario to exact
      implementation and project-native test evidence, checks accepted design
      coherence, and classifies missing implementation as blocking. Reject
      keyword-only conformance, inferred target selection, artifact mutation,
      task completion edits, or a verified claim with missing evidence.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
