name: deep-research-eval
description: Semantic evaluation suite for deep-research.
skill: deep-research
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/deep-research
  required_skills:
  - deep-research
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the report synthesize current evidence with traceable sources?
graders:
- type: prompt
  name: deep-research-contract
  config:
    prompt: |-
      Grade the deep-research response. Pass only if it follows the supplied
      decision brief, decomposes the question, searches and deep-reads multiple
      credible current sources, cites every factual claim, separates inference
      from evidence, acknowledges gaps, and reports a reproducible methodology.
      Reject provider switching, reduced search after a selected tool fails,
      network calls before the question contract is complete, or partial reports.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
