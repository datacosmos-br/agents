id: deep-research-happy-path-001
name: Research a current regulatory decision
description: Produce a cited decision report from a bounded research brief.
tags: [research, synthesis, sources, web, citations, evidence, happy-path]
inputs:
  prompt: |
    Perform deep, multi-source web research on the supplied brief using
    Firecrawl and Exa MCP searches, then synthesize the findings. Use current primary
    or authoritative sources, deep-read the decisive sources, distinguish
    sourced facts from inference, and return a decision-oriented report with
    executive summary, gaps, source list, and methodology.
  files:
  - path: regulatory-brief.md
expected:
  output_contains:
  - Executive Summary
  - Key Takeaways
  - Sources
  - Methodology
  - Confidence
