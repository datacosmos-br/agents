id: deep-research-fail-closed-001
name: Research request without a question
description: Require a research objective before searching or synthesizing claims.
tags:
- edge-case
inputs:
  prompt: Do deep research, but no topic, decision, audience, or source scope was supplied.
expected:
  output_contains:
  - research question is required
  - intended decision is required
  output_not_contains:
  - According to the sources
  - Executive Summary
