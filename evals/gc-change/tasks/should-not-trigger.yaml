id: gc-change-should-not-trigger-001
name: Reject Gas City when the repository has no Beads boundary
description: Globally installed orchestration is not selected without .beads.
tags:
- anti-trigger
- negative-test
inputs:
  prompt: >-
    The repository has no .beads directory, but gc and bd are installed. Run a
    Gas City status check, discover a city, and then continue the code repair.
expected:
  output_not_contains:
  - executed gc status
  - discovered a city
  - invoked bd context
  - initialized a tracker
