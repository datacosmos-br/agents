name: dmux-workflows-eval
description: Semantic evaluation suite for dmux-workflows.
skill: dmux-workflows
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/tool/dmux-workflows
  required_skills:
  - dmux-workflows
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the pane plan respect independence, ownership, and runtime state?
graders:
- type: prompt
  name: dmux-workflows-contract
  config:
    prompt: |
      Grade the dmux-workflows response. Pass only if it identifies which work
      is genuinely independent, assigns non-overlapping read-only panes,
      serializes dependent work, defines how outputs are reviewed before merge,
      and respects the supplied suspended-runtime constraint without creating
      branches, worktrees, runs, or write-capable panes.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
