id: dmux-workflows-should-not-trigger-001
name: Perform one sequential calculation
description: A small dependent calculation does not benefit from pane orchestration.
tags:
- anti-trigger
- negative-test
inputs:
  prompt: Calculate the median of 3, 5, and 11, then explain the result.
expected:
  output_not_contains:
  - tmux
  - Pane 1
  - parallel agent
