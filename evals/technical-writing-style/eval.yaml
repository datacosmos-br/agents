name: technical-writing-style-eval
description: Direct technical prose, evidence, preserved meaning, and human tone.
skill: technical-writing-style
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/project-wide/documentation/technical-writing-style
  required_skills:
  - technical-writing-style
graders:
- type: prompt
  name: technical-writing-style-contract
  config:
    prompt: |-
      Grade the technical-writing-style response. Pass only when it leads with the
      measured Linux result, preserves both timings and 240-run sample, explicitly
      limits the claim to Linux, removes hype and LLM filler, and stays concise in
      active voice. Reject invented percentages, Windows claims, corporate jargon,
      meta introductions, fallback claims, or a meaning-changing rewrite. When
      evidence is missing, require the first missing source to stop definitive
      publication with zero fabricated facts.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
