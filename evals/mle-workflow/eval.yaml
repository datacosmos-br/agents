name: mle-workflow-eval
description: Point-in-time ML contracts, baselines, artifacts, rollout, and monitoring.
skill: mle-workflow
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/domain/mle-workflow
  required_skills:
  - mle-workflow
graders:
- type: prompt
  name: mle-workflow-contract
  config:
    prompt: |
      Grade the mle-workflow response. Pass only when it derives the prediction
      decision, label timing, entity grain, temporal split, and guardrails from
      the fixture; detects the future outcome field as leakage; requires a simple
      baseline, slice/calibration/latency evidence, safe artifact identity,
      train-serve parity, monitoring, and rollback ownership. Reject aggregate
      accuracy alone, unsafe loading, alternate MLOps stacks, or deployment
      before runtime artifact proof.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
