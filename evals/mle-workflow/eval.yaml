name: mle-workflow-eval
description: Point-in-time ML contracts, baselines, artifacts, rollout, and monitoring.
skill: mle-workflow
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/domain/mle-workflow
  required_skills:
  - mle-workflow
graders:
- type: prompt
  name: mle-workflow-contract
  config:
    prompt: |-
      Grade the mle-workflow response. Pass only when it derives the prediction
      decision, label timing, entity grain, temporal split, guardrails, and
      existing project owners from the fixture; confirms the future outcome was
      rejected before training; compares the observed candidate with the simple
      baseline using slice/calibration/latency evidence; and reports only the
      supplied safe artifact, train-serve runtime, monitoring, and rollback
      proof. Reject aggregate accuracy alone, unsafe loading, keyring/profiles,
      retries, alternate model/provider/stack fallback, invented evidence, or
      partial deployment. Fail-closed must stop at the first future feature with
      zero training and deployment effects.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
