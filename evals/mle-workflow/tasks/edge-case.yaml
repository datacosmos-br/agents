id: mle-workflow-deployment-evidence-missing-001
name: Block an unproven model deployment
description: Require label, snapshot, artifact, and rollback contracts before production.
tags: [mle, deployment, fail-closed]
inputs:
  prompt: Deploy an unspecified model because its reported accuracy is 99 percent. Label timing, data snapshot, baseline, protected slices, calibration, latency, artifact schema, safe loader, runtime inference, monitoring, and rollback owner are all unavailable.
expected:
  output_contains: [label timing, rollback]
  output_not_contains: [deployment approved, production rollout complete]
