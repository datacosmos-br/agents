id: mle-workflow-deterministic-etl-negative-001
name: Optimize a deterministic ETL job
description: Do not introduce ML workflow for a rules-only batch transform.
tags: [etl, deterministic, anti-trigger]
inputs:
  prompt: Reduce memory use in a deterministic CSV-to-Parquet conversion job. The repository has no model, training data, feature pipeline, inference, or ML marker.
expected:
  output_not_contains: [model training, calibration, concept drift, fallback]
