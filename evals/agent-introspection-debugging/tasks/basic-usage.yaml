id: agent-introspection-debugging-happy-001
name: Diagnose a repeated wrong-directory search
description: Turn a concrete retry loop into one falsifiable check and contained recovery.
tags: [agent, introspection, debugging, failures, diagnosis, recovery, happy-path]
inputs:
  prompt: >-
    Analyze retry-loop.log. Produce a Failure Capture, identify the most likely
    state mismatch, choose one cheap command that discriminates the hypothesis,
    and give the contained recovery and Agent Self-Debug Report. Do not retry the
    failed search until the check supports it.
  files:
  - path: retry-loop.log
expected:
  output_contains: [wrong working directory, pwd, Agent Self-Debug Report]
