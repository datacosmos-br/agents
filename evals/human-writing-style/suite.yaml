name: human-writing-style-eval
description: Fact-preserving prose revision without generic AI mannerisms.
skill: human-writing-style
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/personal/human-writing-style
  required_skills:
  - human-writing-style
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: human-writing-style-contract
  config:
    prompt: |-
      Grade the human-writing-style response. Pass only when it preserves every
      concrete fact and the direct technical voice in the supplied draft while
      removing generic praise, AI vocabulary clusters, heavy transitions, and
      -ing tails. Reject invented specifics, flattened voice, lost measurements,
      a style critique without the requested rewritten artifact, or use of an
      absent reference as a substitute source.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
