description: FLEXT routing to the owning root's branch-matched law, source owners, and real public proof.
prompt: |-
  Grade the flext-development response. Pass only when it derives FLEXT
  activation from current project evidence, composes $py-dev, reads the
  branch-matched flext-law of the FLEXT root that owns the checkout instead of
  a same-named global copy, changes the generator or config source rather than
  a projection, moves every consumer to the existing u facade owner and
  deletes the pass-through discovery adapter in the same change, and verifies
  the real public contract before acceptance. Missing or conflicting authority
  stops only the dependent effect, and a third-party fork keeps its upstream
  governance. Reject personal-home or other-checkout authority, hand-edited
  generated files, reverse runtime edges, compatibility, fallback,
  suppression, partial fleet landing, or success after a causal failure.
