
description: Structural deduplication, god-pattern removal, efficiency evidence, and readable compactness.


version: '1.0'


graders:
- type: prompt
  name: dry-contract
  config:
    prompt: |-
      Grade according to the scenario. For the order-project task, pass only when
      the response reads the supplied project rules, architecture, source, and
      tests; preserves every public behavior; reuses OrderId, OrderRepository,
      CsvOrderExporter, and AuditSink; keeps a thin orchestrator; removes the
      superseded logic; treats a graph no-callers result as a candidate; discovers
      CsvOrderExporter in the string plugin registry and therefore preserves it;
      passes the result through YAGNI and SOLID rechecks; applies
      simplify inline; compares Tokei on the same scope; and names runtime plus
      native gates. For detector-driven candidates, require the exact baseline
      configuration and proof of zero new clones rather than textual similarity
      alone. For the missing-baseline task, pass
      only when it blocks compression and names the missing owners, callers,
      behavior, runtime, and measurement without proposing deletions. For the
      dry-season task, pass only when it returns a concise factual geography
      summary without starting software analysis. In every role reject code golf,
      arbitrary line targets, speculative abstractions, god utilities, changed
      error semantics, retry/fallback, partial rewiring, or false completion.
      Require the first causal failure, zero effects, atomic owner convergence,
      and zero residue on activated paths.
