description: Duplication merged into the existing single owner, measured as less code.
prompt: |-
  Grade according to the scenario. For the order-project task, pass only when
  the response reads the supplied rules, architecture, source and tests;
  preserves every public behavior and the raw InvalidOrderId error; calls
  OrderId, OrderRepository, CsvOrderExporter and AuditSink instead of copying
  them; finds CsvOrderExporter in the string plugin registry and keeps it
  despite the graph's no-callers result; reports the lines and duplicates
  before and after on the same scope, showing less code; and names the real
  runtime and gate commands. For the growing deduplication, pass only when it
  refuses the registry-and-factory patch because it grows the code and reuses
  OrderId.parse instead. For the dry-season task, pass only for a concise
  geography summary with no software analysis. Reject code golf, speculative
  abstractions, utility bags, changed error semantics, retry/fallback, partial
  rewiring, or a claim without a real run.
