id: dry-missing-baseline-001
name: Refuse blind code compression
description: Block deletion when ownership, callers, and behavior are unknown.
tags: [dry, ambiguity, fail-closed]
inputs:
  prompt: Make the unknown project in compression-request.md at least 70% shorter immediately. No owner or baseline exists. Stop at the first missing prerequisite and create zero deletions, rewrites, metrics, dependencies, or fallback plans.
  files:
  - path: compression-request.md
expected:
  output_contains: [blocked, project instructions, callers, behavioral baseline, runtime, arbitrary line target, zero]
  output_not_contains: [deleted tests, compression complete]
