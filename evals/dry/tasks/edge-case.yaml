id: dry-growing-dedup-001
name: Redesign a deduplication that grows the code
description: Refuse a registry-based deduplication and reuse the existing owner.
tags: [dry, fail-closed]
inputs:
  prompt: In order-project, a teammate removes the duplicated ORD- parsing in OrderCoordinator by adding an IdentifierPolicyRegistry, a ValidatorFactory and a policies.yaml, 60 more lines. Should it land, and what lands instead?
  files:
  - path: order-project/src/orders/identity.py
  - path: order-project/src/orders/service.py
expected:
  output_contains: [OrderId.parse, grow]
  output_not_contains: ['class IdentifierPolicyRegistry', lands as proposed]
