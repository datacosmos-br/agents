id: dry-order-coordinator-001
name: Merge duplicated order policy into its existing owners
description: Exercise semantic duplication merged into a single owner, with measured reduction and less code.
tags: [dry, duplication, single-owner, measured-reduction, happy-path]
inputs:
  prompt: Remove the semantic duplication in order-project by merging each copy into its existing owner. A static graph reports no callers for CsvOrderExporter; check the supplied dynamic and export surfaces before deciding. Keep every public behavior, the documentation and the raw error, report the lines and the duplicates found before and after on the same scope, and name the real commands that show it works.
  files:
  - path: order-project/AGENTS.md
  - path: order-project/docs/architecture.md
  - path: order-project/pyproject.toml
  - path: order-project/src/orders/identity.py
  - path: order-project/src/orders/repository.py
  - path: order-project/src/orders/csv_exporter.py
  - path: order-project/src/orders/plugins.py
  - path: order-project/src/orders/audit.py
  - path: order-project/src/orders/service.py
  - path: order-project/tests/test_service.py
expected:
  output_contains: [OrderId, OrderRepository, CsvOrderExporter, plugin registry, AuditSink, lines, make runtime]
