id: agent-browser-negative-001
name: Review static form accessibility
description: Keep interactive automation out of a source-only HTML review.
tags: [agent-browser, anti-trigger]
inputs:
  prompt: >-
    Review the supplied HTML source for missing labels and accessible names. Do
    not open a browser or interact with the page.
  files:
  - path: profile-form.html
expected:
  output_not_contains: [agent-browser open, agent-browser click, screenshot, fallback]
