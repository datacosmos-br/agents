id: agent-browser-happy-001
name: Complete a dynamic profile form
description: Use snapshot refs through submission and capture the rendered result.
tags: [browser, automation, forms, screenshots, web, testing, happy-path]
inputs:
  prompt: >-
    Open profile-form.html with agent-browser, take an interactive snapshot, fill
    the name with Ada, select Pro, accept the terms, and submit. Re-snapshot after
    submission, report the exact rendered confirmation, and save screenshot evidence.
  files:
  - path: profile-form.html
expected:
  output_contains: ['profile-saved:Ada:pro', snapshot, screenshot]
