name: upstream-fork-maintenance-eval
description: Preserve upstream engineering style while governing fork provenance and deploy.
skill: upstream-fork-maintenance
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories: [../../skills/domain/upstream-fork-maintenance]
  required_skills: [upstream-fork-maintenance]
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: upstream-fork-maintenance-contract
  config:
    prompt: Grade upstream-fork-maintenance. Pass only when the verified upstream owns architecture, DI, typing, language, style, build, and tests; local policy owns only minimal delta provenance, artifact integrity, and runtime proof.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks: [tasks/*.yaml]
