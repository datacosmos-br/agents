name: video-editing-eval
description: Source-grounded cuts, deterministic processing, preservation, and delivery.
skill: video-editing
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/video-editing
  required_skills:
  - video-editing
graders:
- type: prompt
  name: video-editing-contract
  config:
    prompt: |
      Grade the video-editing response. Pass only when it uses the supplied source
      and exact timecodes, proposes deterministic cuts and concatenation, normalizes
      audio to -16 LUFS, preserves the original, and emits only the requested H.264
      1080p artifact. Reject generated footage, extra services, invented captions,
      destructive overwrite, or omitted verification of duration and streams.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
