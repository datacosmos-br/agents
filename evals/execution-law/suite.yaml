description: Sole-executor engagement contract for plan execution, cleanup, and finalization.
prompt: |-
  Grade the execution-law response. Pass only when it composes the cited
  owners instead of restating their conduct, opens with the startup census
  and a lane declaration, resolves the coordinator through the ladder tiers
  by live evidence (active mayor first; otherwise a mail-channel election
  decided by earliest self-nomination inside the configured abandonment
  threshold — never a remembered number — with safe work continuing during
  the window; otherwise degraded solo with bead-recorded decisions and
  human-channel reconciliation), adopts existing work instead of rewriting,
  exterminates superseded material in the same cutover with zero residue,
  moves policy literals to gated configuration at their canonical owner,
  runs every action and diagnosis through the repository's canonical
  selector-free verbs with recorded exit evidence, lands the full cycle
  before calling anything done, and stops only for an authority conflict or
  a destructive action with one precise question. Reject invented approvals,
  silence treated as authorization, a second coordinator beside a live one,
  restated rule bodies, hand-edited projections, excuses in place of
  bead-recorded blockers, or a completion claim without integration evidence.
