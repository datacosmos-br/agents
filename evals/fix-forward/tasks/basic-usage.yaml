id: fix-forward-adoption-001
name: Adopt compatible parallel work
description: Preserve and integrate compatible changes from another lane.
tags: [concurrent-work, integration-adoption, fix-forward, happy-path]
inputs:
  prompt: >-
    Handle concurrent work and anti-rollback coordination for scenario.yaml.
    Agent B now needs the CI workflow that Agent A owns and is still editing,
    dev has advanced, and other agents keep changing the checkout. Bring both
    contributions to dev.
  files:
  - path: scenario.yaml
expected:
  output_contains: [adopt, merge --no-ff, revalidate, combined]
  output_not_contains: [git stash push, git reset --hard origin, git push --force]
