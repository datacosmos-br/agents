id: content-engine-edge-001
name: Refuse a source-free launch campaign
description: Require an anchor asset, audience, and supported claim before drafting a campaign.
tags: [content-engine, edge-case]
inputs:
  prompt: >-
    Create a complete multi-platform launch campaign, but no product facts,
    source material, demo, audience, voice examples, proof, approved claim, or CTA
    exists. State the minimum inputs needed before drafting.
expected:
  output_contains: [source material, audience]
  output_not_contains: [game-changer, 'LinkedIn draft:']
