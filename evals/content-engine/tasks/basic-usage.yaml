id: content-engine-happy-001
name: Repurpose a deployment demo by platform
description: Produce distinct source-backed X, LinkedIn, and short-video drafts.
tags: [content, social, distribution, repurposing, linkedin, newsletters, happy-path]
inputs:
  prompt: >-
    Use deploy-demo-transcript.md as the only source. Create one X post, one
    LinkedIn post, and a 30-second video script for platform engineers. Give each
    output one concrete claim, adapt the format to its platform, surface visible
    proof early, and do not invent adoption, reliability, speed, or cost results.
  files:
  - path: deploy-demo-transcript.md
expected:
  output_contains: [eight commands, two commands, 'sha256:b44', 8f2c11a]
