name: content-engine-eval
description: Source-first platform-native content repurposing.
skill: content-engine
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/personal/content-engine
  required_skills:
  - content-engine
graders:
- type: prompt
  name: content-engine-contract
  config:
    prompt: |-
      Grade the content-engine response. Pass only when every platform draft is grounded in the supplied demo,
      carries one concrete claim, adapts structure rather than persona, and uses
      the eight-to-two workflow plus visible proof accurately without duplicating
      copy. Reject hype, engagement bait, invented metrics, generic formulas,
      reduced campaigns after missing preflight input, or generic-voice fallback.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
