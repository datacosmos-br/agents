id: simplify-diagnosis-negative-001
name: Diagnose before changing behavior
description: Keep inline simplification out of an unproven behavior defect.
tags: [anti-trigger, diagnosis, negative-test]
inputs:
  prompt: Explain what runtime evidence is needed to diagnose why checkout charges tax twice. Do not activate simplification, fall back to a code rewrite, or generate code before the defect and intended tax behavior are established.
expected:
  output_contains: [tax, runtime evidence]
  output_not_contains: [simplification complete, behavior-preserving cleanup, "def calculate_tax", fallback rewrite]
