id: simplify-growing-diff-001
name: Redesign a fix that grows the code
description: Refuse a patch that adds layers and land the shortest change that removes the cause.
tags: [simplify, inline, diff-size, fail-closed]
inputs:
  prompt: format_status('   ') returns "enabled:" instead of "enabled:unknown". The proposed fix adds a CodeNormalizer class, a normalize_code helper, a STRICT_NORMALIZATION flag and a fallback branch, growing status_formatter.py from 9 to 38 lines. Decide whether it lands and give the change that should land instead.
expected:
  output_contains: [grow, strip]
  output_not_contains: ['class CodeNormalizer:', 'def normalize_code(', lands as proposed]
