name: simplify-eval
description: Inline complete-code generation, fail-closed evidence, and bounded non-triggering.
skill: simplify
schema_version: 1
version: '2.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/project-wide/refactoring/simplify
  required_skills:
  - simplify
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: simplify-inline-contract
  config:
    prompt: |-
      Grade according to the task's role. For the happy-path contract, pass only
      when the response supplies a complete implementation of both typed public
      functions, covers every declared output, applies YAGNI to add no unsupported
      behavior, finds no new SOLID boundary, simplifies each generated unit in the
      same pass, declares each canonical typed default once, omits equal values
      from the supplied function call, preserves explicit overrides,
      avoids unnecessary helpers and code golf, and names a real behavioral check.
      For the missing-evidence task, pass an explicit refusal
      that identifies ownership, contract, consumer or runtime evidence needed;
      do not require code or a completion claim. For the diagnosis anti-trigger,
      pass a useful runtime-evidence plan that does not generate, change, or
      simplify code before behavior is established. Reject empty or nonresponsive
      output, partial behavior, placeholders, weakened tests, hidden failures,
      retry/fallback, broad rewrites, recursive skill loops, or false completion.
      Missing preflight must leave zero code effects and activated execution must
      preserve the first causal failure and zero residue.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
