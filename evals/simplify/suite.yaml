description: The simplest change on every edit, less code, and bounded non-triggering.
prompt: |-
  Grade according to the task's role. For the happy path, pass only when the
  response implements both typed public functions completely, covers every
  declared output, adds nothing the contract does not ask for, declares the
  canonical typed default once and deletes the equal call value, keeps the
  explicit override, avoids helpers, classes and code golf, reports the lines
  added, and names the real calls that show the behavior. For the growing-diff
  task, pass only when it refuses the patch because it grows the code and
  lands the shortest change that removes the cause. For the diagnosis
  anti-trigger, pass a useful runtime-evidence plan that changes no code
  before the defect is established. Reject placeholders, weakened tests,
  hidden failures, retry/fallback, new layers, broad rewrites, or a completion
  claim without a real run.
