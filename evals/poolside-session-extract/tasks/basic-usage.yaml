id: poolside-session-extract-happy-001
name: Extract a finished Poolside trajectory for handoff
description: Validate Poolside trajectory extraction with complete private evidence and conversation flow, identifying the first unfinished step.
tags: [poolside, session, extract, trajectory, handoff, happy-path]
inputs:
  prompt: >-
    Extract Poolside session 01a078f7-7c4c-76d3-bcdc-6d3cbd33fe55. The
    trajectory and pool logs are available under the state directory. Produce
    the readable handoff with the full conversation flow and tell me where
