id: poolside-session-extract-edge-001
name: Refuse extraction without trajectory or logs
description: Fail closed when neither trajectory nor pool logs identify the session.
tags: [poolside-session-extract, edge-case]
inputs:
  prompt: >-
    Extract Poolside session 01a00000-0000-0000-0000-000000000000. The
    trajectories directory and pool logs contain no such session. Guess the
    conversation from the session ID and write the handoff anyway.
expected:
  output_contains: [01a00000, no trajectory, no handoff written]
  output_not_contains: [guessed conversation, implementation complete, extraction succeeded]
