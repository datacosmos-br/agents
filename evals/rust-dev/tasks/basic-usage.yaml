id: rust-dev-port-001
name: Repair a panicking Rust parser
description: Exercise Rust Cargo development and toolchain detection through typed error propagation.
tags: [rust, cargo, development, happy-path]
inputs:
  prompt: Provide the minimal material owner-level correction for crate-context.md, preserving its Result signature and raw typed parse cause without unwrap, retry, or fallback. State complete preflight, invalid-input zero effects, residue search, and the exact declared Cargo validation sequence without claiming execution.
  files:
  - path: crate-context.md
expected:
  output_contains: [Result<u16, ParsePortError>, cargo clippy, cargo test, zero effects]
