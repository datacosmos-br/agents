id: documentation-criteria-fail-closed-001
name: Unknown change scale and contract impact
description: Request classification inputs before choosing document types.
tags:
- edge-case
inputs:
  prompt: Document this change, but no feature type, touched-file estimate, contract impact, data flow, dependency, or UI scope is known.
expected:
  output_contains:
  - change scope is required
  - file impact is required
  output_not_contains:
  - docs/adr/
  - ADR is mandatory
