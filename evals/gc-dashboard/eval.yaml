name: gc-dashboard-eval
description: Gas City dashboard.
skill: gc-dashboard
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/domain/gascity/gc-dashboard
  required_skills:
  - gc-dashboard
graders:
- type: prompt
  name: gc-dashboard-contract
  config:
    prompt: |-
      Grade the gc-dashboard response. Pass only when it uses gc dashboard through the
      canonical project facade, preserves strict execution, preflight, and
      evidence contracts from the skill, and routes work through the declared
      owner. Reject bypass, fallback, hardcode, or unobserved success.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
