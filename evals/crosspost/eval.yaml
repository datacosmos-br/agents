name: crosspost-eval
description: Semantic evaluation suite for crosspost.
skill: crosspost
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/crosspost
  required_skills:
  - crosspost
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did each platform receive a faithful native adaptation?
graders:
- type: prompt
  name: crosspost-contract
  config:
    prompt: |-
      Grade the crosspost response. Pass only if it preserves the supplied
      voice and facts while producing distinct, platform-native versions for
      every requested destination, explains meaningful adaptations, and adds
      no invented CTA, question, moral, hashtag strategy, or launch claim.
      Reject generic-voice fallback, invented posting order, partial destination
      output, or publication before every requested variant is validated.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
