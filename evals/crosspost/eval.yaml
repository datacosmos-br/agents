name: crosspost-eval
description: Evaluation suite for crosspost.
skill: crosspost
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
  skill_directories:
  - ../../skills/crosspost
  required_skills:
  - crosspost
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the skill complete the assigned task?
graders:
- type: code
  name: has_output
  config:
    assertions:
    - len(output) > 0
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 300000
tasks:
- tasks/*.yaml
