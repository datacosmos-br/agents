id: crosspost-fail-closed-001
name: Missing source and destinations
description: Request the minimum publishing contract instead of fabricating copy.
tags:
- edge-case
inputs:
  prompt: Crosspost this everywhere, but no source text or destination platforms were provided.
expected:
