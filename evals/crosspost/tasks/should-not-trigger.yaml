id: crosspost-should-not-trigger-001
name: Edit an internal memo sentence
description: A private line edit is not multi-platform distribution.
tags:
- anti-trigger
- negative-test
inputs:
  prompt: Tighten this sentence for an internal incident memo without changing its meaning.
expected:
  output_not_contains:
  - 'LinkedIn:'
  - 'Bluesky:'
  - platform adaptation
