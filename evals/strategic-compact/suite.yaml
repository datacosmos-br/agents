name: strategic-compact-eval
description: Logical context boundaries, durable state, and safe continuation.
skill: strategic-compact
schema_version: 1
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  retry_attempts: 0
  fail_fast: true
  skill_directories:
  - ../../skills/agent-wide/planning/strategic-compact
  required_skills:
  - strategic-compact
metrics:
- name: behavior_quality
  weight: 1.0
  threshold: 1.0
  description: Did the response satisfy every declared semantic outcome?
graders:
- type: prompt
  name: strategic-compact-contract
  config:
    prompt: |-
      Grade the strategic-compact response. Pass only when it recommends compaction
      at a genuine phase boundary, identifies the durable contract that survives,
      lists what the next phase must reload, and confirms no operation or partial
      edit is in flight. Reject harness-specific paths, invented persistence, or
      compaction during implementation.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
