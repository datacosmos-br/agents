id: brand-voice-edge-001
name: Refuse a confident profile without samples
description: Require real source material before claiming a named person's voice.
tags: [brand-voice, edge-case]
inputs:
  prompt: >-
    Create a durable voice profile for a named founder, but no posts, essays,
    emails, transcripts, or site copy are available. State the minimum source set
    and how confidence must be represented. Do not create or persist any profile.
expected:
  output_contains: [source samples, no profile]
  output_not_contains: ['Confidence: High', confirmed voice profile, VOICE PROFILE]
