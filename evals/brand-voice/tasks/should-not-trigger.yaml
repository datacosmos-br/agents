id: brand-voice-negative-001
name: Correct one sentence's grammar
description: Avoid constructing a durable identity profile for a local copy edit.
tags: [brand-voice, anti-trigger]
inputs:
  prompt: >-
    Correct the grammar in this sentence without changing its tone: "The tests is green."
expected:
  output_not_contains: [VOICE PROFILE, Source Set, Channel Notes]
