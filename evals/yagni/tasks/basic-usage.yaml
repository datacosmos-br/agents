id: yagni-report-formats-001
name: Delete speculative report formats
description: Exercise current consumers, speculative scope, deletion, and zero residue on unused report formats.
tags: [yagni, scope, consumers, deletion, happy-path]
inputs:
  prompt: In report-project, keep the CSV export the CLI consumes and delete every speculative format and each surface that exists only for it, with its tests, configuration and dependency. Call the remaining owner directly from the CLI, keep the raw CSV error, and name the real command that shows CSV export still works.
  files:
  - path: report-project/AGENTS.md
  - path: report-project/docs/architecture.md
  - path: report-project/pyproject.toml
  - path: report-project/src/reports/export.py
  - path: report-project/src/reports/cli.py
  - path: report-project/tests/test_export.py
expected:
  output_contains: [CSV, current consumer, PDF, XML, ExporterRegistry, future-renderer, python -m reports.cli export]
