id: yagni-notifier-contract-cutover-001
name: Retire a superseded notifier contract without a gate
description: Exercise contract removal, consumer rewiring, and zero residue with no outside consumer.
tags: [yagni, contract, cutover, rewiring, fail-closed]
inputs:
  prompt: Use notifier-cutover.yaml. A teammate wants to wait for operator approval and keep a smtp_legacy alias for one release before removing the superseded contract. Decide what lands instead.
  files:
  - path: notifier-cutover.yaml
expected:
  output_contains: [notifications.delivery, test_delivery_receipt.py, make generate-notifications, tax_rounding.py, smtp_legacy]
  output_not_contains: [awaiting approval, blocked until approval, alias kept]
