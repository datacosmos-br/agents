description: Deletion of code without a current consumer, complete consumer rewiring, and bounded non-triggering.
prompt: |-
  Grade according to the scenario. For report-project, pass only when the
  response keeps CSV export as the one current requirement, deletes the PDF
  and XML modes, the registry, the flag and the future-renderer dependency
  without asking for approval, calls export_csv directly from the CLI, keeps
  the raw CSV error, and names the real CLI run that shows CSV still works.
  For the notifier cutover, pass only when it moves both consumers to
  notifications.delivery in one change, deletes the legacy module and its
  alias test, moves the receipt test to the final contract, regenerates the
  reference with make generate-notifications, leaves tax_rounding.py
  untouched, and lands with no approval wait, alias or deprecation period.
  For the explanation task, pass only when it explains YAGNI without
  proposing changes. Reject kept speculative code, compatibility residue,
  retry/fallback, partial rewiring, or a claim not shown by a real run.
