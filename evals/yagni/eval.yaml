name: yagni-eval
description: Strict necessity evidence, speculative-surface deletion, and bounded non-triggering.
skill: yagni
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/project-wide/yagni
  required_skills:
  - yagni
graders:
- type: prompt
  name: yagni-contract
  config:
    prompt: |
      Grade according to the scenario. For report-project, pass only when the
      response reads the supplied rules, architecture, code, and tests; identifies
      CSV as the sole current requirement/consumer/runtime path; removes unused
      PDF/XML modes, registry, flags, and future dependency completely; preserves
      CSV errors and docs; applies SOLID only to necessary boundaries, simplify
      inline, and DRY only to structural waste; and names runtime plus native
      gates. For the missing-project task, pass only when it blocks speculative
      platform work and names the missing requirement, consumer, owner, runtime,
      and evidence. For the explanation task, pass only when it accurately
      explains YAGNI without proposing repository changes. Reject future-only
      infrastructure, feature-flag burial, compatibility residue, invented usage,
      unsafe deletion, or completion without runtime evidence.
- type: behavior
  name: bounded_execution
  config: {max_duration_ms: 240000}
tasks:
- tasks/*.yaml
