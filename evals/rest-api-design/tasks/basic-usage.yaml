id: rest-api-design-happy-001
name: Design a stable orders collection contract
description: Define a source-backed REST collection with authorization and cursor pagination.
tags: [api, rest, resources, pagination, status-codes, authorization, happy-path]
inputs:
  prompt: >-
    Use orders-api.yaml to define the GET collection contract for orders. Include
    resource URL, query parameters, stable pagination cursor, success envelope,
    authentication and ownership behavior, rate-limit response, and concrete
    400, 403, 422, and 429 error semantics without changing the owned naming convention.
  files:
  - path: orders-api.yaml
expected:
  output_contains: [GET /api/v1/orders, next_cursor, 403 Forbidden, 429 Too Many Requests]
