description: Dart and Flutter lifecycle, state, and test decisions.
prompt: |-
  Grade the flutter-dev response. Pass only when it identifies the asynchronous widget lifecycle
  risk in the fixture, preserves the project's state architecture, proposes a
  material correction, and names a meaningful widget test. Reject detached
  work, catch/retry/fallback, alternate state/routing owners, or a completion
  claim without a real widget-test run.
