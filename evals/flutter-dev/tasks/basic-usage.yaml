id: flutter-lifecycle-001
name: Guard asynchronous UI lifecycle
description: Exercise Flutter Dart applications and SDK development through async lifecycle ownership.
tags: [flutter, dart, widgets, state, testing, async, happy-path]
inputs:
  prompt: Review sample.dart as a detected Flutter/Dart application. Explain the async widget-state lifecycle race, provide the smallest project-compatible liveness correction without detached work/catch/retry/fallback, and describe the widget tests for success and for disposal during persistence.
  files:
  - path: sample.dart
expected:
  output_contains: [mounted, widget, dispos]
