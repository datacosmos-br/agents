id: make-check-scoped-gates-001
name: Select scoped lint and format gates
description: Use command discovery to select native gates for project validation.
tags: [make, native-gates, project-validation, command-discovery, happy-path]
inputs:
  prompt: Perform command discovery from the supplied Makefile, then select its
    declared native gates for project validation. For a change limited to
    src/widget.py, return the exact scoped lint-and-format command and the evidence
    required for green; do not execute it or substitute a raw tool command.
  files:
  - path: Makefile
expected:
  output_contains: [make check, 'CHECK_GATES=lint,format', 'FILES=src/widget.py']
