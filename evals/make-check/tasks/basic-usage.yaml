id: make-check-root-gates-001
name: Select selector-free root validation verbs
description: Use the root Make owner for runtime-first project validation.
tags: [make, native-gates, project-validation, command-ownership, happy-path]
inputs:
  prompt: Read the supplied Makefile and return the exact ordered commands for
    setup, public runtime validation, static validation, and incremental tests.
    Preserve the APPLY acknowledgement and evidence required for green. Do not
    execute commands or substitute an underlying tool.
  files:
  - path: Makefile
expected:
  output_contains: [make setup, make check, make static, make test, runtime before tests, exit code]
  output_not_contains: [python -m, uv run, direct tool, selector]
