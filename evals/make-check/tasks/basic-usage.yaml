id: make-check-scoped-gates-001
name: Select scoped lint and format gates
description: Choose the declared fast path for one changed Python file.
tags: [make, gates, validation, happy-path]
inputs:
  prompt: Find the declared Make validation targets before running any check, test, lint, format, or build command. For a change limited to src/widget.py, select the exact scoped lint-and-format command from Makefile and state the evidence required for green.
  files:
  - path: Makefile
expected:
  output_contains: [make check, 'CHECK_GATES=lint,format', 'FILES=src/widget.py']
