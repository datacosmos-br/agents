id: make-check-released-tool-finding-001
name: Refuse raw-tool substitution and analyzer downgrade
description: Fix newest analyzer findings through the root owner.
tags: [make, owner, released-tool, fail-closed]
inputs:
  prompt: The root Makefile declares setup, generation, check, test, test-full,
    Waza, and build verbs. The newest analyzer reports an error during check.
    Propose the next commands without executing them. Do not downgrade, suppress,
    retry, call the analyzer directly, or construct a hidden mode.
expected:
  output_contains: [make setup APPLY=Y, make check APPLY=Y, root cause, blocking, same verb]
  output_not_contains: [raw analyzer, downgrade, suppression, retry, compatibility]
