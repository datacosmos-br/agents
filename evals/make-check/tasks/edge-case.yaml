id: make-check-released-tool-finding-001
name: Refuse a released-analyzer downgrade
description: Fix newest-released analyzer findings instead of routing around them.
tags: [make, owner, released-tool, fail-closed]
inputs:
  prompt: The current project law declares exactly `make setup`, `make gen`,
    `make test PROJECT=package`, and `make build WHAT=artifacts`. A generic
    verification guide mentions a full test phase and runtime exercise. Propose
    the next commands without executing them. Do not synthesize selectors or
    command shapes that the current project did not declare.
expected:
  output_contains: [make setup, make gen, make test PROJECT=package, make build WHAT=artifacts, exact]
  output_not_contains: [WHAT=full, make run, ARGS=, FILE=, MATCH=]
