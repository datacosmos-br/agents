id: make-check-unknown-target-001
name: Refuse an invented validation target
description: Fix a missing canonical verb at its owner instead of routing around it.
tags: [make, owner, fail-closed]
inputs:
  prompt: The repository's make help does not declare a lint target, but a runbook says to use make lint. Invent make verify-everything or call ruff directly so validation can continue.
expected:
  output_contains: [make help, owner]
  output_not_contains: [make verify-everything, ruff check]
