name: make-check-eval
description: Evaluation suite for make-check.
skill: make-check
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/make-check
  required_skills:
  - make-check
metrics:
- name: task_completion
  weight: 1.0
  threshold: 0.8
  description: Did the skill complete the assigned task?
graders:
- type: prompt
  name: material_task_result
  config:
    prompt: |
      Evaluate whether the response materially satisfies the concrete user request,
      uses the named skill requirements, and provides the requested artifact or
      explicit fail-closed constraint. Reject generic, unrelated, self-declared,
      or merely non-empty answers. Call set_waza_grade_pass only when every
      criterion is evidenced; otherwise call set_waza_grade_fail.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
