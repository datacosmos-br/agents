name: make-check-eval
description: Native Make-gate selection and evidence without raw-tool bypasses.
skill: make-check
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: gpt-5.4
  skill_directories:
  - ../../skills/agent-wide/make-check
  required_skills:
  - make-check
graders:
- type: prompt
  name: make-check-contract
  config:
    prompt: |
      Grade the make-check response. Pass only when it inspects the supplied
      Makefile help contract, chooses the smallest declared native verb and
      scoped arguments for the request, and states the command/cwd/exit/output
      evidence needed for green. Reject raw ruff, pytest, or uv invocations,
      invented targets, destructive targets, or claims without fresh evidence.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
