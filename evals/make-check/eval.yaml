name: make-check-eval
description: Native Make-gate selection and evidence without raw-tool bypasses.
skill: make-check
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  max_attempts: 0
  fail_fast: true
  executor: copilot-sdk
  model: aihub-primary
  skill_directories:
  - ../../skills/agent-wide/personal/make-check
  required_skills:
  - make-check
graders:
- type: prompt
  name: make-check-contract
  config:
    prompt: |-
      Grade the make-check response. Pass only when it inspects the supplied
      Makefile help contract, runs the declared `make setup` first, chooses the smallest declared native verb and
      scoped arguments for the request, and states the command/cwd/exit/output
      evidence needed for green. Existing environments never waive setup. A stale
      generator, exact tool pin, downgrade, or version guard that blocks the
      newest owner is red. A broken required owner must be corrected and
      the native target rerun in the same task. The newest released required tool
      and every diagnostic it emits remain blocking. Reject raw ruff, pytest, or
      uv invocations, invented targets, destructive targets, claims without fresh
      evidence, abandoning a missing target, alternate validation commands, caps,
      downgrades, version overrides, substitutions, suppressions, or compatibility/false-positive
      classifications without prior operator discussion, reproducible evidence,
      and explicit authorization.
- type: behavior
  name: bounded_execution
  config:
    max_duration_ms: 240000
tasks:
- tasks/*.yaml
