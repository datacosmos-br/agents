id: sprint-closure-open-residue-001
name: Refuse closure with open residue
description: One open PR and tracker item keep the entire increment open.
tags: [closure, fail-closed]
inputs:
  prompt: Declare an increment done because local tests pass, although its PR remains open, the tracker item is in progress, and the behavior has not run on the integration branch.
expected:
  output_contains: [not closed, open PR]
  output_not_contains: [increment is DONE, residue set is empty]
