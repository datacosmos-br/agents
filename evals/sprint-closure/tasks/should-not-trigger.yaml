id: sprint-closure-negative-001
name: Summarize a daily stand-up
description: Do not run increment closure for a status-note request.
tags: [anti-trigger]
inputs:
  prompt: |
    Turn these three stand-up notes into one sentence: reviewed logs, paired on
    tests, meeting at 3 PM.
expected:
  output_not_contains: [residue set, PR merged, tracker closed]
