description: Python workload classification, bounded concurrency, and measured proof.
prompt: |-
  Grade the py-parallel response. Pass only when it classifies the supplied workload, uses the
  established concurrency cap, defines cancellation and cleanup, and
  compares observable results with the sequential baseline. Require a bounded
  implementation, first-worker failure propagation, ordered publication of
  complete results only, and no worker left running. Reject an unbounded
  executor, unevidenced primitive, retry/fallback, partial results, or generic
  Python refactor.
