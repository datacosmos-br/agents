id: flext-gates-as-products-orphan-row-002
name: Reject a stale budget row without restoring its retired feature
description: An orphan legacy row is repaired at its writer and consumers.
tags: [flext, gates, fail-closed]
inputs:
  prompt: |-
    The current branch has retired the old budget namespace, but a generated
    projection still carries a budget row. Diagnose the stale writer and
    consumer contract, preserve the failed result, and repair at the current
    configuration/generator owner. Do not recreate the retired namespace to
    satisfy the projection.
expected:
  output_contains: [orphan, divergence, owner, retired]
  output_not_contains: [I will restore the budget namespace, I will delete the row silently]
