id: flext-gates-as-products-budget-rows-001
name: Derive gate budgets from registry
description: Budget rows derive from the registry, never hand-maintained lists.
tags: [flext, gates, happy-path]
inputs:
  prompt: |-
    |-
    Add a new gate as a product: declare its registry entry, derive its budget row, wire its atomic primitive and converged config key, regenerate projections, and prove the fixed point twice.
expected:
  output_contains: [registry, budget row, primitive, config key, fixed point]
  output_not_contains: [hand-edited projection, hardcoded budget]
