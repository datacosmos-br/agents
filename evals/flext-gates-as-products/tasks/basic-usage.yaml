id: flext-gates-as-products-registry-001
name: Derive a gate from its current registry
description: Apply the declared gate contract without reviving a retired budget namespace.
tags: [flext, gates-as-products, registry, atomic-primitives, happy-path]
inputs:
  prompt: |-
    Use scenario.yaml to design the requested flext gate products change. Resolve
    the current registry, configuration ownership and native primitives first;
    the old budget table has been retired. Rewire the declared consumers,
    regenerate at the author and prove the fixed point. Do not invent an API
    name or restore a former product table.
  files:
  - path: scenario.yaml
expected:
  output_contains: [registry, configuration, atomic primitive, owner, fixed point]
  output_not_contains: [I will restore the budget table, I will hand-edit the projection]
