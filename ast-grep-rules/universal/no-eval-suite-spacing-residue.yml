id: no-eval-suite-spacing-residue
language: Yaml
severity: error
message: Minimal suite manifests contain no deletion whitespace residue.
rule:
  all:
  - pattern: |-
      description: $DESCRIPTION
      prompt: $PROMPT
  - regex: '^description:[^\n]*\n(?:[ \t]*\n)+prompt:'
fix: |-
  description: $DESCRIPTION
  prompt: $PROMPT
